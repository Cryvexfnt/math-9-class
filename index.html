<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Інтерактивний Тренажер — Математика & Фізика</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700;800;900&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Montserrat', sans-serif;
        }

        body {
            min-height: 100vh;
            width: 100vw;
            background: radial-gradient(circle at center, #1b0933 0%, #070314 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            overflow-x: hidden;
            position: relative;
            color: #ffffff;
        }

        .background-objects {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            pointer-events: none;
            z-index: 1;
            overflow: hidden;
        }

        .bg-item {
            position: absolute;
            user-select: none;
            transform: translate(-50%, -50%) rotate(var(--rot, 0deg));
            animation: float 6s infinite alternate ease-in-out;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: opacity 0.5s ease;
        }

        .neon-icon {
            width: 44px;
            height: 44px;
            stroke-width: 2.2px;
            opacity: 0.55;
        }

        .neon-cyan {
            stroke: #00f3ff;
            color: #00f3ff;
            filter: drop-shadow(0 0 2px #ffffff) drop-shadow(0 0 6px #00f3ff) drop-shadow(0 0 14px #00f3ff);
        }

        .neon-purple {
            stroke: #bf00ff;
            color: #bf00ff;
            filter: drop-shadow(0 0 2px #ffffff) drop-shadow(0 0 6px #bf00ff) drop-shadow(0 0 14px #bf00ff);
        }

        .neon-pink {
            stroke: #ff007f;
            color: #ff007f;
            filter: drop-shadow(0 0 2px #ffffff) drop-shadow(0 0 6px #ff007f) drop-shadow(0 0 14px #ff007f);
        }

        .d-1 { animation-duration: 5.2s; animation-delay: 0s; }
        .d-2 { animation-duration: 6.8s; animation-delay: 1.2s; }
        .d-3 { animation-duration: 5.8s; animation-delay: 2.1s; }
        .d-4 { animation-duration: 7.4s; animation-delay: 0.6s; }

        @keyframes float {
            0% { transform: translate(-50%, -50%) translateY(0px) rotate(var(--rot, 0deg)) scale(1); }
            100% { transform: translate(-50%, -50%) translateY(-16px) rotate(calc(var(--rot, 0deg) + 10deg)) scale(1.06); }
        }

        /* ПЛАВНАЯ АНИМАЦИЯ ПЕРЕХОДА ЭКРАНОВ */
        @keyframes screenIn {
            0% {
                opacity: 0;
                transform: translateY(20px) scale(0.97);
            }
            100% {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        .screen {
            display: none;
            position: relative;
            z-index: 2;
            width: 100%;
            max-width: 1000px;
            padding: 20px;
            text-align: center;
        }

        .screen.active {
            display: flex;
            flex-direction: column;
            align-items: center;
            animation: screenIn 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        .title {
            font-size: 2.5rem;
            font-weight: 900;
            margin-bottom: 30px;
            color: #ffffff;
            text-transform: uppercase;
            letter-spacing: 2px;
            text-shadow: 0 0 10px #bf00ff, 0 0 20px #bf00ff, 0 0 40px #00f3ff;
        }

        .buttons-wrapper {
            display: flex;
            justify-content: center;
            width: 100%;
            max-width: 750px;
        }

        .subjects-row {
            display: flex;
            gap: 15px;
            width: 100%;
        }

        /* ПЛАВНЫЕ КНОПКИ */
        .btn-subject {
            flex: 1;
            background: rgba(15, 8, 35, 0.85);
            border: 3px solid;
            border-radius: 20px;
            padding: 18px 15px;
            font-size: 1.25rem;
            font-weight: 800;
            color: #ffffff;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            backdrop-filter: blur(10px);
            transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1), 
                        box-shadow 0.3s cubic-bezier(0.16, 1, 0.3, 1), 
                        background-color 0.3s ease;
            outline: none;
            user-select: none;
        }

        .subject-icon {
            font-family: 'Times New Roman', Times, serif;
            font-style: italic;
            font-weight: bold;
            font-size: 1.6rem;
            line-height: 1;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            min-width: 45px;
        }

        .btn-algebra { border-color: #bf00ff; box-shadow: 0 0 15px rgba(191, 0, 255, 0.4); }
        .btn-geometry { border-color: #00f3ff; box-shadow: 0 0 15px rgba(0, 243, 255, 0.4); }
        .btn-physics { border-color: #ff007f; box-shadow: 0 0 15px rgba(255, 0, 127, 0.4); }

        .btn-algebra:hover { transform: translateY(-4px) scale(1.03); box-shadow: 0 0 30px rgba(191, 0, 255, 0.9); background: rgba(191, 0, 255, 0.2); }
        .btn-geometry:hover { transform: translateY(-4px) scale(1.03); box-shadow: 0 0 30px rgba(0, 243, 255, 0.9); background: rgba(0, 243, 255, 0.2); }
        .btn-physics:hover { transform: translateY(-4px) scale(1.03); box-shadow: 0 0 30px rgba(255, 0, 127, 0.9); background: rgba(255, 0, 127, 0.2); }

        .count-grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 15px;
            width: 100%;
            max-width: 650px;
        }

        .btn-count {
            background: rgba(20, 10, 45, 0.85);
            border: 2.5px solid #bf00ff;
            border-radius: 16px;
            padding: 15px 0;
            font-size: 1.5rem;
            font-weight: 800;
            color: #ffffff;
            cursor: pointer;
            backdrop-filter: blur(8px);
            box-shadow: 0 0 12px rgba(191, 0, 255, 0.3);
            transition: transform 0.25s cubic-bezier(0.16, 1, 0.3, 1), 
                        box-shadow 0.25s ease, 
                        background-color 0.25s ease;
        }

        .btn-count:hover {
            transform: translateY(-4px) scale(1.05);
            box-shadow: 0 0 25px #bf00ff;
            background: rgba(191, 0, 255, 0.25);
        }

        /* КНОПКА ВОЗВРАТА */
        .btn-back {
            margin-top: 30px;
            background: rgba(255, 255, 255, 0.05);
            border: 2px solid rgba(255, 255, 255, 0.25);
            color: #ffffff;
            padding: 12px 28px;
            border-radius: 16px;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            backdrop-filter: blur(8px);
            transition: transform 0.25s cubic-bezier(0.16, 1, 0.3, 1), 
                        border-color 0.25s ease, 
                        box-shadow 0.25s ease, 
                        background-color 0.25s ease;
            outline: none;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        .btn-back:hover {
            border-color: #00f3ff;
            box-shadow: 0 0 18px rgba(0, 243, 255, 0.4);
            background: rgba(0, 243, 255, 0.15);
            transform: translateY(-2px);
        }

        .quiz-card {
            background: rgba(18, 9, 38, 0.9);
            border: 2.5px solid #00f3ff;
            box-shadow: 0 0 35px rgba(0, 243, 255, 0.35);
            border-radius: 26px;
            padding: 35px 40px;
            width: 100%;
            backdrop-filter: blur(15px);
            text-align: left;
            position: relative;
            transition: border-color 0.3s ease, box-shadow 0.3s ease;
        }

        .quiz-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
            font-weight: 800;
            color: #00f3ff;
            font-size: 1.15rem;
            gap: 15px;
            flex-wrap: wrap;
        }

        .btn-finish-top {
            background: rgba(255, 0, 85, 0.15);
            border: 2px solid #ff0055;
            color: #ffffff;
            padding: 12px 24px;
            border-radius: 16px;
            font-size: 1rem;
            font-weight: 800;
            cursor: pointer;
            transition: transform 0.25s cubic-bezier(0.16, 1, 0.3, 1), 
                        box-shadow 0.25s ease, 
                        background-color 0.25s ease;
            box-shadow: 0 0 12px rgba(255, 0, 85, 0.3);
            outline: none;
        }

        .btn-finish-top:hover {
            background: rgba(255, 0, 85, 0.4);
            box-shadow: 0 0 25px #ff0055;
            transform: translateY(-2px) scale(1.02);
        }

        .question-text {
            font-size: 1.4rem;
            font-weight: 700;
            line-height: 1.5;
            margin-bottom: 25px;
            color: #ffffff;
        }

        .diagram-container {
            display: flex;
            justify-content: center;
            align-items: center;
            margin-bottom: 20px;
            background: rgba(0, 0, 0, 0.35);
            border-radius: 16px;
            padding: 15px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .options-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 18px;
            margin-bottom: 25px;
        }

        .btn-option {
            background: rgba(30, 15, 60, 0.7);
            border: 2px solid rgba(255, 255, 255, 0.2);
            border-radius: 16px;
            padding: 18px 22px;
            font-size: 1.15rem;
            font-weight: 700;
            color: #ffffff;
            cursor: pointer;
            text-align: left;
            transition: transform 0.25s cubic-bezier(0.16, 1, 0.3, 1), 
                        border-color 0.25s ease, 
                        background-color 0.25s ease, 
                        box-shadow 0.25s ease;
            outline: none;
        }

        .btn-option:hover:not(:disabled) {
            border-color: #00f3ff;
            background: rgba(0, 243, 255, 0.15);
            box-shadow: 0 0 15px rgba(0, 243, 255, 0.4);
            transform: translateY(-2px);
        }

        .btn-option.correct {
            border-color: #00ff66 !important;
            background: rgba(0, 255, 102, 0.25) !important;
            box-shadow: 0 0 20px #00ff66 !important;
            color: #ffffff !important;
        }

        .btn-option.incorrect {
            border-color: #ff0055 !important;
            background: rgba(255, 0, 85, 0.25) !important;
            box-shadow: 0 0 20px #ff0055 !important;
            color: #ffffff !important;
        }

        .explanation-box {
            display: none;
            background: rgba(255, 0, 85, 0.1);
            border: 2px solid #ff0055;
            box-shadow: 0 0 15px rgba(255, 0, 85, 0.3);
            border-radius: 16px;
            padding: 20px;
            margin-top: 15px;
            margin-bottom: 25px;
            font-size: 1.05rem;
            line-height: 1.5;
            color: #ffe6ee;
            animation: screenIn 0.35s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .explanation-box.active {
            display: block;
        }

        .explanation-title {
            font-weight: 800;
            color: #ff0055;
            margin-bottom: 6px;
            text-transform: uppercase;
            font-size: 0.95rem;
            letter-spacing: 1px;
        }

        .quiz-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 25px;
            padding-top: 20px;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            width: 100%;
        }

        .btn-next {
            background: rgba(15, 8, 35, 0.95);
            border: 2.5px solid #ffd700;
            box-shadow: 0 0 18px rgba(255, 215, 0, 0.5);
            color: #ffffff;
            padding: 12px 24px;
            border-radius: 16px;
            font-size: 1rem;
            font-weight: 800;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 10px;
            backdrop-filter: blur(10px);
            transition: transform 0.25s cubic-bezier(0.16, 1, 0.3, 1), 
                        box-shadow 0.25s ease, 
                        background-color 0.25s ease;
        }

        .btn-next:hover {
            transform: translateY(-2px) scale(1.03);
            box-shadow: 0 0 25px #ffd700;
            background: rgba(255, 215, 0, 0.25);
        }

        .results-list {
            width: 100%;
            max-height: 60vh;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 15px;
            padding-right: 10px;
            margin-bottom: 25px;
        }

        .result-item-card {
            background: rgba(20, 10, 45, 0.85);
            border: 2px solid rgba(255, 255, 255, 0.15);
            border-radius: 16px;
            padding: 20px;
            text-align: left;
            transition: transform 0.25s ease;
        }

        .result-item-card.is-correct { border-color: #00ff66; box-shadow: 0 0 10px rgba(0, 255, 102, 0.2); }
        .result-item-card.is-incorrect { border-color: #ff0055; box-shadow: 0 0 10px rgba(255, 0, 85, 0.2); }
        .result-item-card.is-skipped { border-color: #ffd700; box-shadow: 0 0 10px rgba(255, 215, 0, 0.2); }

        .status-badge {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 8px;
            font-weight: 800;
            font-size: 0.85rem;
            margin-bottom: 10px;
            text-transform: uppercase;
        }

        .badge-correct { background: rgba(0, 255, 102, 0.2); color: #00ff66; border: 1px solid #00ff66; }
        .badge-incorrect { background: rgba(255, 0, 85, 0.2); color: #ff0055; border: 1px solid #ff0055; }
        .badge-skipped { background: rgba(255, 215, 0, 0.2); color: #ffd700; border: 1px solid #ffd700; }

        .btn-restart {
            background: rgba(191, 0, 255, 0.2);
            border: 2.5px solid #bf00ff;
            box-shadow: 0 0 20px rgba(191, 0, 255, 0.5);
            color: #ffffff;
            padding: 15px 40px;
            border-radius: 18px;
            font-size: 1.3rem;
            font-weight: 800;
            cursor: pointer;
            transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1), 
                        box-shadow 0.3s ease, 
                        background-color 0.3s ease;
        }

        .btn-restart:hover {
            transform: translateY(-3px) scale(1.05);
            box-shadow: 0 0 35px #bf00ff;
            background: rgba(191, 0, 255, 0.4);
        }

        .toast {
            position: fixed;
            top: 30px;
            left: 50%;
            transform: translateX(-50%) translateY(-100px);
            background: rgba(20, 10, 40, 0.95);
            border: 2px solid #ff007f;
            box-shadow: 0 0 20px #ff007f;
            color: #fff;
            padding: 14px 28px;
            border-radius: 16px;
            font-weight: 800;
            font-size: 1.1rem;
            z-index: 1000;
            opacity: 0;
            transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275), opacity 0.4s ease;
        }

        .toast.show {
            transform: translateX(-50%) translateY(0);
            opacity: 1;
        }

        .modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(5, 2, 15, 0.85);
            backdrop-filter: blur(8px);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }

        .modal-overlay.active {
            display: flex;
            animation: screenIn 0.3s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .modal-card {
            background: rgba(18, 9, 38, 0.95);
            border: 2.5px solid #ff007f;
            box-shadow: 0 0 30px rgba(255, 0, 127, 0.5);
            border-radius: 22px;
            padding: 30px;
            max-width: 420px;
            width: 90%;
            text-align: center;
        }

        .modal-title {
            font-size: 1.3rem;
            font-weight: 800;
            margin-bottom: 25px;
            color: #ffffff;
            line-height: 1.4;
        }

        .modal-buttons {
            display: flex;
            gap: 15px;
            justify-content: center;
        }

        .btn-modal {
            flex: 1;
            padding: 14px 20px;
            border-radius: 14px;
            font-size: 1.1rem;
            font-weight: 800;
            cursor: pointer;
            border: 2.5px solid;
            transition: transform 0.25s cubic-bezier(0.16, 1, 0.3, 1), box-shadow 0.25s ease;
            outline: none;
        }

        .btn-modal-yes {
            background: rgba(0, 255, 102, 0.2);
            border-color: #00ff66;
            color: #ffffff;
            box-shadow: 0 0 12px rgba(0, 255, 102, 0.3);
        }

        .btn-modal-yes:hover {
            background: rgba(0, 255, 102, 0.45);
            box-shadow: 0 0 25px #00ff66;
            transform: scale(1.05);
        }

        .btn-modal-no {
            background: rgba(255, 0, 85, 0.2);
            border-color: #ff0055;
            color: #ffffff;
            box-shadow: 0 0 12px rgba(255, 0, 85, 0.3);
        }

        .btn-modal-no:hover {
            background: rgba(255, 0, 85, 0.45);
            box-shadow: 0 0 25px #ff0055;
            transform: scale(1.05);
        }

        @media (max-width: 650px) {
            .title { font-size: 1.8rem; }
            .subjects-row { flex-direction: column; }
            .count-grid { grid-template-columns: repeat(2, 1fr); }
            .options-grid { grid-template-columns: 1fr; }
            .quiz-footer { flex-direction: column-reverse; gap: 15px; }
            .btn-next, .btn-finish-top { width: 100%; justify-content: center; }
            .quiz-card { padding: 25px 20px; }
        }
    </style>
</head>
<body>

    <div class="toast" id="toast">Повідомлення</div>

    <div class="background-objects" id="bg-container"></div>

    <!-- 1. ВИБІР ПРЕДМЕТА -->
    <div class="screen active" id="screen-subject">
        <h1 class="title">Оберіть предмет</h1>
        <div class="buttons-wrapper">
            <div class="subjects-row">
                <button class="btn-subject btn-algebra" onclick="selectSubject('algebra')">
                    <span class="subject-icon">√x</span>
                    <span>Алгебра</span>
                </button>
                <button class="btn-subject btn-geometry" onclick="selectSubject('geometry')">
                    <span class="subject-icon">∠α</span>
                    <span>Геометрія</span>
                </button>
                <button class="btn-subject btn-physics" onclick="selectSubject('physics')">
                    <span class="subject-icon">E=mc²</span>
                    <span>Фізика</span>
                </button>
            </div>
        </div>
    </div>

    <!-- 2. ВИБІР КІЛЬКОСТІ ЗАВДАНЬ -->
    <div class="screen" id="screen-count">
        <h1 class="title">Кількість завдань</h1>
        <div class="count-grid">
            <button class="btn-count" onclick="startTest(5)">5</button>
            <button class="btn-count" onclick="startTest(10)">10</button>
            <button class="btn-count" onclick="startTest(15)">15</button>
            <button class="btn-count" onclick="startTest(20)">20</button>
            <button class="btn-count" onclick="startTest(25)">25</button>
            <button class="btn-count" onclick="startTest(30)">30</button>
            <button class="btn-count" onclick="startTest(35)">35</button>
            <button class="btn-count" onclick="startTest(40)">40</button>
            <button class="btn-count" onclick="startTest(45)">45</button>
            <button class="btn-count" onclick="startTest(50)">50</button>
        </div>
        <button class="btn-back" onclick="resetToHome()">
            <span>← Повернутися в меню</span>
        </button>
    </div>

    <!-- 3. ТЕСТУВАННЯ -->
    <div class="screen" id="screen-quiz">
        <div class="quiz-card">
            <div class="quiz-header">
                <span id="quiz-progress">Завдання 1 з 10</span>
                <span id="quiz-topic" style="color: #00f3ff;">Тема: ...</span>
            </div>
            
            <div class="question-text" id="question-text">Текст питання...</div>
            
            <div class="diagram-container" id="diagram-container"></div>

            <div class="options-grid" id="options-grid"></div>

            <div class="explanation-box" id="explanation-box">
                <div class="explanation-title">Пояснення:</div>
                <div id="explanation-text">...</div>
            </div>

            <div class="quiz-footer">
                <button class="btn-finish-top" onclick="showConfirmModal()">Завершити тест</button>
                <button class="btn-next" id="btn-next" onclick="skipQuestion()">
                    <span>Пропустити завдання</span>
                    <span>➔</span>
                </button>
            </div>
        </div>
    </div>

    <!-- 4. ФІНІШ -->
    <div class="screen" id="screen-results">
        <h1 class="title">Результати тесту</h1>
        <div class="results-list" id="results-list"></div>
        <button class="btn-restart" onclick="resetToHome()">На головну</button>
    </div>

    <!-- МОДАЛЬНЕ ВІКНО ПІДТВЕРДЖЕННЯ -->
    <div class="modal-overlay" id="confirm-modal">
        <div class="modal-card">
            <div class="modal-title">Ви впевнені, що хочете завершити тест?</div>
            <div class="modal-buttons">
                <button class="btn-modal btn-modal-yes" onclick="confirmFinishTest()">Так</button>
                <button class="btn-modal btn-modal-no" onclick="closeConfirmModal()">Ні</button>
            </div>
        </div>
    </div>

    <script>
        const algebraIcons = ['calculator', 'percent', 'hash', 'binary', 'bar-chart-2', 'trending-up', 'sparkles'];
        const geometryIcons = ['triangle', 'square', 'circle', 'box', 'compass', 'ruler', 'layers'];
        const physicsIcons = ['zap', 'battery-charging', 'cpu', 'thermometer', 'activity', 'magnet', 'flame'];

        function renderBackground(iconsList) {
            const bgContainer = document.getElementById('bg-container');
            bgContainer.innerHTML = '';
            
            const fragment = document.createDocumentFragment();
            const colorClasses = ['neon-cyan', 'neon-purple', 'neon-pink'];
            const coords = [
                {x: 7, y: 10, r: -25}, {x: 22, y: 14, r: 18}, {x: 38, y: 8, r: -12}, {x: 54, y: 12, r: 30}, {x: 72, y: 9, r: -15}, {x: 90, y: 13, r: 22},
                {x: 12, y: 32, r: 35}, {x: 28, y: 35, r: -20}, {x: 45, y: 28, r: 15}, {x: 62, y: 33, r: -30}, {x: 82, y: 30, r: 10},
                {x: 6, y: 58, r: -18}, {x: 20, y: 62, r: 25}, {x: 80, y: 55, r: -22}, {x: 94, y: 60, r: 16},
                {x: 10, y: 85, r: 20}, {x: 26, y: 88, r: -28}, {x: 42, y: 82, r: 14}, {x: 58, y: 89, r: -18}, {x: 74, y: 84, r: 32}, {x: 90, y: 87, r: -10}
            ];

            coords.forEach((pt, idx) => {
                const item = document.createElement('div');
                item.className = `bg-item d-${(idx % 4) + 1}`;
                item.style.left = `${pt.x}%`;
                item.style.top = `${pt.y}%`;
                item.style.setProperty('--rot', `${pt.r}deg`);

                const icon = iconsList[idx % iconsList.length];
                const color = colorClasses[idx % colorClasses.length];

                item.innerHTML = `<i data-lucide="${icon}" class="neon-icon ${color}"></i>`;
                fragment.appendChild(item);
            });

            bgContainer.appendChild(fragment);
            lucide.createIcons();
        }

        renderBackground(algebraIcons);

        function showToast(msg) {
            const toast = document.getElementById('toast');
            toast.innerText = msg;
            toast.classList.add('show');
            setTimeout(() => toast.classList.remove('show'), 3000);
        }

        let currentSubject = 'algebra';
        let totalQuestionsCount = 10;
        let currentQuestionIndex = 0;
        let questionsData = [];
        let userAnswers = [];
        let isAnsweredCurrent = false;

        function selectSubject(subject) {
            currentSubject = subject;
            if (subject === 'algebra') {
                renderBackground(algebraIcons);
            } else if (subject === 'geometry') {
                renderBackground(geometryIcons);
            } else if (subject === 'physics') {
                renderBackground(physicsIcons);
            }

            showScreen('screen-count');
        }

        function showScreen(screenId) {
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            document.getElementById(screenId).classList.add('active');
        }

        function resetToHome() {
            showScreen('screen-subject');
        }

        function showConfirmModal() {
            document.getElementById('confirm-modal').classList.add('active');
        }

        function closeConfirmModal() {
            document.getElementById('confirm-modal').classList.remove('active');
        }

        function confirmFinishTest() {
            closeConfirmModal();
            finishTest();
        }

        /* SVG ГЕНЕРАТОРЫ ИЛЛЮСТРАЦИЙ */
        function drawRaySVG(val, isClosed, directionRight) {
            const circleFill = isClosed ? "#00f3ff" : "#070414";
            const lineStartX = directionRight ? 130 : 25;
            const lineEndX = directionRight ? 255 : 130;

            return `<svg width="290" height="90" viewBox="0 0 290 90">
                <line x1="15" y1="50" x2="265" y2="50" stroke="#bf00ff" stroke-width="3"/>
                <polygon points="265,45 278,50 265,55" fill="#bf00ff"/>
                <text x="270" y="70" fill="#bf00ff" font-weight="800" font-size="14">x</text>
                <line x1="${lineStartX}" y1="50" x2="${lineEndX}" y2="50" stroke="#00f3ff" stroke-width="7" opacity="0.85"/>
                <circle cx="130" cy="50" r="7" fill="${circleFill}" stroke="#00f3ff" stroke-width="3"/>
                <text x="124" y="75" fill="#00f3ff" font-weight="800" font-size="15">${val}</text>
            </svg>`;
        }

        function drawRightTriangleSVG(a, b, c) {
            return `<svg width="220" height="130" viewBox="0 0 220 130">
                <polygon points="30,100 180,100 30,20" fill="rgba(0, 243, 255, 0.1)" stroke="#00f3ff" stroke-width="3"/>
                <rect x="30" y="85" width="15" height="15" fill="none" stroke="#ff007f" stroke-width="2"/>
                <text x="100" y="118" fill="#ffffff" font-weight="800" font-size="14">${a}</text>
                <text x="10" y="65" fill="#ffffff" font-weight="800" font-size="14">${b}</text>
                <text x="110" y="55" fill="#00f3ff" font-weight="800" font-size="14">${c}</text>
            </svg>`;
        }

        function drawCircleSVG(r) {
            return `<svg width="160" height="140" viewBox="0 0 160 140">
                <circle cx="80" cy="70" r="55" fill="rgba(191, 0, 255, 0.1)" stroke="#bf00ff" stroke-width="3"/>
                <circle cx="80" cy="70" r="4" fill="#00f3ff"/>
                <line x1="80" y1="70" x2="135" y2="70" stroke="#00f3ff" stroke-width="3" stroke-dasharray="4,4"/>
                <text x="95" y="63" fill="#00f3ff" font-weight="800" font-size="14">R = ${r}</text>
            </svg>`;
        }

        /* ГЕНЕРАТОРЫ ЗАДАЧ */
        const algebraGenerators = [
            () => {
                const a = 2 + Math.floor(Math.random() * 5);
                const val = (Math.floor(Math.random() * 10) - 4) * a;
                const res = val / a;
                return {
                    topic: "Лінійні нерівності",
                    text: `Розв'яжіть лінійну нерівність: ${a}x > ${val}`,
                    diagram: drawRaySVG(res, false, true),
                    correctVal: `x > ${res}`,
                    wrongs: [`x < ${res}`, `x > ${res * 2}`, `x < ${res - 1}`],
                    explanation: `Поділимо обидві частини на додатне число ${a}. Знак нерівності не змінюється: x > ${val} / ${a} ⇒ x > ${res}.`
                };
            },
            () => {
                const num = Math.floor(Math.random() * 10) - 5;
                return {
                    topic: "Числові проміжки",
                    text: `Запишіть розв'язок нерівності x > ${num} у вигляді числового проміжку.`,
                    diagram: drawRaySVG(num, false, true),
                    correctVal: `(${num}; +∞)`,
                    wrongs: [`[${num}; +∞)`, `(-∞; ${num})`, `(-∞; ${num}]`],
                    explanation: `Строга нерівність (>) відповідає відкритому проміжку з круглою дужкою: (${num}; +∞).`
                };
            },
            () => {
                const x1 = Math.floor(Math.random() * 5) + 1;
                const x2 = Math.floor(Math.random() * 5) + 6;
                const sum = x1 + x2;
                const prod = x1 * x2;
                return {
                    topic: "Квадратні рівняння",
                    text: `Знайдіть суму коренів рівняння: x² - ${sum}x + ${prod} = 0`,
                    diagram: '',
                    correctVal: `${sum}`,
                    wrongs: [`${-sum}`, `${prod}`, `${x1}`],
                    explanation: `За теоремою Вієта для зведеного квадратного рівняння x² + px + q = 0, сума коренів дорівнює -p. Тут p = -${sum}, тому сума = ${sum}.`
                };
            }
        ];

        const geometryGenerators = [
            () => {
                const a = 3 * (Math.floor(Math.random() * 3) + 1);
                const b = 4 * (a / 3);
                const c = 5 * (a / 3);
                return {
                    topic: "Теорема Піфагора",
                    text: `Знайдіть гіпотенузу прямокутного трикутника з катетами a = ${a} та b = ${b}.`,
                    diagram: drawRightTriangleSVG(`a=${a}`, `b=${b}`, `c=?`),
                    correctVal: `${c}`,
                    wrongs: [`${c + 2}`, `${a + b}`, `${c - 1}`],
                    explanation: `За теоремою Піфагора: c² = a² + b² = ${a}² + ${b}² = ${a*a} + ${b*b} = ${c*c}. Отже, c = ${c}.`
                };
            },
            () => {
                const r = Math.floor(Math.random() * 8) + 2;
                const area = r * r;
                return {
                    topic: "Площа круга",
                    text: `Знайдіть площу круга радіуса R = ${r}.`,
                    diagram: drawCircleSVG(r),
                    correctVal: `${area}π`,
                    wrongs: [`${2 * r}π`, `${area * 2}π`, `${r}π`],
                    explanation: `Площа круга обчислюється за формулою S = πR². При R = ${r}, S = π · ${r}² = ${area}π.`
                };
            }
        ];

        const physicsGenerators = [
            () => {
                const u = (Math.floor(Math.random() * 5) + 1) * 10;
                const r = Math.floor(Math.random() * 5) + 2;
                const i = (u / r).toFixed(1);
                return {
                    topic: "Закон Ома",
                    text: `Яка сила струму в провіднику опором ${r} Ом при напрузі ${u} В?`,
                    diagram: '',
                    correctVal: `${i} А`,
                    wrongs: [`${(u * r).toFixed(0)} А`, `${(r / u).toFixed(2)} А`, `${(i * 2).toFixed(1)} А`],
                    explanation: `За законом Ома: I = U / R. Отже, I = ${u} В / ${r} Ом = ${i} А.`
                };
            },
            () => {
                const v = (Math.floor(Math.random() * 6) + 2) * 10;
                const t = Math.floor(Math.random() * 4) + 2;
                const s = v * t;
                return {
                    topic: "Рівномірний рух",
                    text: `Автомобіль рухається зі швидкістю ${v} км/год. Який шлях він подолає за ${t} год?`,
                    diagram: '',
                    correctVal: `${s} км`,
                    wrongs: [`${(v / t).toFixed(0)} км`, `${s + 20} км`, `${s - 15} км`],
                    explanation: `Формула шляху: S = v · t. S = ${v} км/год · ${t} год = ${s} км.`
                };
            }
        ];

        function startTest(count) {
            totalQuestionsCount = count;
            currentQuestionIndex = 0;
            userAnswers = [];

            let generators = algebraGenerators;
            if (currentSubject === 'geometry') generators = geometryGenerators;
            if (currentSubject === 'physics') generators = physicsGenerators;

            questionsData = [];
            for (let i = 0; i < count; i++) {
                const gen = generators[i % generators.length];
                const q = gen();
                
                // Перемешиваем варианты
                const options = [q.correctVal, ...q.wrongs].sort(() => Math.random() - 0.5);
                questionsData.push({
                    ...q,
                    options: options
                });
            }

            showScreen('screen-quiz');
            renderQuestion();
        }

        function renderQuestion() {
            isAnsweredCurrent = false;
            const q = questionsData[currentQuestionIndex];

            document.getElementById('quiz-progress').innerText = `Завдання ${currentQuestionIndex + 1} з ${totalQuestionsCount}`;
            document.getElementById('quiz-topic').innerText = `Тема: ${q.topic}`;
            document.getElementById('question-text').innerText = q.text;

            const diagBox = document.getElementById('diagram-container');
            if (q.diagram) {
                diagBox.style.display = 'flex';
                diagBox.innerHTML = q.diagram;
            } else {
                diagBox.style.display = 'none';
                diagBox.innerHTML = '';
            }

            const optionsGrid = document.getElementById('options-grid');
            optionsGrid.innerHTML = '';

            q.options.forEach((opt) => {
                const btn = document.createElement('button');
                btn.className = 'btn-option';
                btn.innerText = opt;
                btn.onclick = () => selectOption(btn, opt);
                optionsGrid.appendChild(btn);
            });

            const expBox = document.getElementById('explanation-box');
            expBox.classList.remove('active');

            const nextBtn = document.getElementById('btn-next');
            nextBtn.innerHTML = `<span>Пропустити завдання</span> <span>➔</span>`;
        }

        function selectOption(selectedBtn, selectedVal) {
            if (isAnsweredCurrent) return;
            isAnsweredCurrent = true;

            const q = questionsData[currentQuestionIndex];
            const isCorrect = (selectedVal === q.correctVal);

            const allBtns = document.querySelectorAll('.btn-option');
            allBtns.forEach(btn => {
                btn.disabled = true;
                if (btn.innerText === q.correctVal) {
                    btn.classList.add('correct');
                }
            });

            if (!isCorrect) {
                selectedBtn.classList.add('incorrect');
                const expBox = document.getElementById('explanation-box');
                document.getElementById('explanation-text').innerText = q.explanation;
                expBox.classList.add('active');
            }

            userAnswers.push({
                question: q.text,
                selected: selectedVal,
                correct: q.correctVal,
                isCorrect: isCorrect,
                skipped: false
            });

            const nextBtn = document.getElementById('btn-next');
            nextBtn.innerHTML = `<span>Далі</span> <span>➔</span>`;
        }

        function skipQuestion() {
            if (!isAnsweredCurrent) {
                const q = questionsData[currentQuestionIndex];
                userAnswers.push({
                    question: q.text,
                    selected: 'Пропущено',
                    correct: q.correctVal,
                    isCorrect: false,
                    skipped: true
                });
            }

            currentQuestionIndex++;
            if (currentQuestionIndex < totalQuestionsCount) {
                renderQuestion();
            } else {
                finishTest();
            }
        }

        function finishTest() {
            showScreen('screen-results');
            const resultsList = document.getElementById('results-list');
            resultsList.innerHTML = '';

            let correctCount = 0;

            userAnswers.forEach((ans, idx) => {
                if (ans.isCorrect) correctCount++;

                const card = document.createElement('div');
                let cardClass = ans.isCorrect ? 'is-correct' : (ans.skipped ? 'is-skipped' : 'is-incorrect');
                let badgeClass = ans.isCorrect ? 'badge-correct' : (ans.skipped ? 'badge-skipped' : 'badge-incorrect');
                let badgeText = ans.isCorrect ? 'Правильно' : (ans.skipped ? 'Пропущено' : 'Неправильно');

                card.className = `result-item-card ${cardClass}`;
                card.innerHTML = `
                    <span class="status-badge ${badgeClass}">${badgeText}</span>
                    <div style="font-weight: 700; margin-bottom: 8px;">${idx + 1}. ${ans.question}</div>
                    <div style="font-size: 0.95rem; opacity: 0.9;">Ваш відповідь: <b>${ans.selected}</b></div>
                    ${!ans.isCorrect ? `<div style="font-size: 0.95rem; color: #00f3ff; margin-top: 4px;">Правильна відповідь: <b>${ans.correct}</b></div>` : ''}
                `;
                resultsList.appendChild(card);
            });

            showToast(`Тест завершено! Результат: ${correctCount} з ${userAnswers.length}`);
        }
    </script>
</body>
</html>

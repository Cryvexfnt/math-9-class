<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <title>Інтерактивний тренажер з фізики</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f4f7f6;
      margin: 0;
      padding: 20px;
      display: flex;
      justify-content: center;
    }
    .container {
      width: 100%;
      max-width: 650px;
      background: #ffffff;
      padding: 25px;
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.1);
    }
    .hidden { display: none; }
    h2, h3 { color: #2c3e50; text-align: center; }
    
    /* Кнопки вибору предмета */
    .btn-subject {
      display: block;
      width: 100%;
      padding: 15px;
      margin: 10px 0;
      font-size: 18px;
      font-weight: bold;
      color: #fff;
      background-color: #3498db;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      transition: background 0.2s;
    }
    .btn-subject:hover { background-color: #2980b9; }

    /* Пошук */
    .search-input {
      width: 100%;
      padding: 12px;
      font-size: 16px;
      border: 2px solid #bdc3c7;
      border-radius: 6px;
      box-sizing: border-box;
      margin-bottom: 15px;
    }

    /* Таблиця з ползунком */
    .topics-table-container {
      max-height: 280px;
      overflow-y: auto;
      border: 1px solid #dcdde1;
      border-radius: 6px;
    }
    .topics-table {
      width: 100%;
      border-collapse: collapse;
    }
    .topics-table td {
      padding: 12px 15px;
      border-bottom: 1px solid #f1f2f6;
      cursor: pointer;
    }
    .topics-table tr:hover {
      background-color: #e8f4f8;
    }
    .topic-badge {
      font-weight: bold;
      color: #2980b9;
      margin-right: 8px;
    }

    /* Питання та варіанти */
    .option-btn {
      display: block;
      width: 100%;
      padding: 12px;
      margin: 8px 0;
      font-size: 16px;
      background-color: #ecf0f1;
      border: 1px solid #bdc3c7;
      border-radius: 6px;
      cursor: pointer;
      text-align: left;
    }
    .option-btn:hover { background-color: #dcdde1; }

    /* Фінальні кнопки */
    .end-btn-group {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-top: 20px;
    }
    .btn-main {
      padding: 12px;
      font-size: 16px;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-weight: bold;
      color: white;
    }
    .btn-menu { background-color: #e74c3c; }
    .btn-menu:hover { background-color: #c0392b; }
    .btn-topics { background-color: #2ecc71; }
    .btn-topics:hover { background-color: #27ae60; }
  </style>
</head>
<body>

<div class="container">
  <!-- ЕКРАН 1: Вибір предмета -->
  <div id="screen-subjects">
    <h2>Оберіть предмет</h2>
    <button class="btn-subject" onclick="openSubject('physics9')">Фізика 9 клас</button>
  </div>

  <!-- ЕКРАН 2: Таблиця тем із пошуком -->
  <div id="screen-topics" class="hidden">
    <h2>Розділ 1. Електричний струм у різних середовищах</h2>
    <input type="text" id="searchInput" class="search-input" placeholder="Пошук теми (наприклад: Еле...)" oninput="filterTopics()">
    
    <div class="topics-table-container">
      <table class="topics-table" id="topicsTable">
        <tbody id="topicsTableBody">
          <!-- Динамічно заповнюється JS -->
        </tbody>
      </table>
    </div>
    <br>
    <button class="btn-main btn-menu" style="width:100%" onclick="showScreen('screen-subjects')">Вийти в меню</button>
  </div>

  <!-- ЕКРАН 3: Проходження тесту -->
  <div id="screen-quiz" class="hidden">
    <h3 id="quizTopicTitle"></h3>
    <hr>
    <p id="questionText" style="font-size: 18px; font-weight: bold;"></p>
    <div id="optionsContainer"></div>
  </div>

  <!-- ЕКРАН 4: Закінчення гри -->
  <div id="screen-end" class="hidden">
    <h2>Вітаємо! Тест завершено</h2>
    <p id="resultText" style="font-size: 18px; text-align: center;"></p>
    
    <div class="end-btn-group">
      <button class="btn-main btn-menu" onclick="showScreen('screen-subjects')">Вийти в меню</button>
      <button class="btn-main btn-topics" onclick="showScreen('screen-topics')">Перейти обратно к темам</button>
    </div>
  </div>
</div>

<script>
  // Масив тем згідно з ПДФ файлом
  const topicsData = [
    { id: 't0', num: 'Повторення', title: 'Фізична база: що вже знаємо з теми «Електрика»' },
    { id: 't1', num: '§ 1', title: 'Електричний струм у металах' },
    { id: 't2', num: 'Лабораторна робота № 1', title: 'Дослідження залежності електричного опору металевого провідника від температури' },
    { id: 't3', num: '§ 2', title: 'Електричний струм у розчинах і розплавах електролітів' },
    { id: 't4', num: '§ 3', title: 'Застосування електролізу' },
    { id: 't5', num: 'Лабораторна робота № 2', title: 'Визначення електрохімічного еквівалента міді' },
    { id: 't6', num: '§ 4', title: 'Електричний струм у газах' },
    { id: 't7', num: '§ 5', title: 'Види самостійних газових розрядів' }
  ];

  // Банк завдань (строго прив'язані до тем)
  const questionsBank = {
    't0': [
      { q: "Яка одиниця вимірювання електричного заряду в СІ?", opts: ["Кулон (Кл)", "Ампер (А)", "Вольт (В)", "Ом (Ом)"], correct: 0 },
      { q: "Модуль елементарного заряду становить e = 1,6 · 10<sup>-19</sup> Кл. Який знак має заряд електрона?", opts: ["Негативний (-)", "Позитивний (+)", "Нейтральний (0)", "Змінний"], correct: 0 }
    ],
    't1': [
      { q: "Що являє собою електричний струм у металах?", opts: ["Напрямлений рух вільних електронів", "Рух позитивних йонiв", "Рух нейтральних атомiв", "Хаотичний рух молекул"], correct: 0 },
      { q: "Як змінюється опір металевого провідника під час підвищення температури?", opts: ["Збільшується", "Зменшується", "Не змінюється", "Падає до нуля"], correct: 0 }
    ],
    't2': [
      { q: "Який прилад використовується для безпосереднього вимірювання електричного опору?", opts: ["Омметр (мультиметр)", "Вольтметр", "Амперметр", "Термометр"], correct: 0 }
    ],
    't3': [
      { q: "Що являє собою електричний струм в електролітах?", opts: ["Напрямлений рух позитивних і негативних йонів", "Напрямлений рух вільних електронів", "Рух фотонів", "Поток електронних лавин"], correct: 0 },
      { q: "Як називається процес розпаду електроліту на йони під дією полярних молекул розчинника?", opts: ["Електролітична дисоціація", "Рекомбінація", "Йонізація", "Рафінування"], correct: 0 }
    ],
    't4': [
      { q: "Як називається спосіб покриття виробу тонким шаром металу за допомогою електролізу?", opts: ["Гальваностегія", "Гальванопластика", "Рафінування", "Дисоціація"], correct: 0 },
      { q: "За яким законом обчислюють масу речовини, виділеної під час електролізу: m = k · I · t?", opts: ["Перший закон Фарадея", "Закон Ома", "Закон Джоуля-Ленца", "Закон Кулона"], correct: 0 }
    ],
    't5': [
      { q: "Одиницею вимірювання електрохімічного еквівалента k у СІ є:", opts: ["кг/Кл", "мг/Кл", "Кл/кг", "А/с"], correct: 0 }
    ],
    't6': [
      { q: "Електричний струм у йонізованих газах (плазмі) — це напрямлений рух:", opts: ["Вільних електронів, позитивних і негативних йонів", "Тільки вільних електронів", "Тільки молекул води", "Нейтральних атомів"], correct: 0 },
      { q: "Газовий розряд, який відбувається тільки за наявності зовнішнього йонізатора, називають:", opts: ["Несамостійним", "Самостійним", "Іскровим", "Тліючим"], correct: 0 }
    ],
    't7': [
      { q: "Грандіозним прикладом іскрового газового розряду в природі є:", opts: ["Блискавка", "Веселка", "Полярне сяйво", "Туман"], correct: 0 },
      { q: "Яке явище лежить в основі розвитку електронної лавини при самостійному розряді?", opts: ["Ударна йонізація (йонізація електронним ударом)", "Електролітична дисоціація", "Рафінування", "Рекомбінація"], correct: 0 }
    ]
  };

  let currentTopicId = null;
  let currentQuestions = [];
  let currentQuestionIndex = 0;
  let score = 0;

  function showScreen(screenId) {
    document.querySelectorAll('.container > div').forEach(div => div.classList.add('hidden'));
    document.getElementById(screenId).classList.remove('hidden');
  }

  function openSubject(subj) {
    if(subj === 'physics9') {
      renderTopicsTable(topicsData);
      showScreen('screen-topics');
    }
  }

  function renderTopicsTable(data) {
    const tbody = document.getElementById('topicsTableBody');
    tbody.innerHTML = '';
    data.forEach(item => {
      const tr = document.createElement('tr');
      tr.onclick = () => startQuiz(item.id, `[${item.num}][${item.title}]`);
      tr.innerHTML = `<td><span class="topic-badge">[${item.num}]</span>[${item.title}]</td>`;
      tbody.appendChild(tr);
    });
  }

  function filterTopics() {
    const query = document.getElementById('searchInput').value.toLowerCase();
    const filtered = topicsData.filter(item => 
      item.num.toLowerCase().includes(query) || 
      item.title.toLowerCase().includes(query)
    );
    renderTopicsTable(filtered);
  }

  function startQuiz(topicId, fullTitle) {
    currentTopicId = topicId;
    currentQuestions = questionsBank[topicId] || [];
    if(currentQuestions.length === 0) {
      alert("Для цієї теми ще не додано запитань.");
      return;
    }
    currentQuestionIndex = 0;
    score = 0;
    document.getElementById('quizTopicTitle').innerText = fullTitle;
    showScreen('screen-quiz');
    displayQuestion();
  }

  function displayQuestion() {
    const qData = currentQuestions[currentQuestionIndex];
    document.getElementById('questionText').innerHTML = `Запитання ${currentQuestionIndex + 1}/${currentQuestions.length}: ${qData.q}`;
    const optsContainer = document.getElementById('optionsContainer');
    optsContainer.innerHTML = '';

    qData.opts.forEach((opt, idx) => {
      const btn = document.createElement('button');
      btn.className = 'option-btn';
      btn.innerHTML = opt;
      btn.onclick = () => handleAnswer(idx);
      optsContainer.appendChild(btn);
    });
  }

  function handleAnswer(selectedIndex) {
    if(selectedIndex === currentQuestions[currentQuestionIndex].correct) {
      score++;
    }
    currentQuestionIndex++;
    if(currentQuestionIndex < currentQuestions.length) {
      displayQuestion();
    } else {
      finishQuiz();
    }
  }

  function finishQuiz() {
    document.getElementById('resultText').innerText = `Ви відповіли правильно на ${score} з ${currentQuestions.length} запитань!`;
    showScreen('screen-end');
  }
</script>

</body>
</html>

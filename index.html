<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Математика 9 Клас</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;800;900&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Montserrat', sans-serif;
        }

        body {
            min-height: 100vh;
            width: 100vw;
            background: radial-gradient(circle at center, #1a0933 0%, #0b071e 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            position: relative;
            color: #ffffff;
        }

        /* --- СЕТКА НЕОНОВОЙ КАНЦЕЛЯРИИ НА ВЕСЬ ЭКРАН --- */
        .background-objects {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1;
            display: grid;
            grid-template-columns: repeat(6, 1fr);
            grid-template-rows: repeat(4, 1fr);
            align-items: center;
            justify-items: center;
            padding: 20px;
        }

        .bg-item {
            font-size: 2.6rem;
            opacity: 0.35;
            user-select: none;
            animation: float 6s ease-in-out infinite alternate;
        }

        /* Неоновое свечение предметов на фоне */
        .neon-cyan { filter: drop-shadow(0 0 12px #00f3ff); }
        .neon-purple { filter: drop-shadow(0 0 12px #bf00ff); }
        .neon-pink { filter: drop-shadow(0 0 12px #ff007f); }

        /* Разные фазы анимации для эффекта хаоса */
        .d-1 { animation-duration: 5s; animation-delay: 0s; }
        .d-2 { animation-duration: 7s; animation-delay: 1s; }
        .d-3 { animation-duration: 6s; animation-delay: 2s; }
        .d-4 { animation-duration: 8s; animation-delay: 0.5s; }

        @keyframes float {
            0% { transform: translateY(0px) rotate(0deg) scale(1); }
            100% { transform: translateY(-18px) rotate(15deg) scale(1.08); }
        }

        /* --- ЦЕНТРАЛЬНЫЙ БЛОК --- */
        .main-container {
            position: relative;
            z-index: 2;
            text-align: center;
            width: 100%;
            max-width: 900px;
            padding: 20px;
        }

        .title {
            font-size: 3.2rem;
            font-weight: 900;
            margin-bottom: 45px;
            color: #ffffff;
            text-transform: uppercase;
            letter-spacing: 2px;
            text-shadow: 
                0 0 10px #bf00ff,
                0 0 20px #bf00ff,
                0 0 40px #00f3ff;
        }

        /* --- КНОПКИ --- */
        .buttons-wrapper {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 30px;
            flex-wrap: wrap;
        }

        .btn-subject {
            background: rgba(15, 8, 35, 0.85);
            border: 3px solid;
            border-radius: 20px;
            padding: 18px 35px;
            font-size: 1.8rem;
            font-weight: 800;
            color: #ffffff;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 15px;
            backdrop-filter: blur(10px);
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            outline: none;
            user-select: none;
        }

        .btn-geometry {
            border-color: #00f3ff;
            box-shadow: 0 0 15px rgba(0, 243, 255, 0.4), inset 0 0 15px rgba(0, 243, 255, 0.2);
        }

        .btn-algebra {
            border-color: #bf00ff;
            box-shadow: 0 0 15px rgba(191, 0, 255, 0.4), inset 0 0 15px rgba(191, 0, 255, 0.2);
        }

        .btn-geometry:hover {
            transform: scale(1.08);
            box-shadow: 0 0 30px rgba(0, 243, 255, 0.9), inset 0 0 20px rgba(0, 243, 255, 0.5);
            background: rgba(0, 243, 255, 0.2);
        }

        .btn-algebra:hover {
            transform: scale(1.08);
            box-shadow: 0 0 30px rgba(191, 0, 255, 0.9), inset 0 0 20px rgba(191, 0, 255, 0.5);
            background: rgba(191, 0, 255, 0.2);
        }

        .btn-subject:active {
            transform: scale(0.98);
        }

        .icon {
            font-size: 2rem;
            line-height: 1;
        }

        .math-symbol {
            font-family: serif;
            font-style: italic;
            font-weight: bold;
        }

        @media (max-width: 650px) {
            .title { font-size: 2.2rem; }
            .buttons-wrapper { flex-direction: column; }
            .btn-subject { width: 100%; font-size: 1.5rem; }
            .background-objects {
                grid-template-columns: repeat(4, 1fr);
                grid-template-rows: repeat(6, 1fr);
            }
        }
    </style>
</head>
<body>

    <!-- Канцуха на весь экран (24 предмета) -->
    <div class="background-objects">
        <span class="bg-item neon-cyan d-1">📐</span>
        <span class="bg-item neon-purple d-2">📏</span>
        <span class="bg-item neon-pink d-3">✏️</span>
        <span class="bg-item neon-cyan d-4">🖊️</span>
        <span class="bg-item neon-purple d-1">🧭</span>
        <span class="bg-item neon-pink d-2">📊</span>

        <span class="bg-item neon-pink d-3">✂️</span>
        <span class="bg-item neon-cyan d-4">🧮</span>
        <span class="bg-item neon-purple d-1">📝</span>
        <span class="bg-item neon-pink d-2">📐</span>
        <span class="bg-item neon-cyan d-3">🖊️</span>
        <span class="bg-item neon-purple d-4">📏</span>

        <span class="bg-item neon-purple d-1">🧭</span>
        <span class="bg-item neon-pink d-2">✏️</span>
        <span class="bg-item neon-cyan d-3">📊</span>
        <span class="bg-item neon-purple d-4">🧮</span>
        <span class="bg-item neon-pink d-1">📐</span>
        <span class="bg-item neon-cyan d-2">🖊️</span>

        <span class="bg-item neon-cyan d-3">📏</span>
        <span class="bg-item neon-purple d-4">✂️</span>
        <span class="bg-item neon-pink d-1">✏️</span>
        <span class="bg-item neon-cyan d-2">🧭</span>
        <span class="bg-item neon-purple d-3">📝</span>
        <span class="bg-item neon-pink d-4">🧮</span>
    </div>

    <div class="main-container">
        <h1 class="title">Оберіть предмет</h1>
        
        <div class="buttons-wrapper">
            <!-- Геометрия -->
            <button class="btn-subject btn-geometry" onclick="onSubjectClick('Геометрія')">
                <span class="icon">📏</span>
                <span>Геометрія</span>
                <span class="icon">✏️</span>
            </button>

            <!-- Алгебра (Шариковая ручка 🖊️) -->
            <button class="btn-subject btn-algebra" onclick="onSubjectClick('Алгебра')">
                <span class="icon">🖊️</span>
                <span>Алгебра</span>
                <span class="icon math-symbol">√x</span>
            </button>
        </div>
    </div>

    <script>
        function onSubjectClick(subjectName) {
            console.log("Вибрано предмет: " + subjectName);
        }
    </script>

</body>
</html>

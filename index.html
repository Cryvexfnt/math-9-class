<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Математика 9 Клас</title>
    <!-- Шрифт Montserrat -->
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;800;900&display=swap" rel="stylesheet">
    <!-- Иконки Lucide для неонового фона -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Montserrat', sans-serif;
        }

        body {
            min-height: 100vh;
            width: 100vw;
            background: radial-gradient(circle at center, #180830 0%, #070414 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            position: relative;
            color: #ffffff;
        }

        /* --- СЕТКА НЕОНОВОЙ КАНЦЕЛЯРИИ НА ФОНЕ (ТОЛЬКО 5 ПРЕДМЕТОВ) --- */
        .background-objects {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1;
            display: grid;
            grid-template-columns: repeat(6, 1fr);
            grid-template-rows: repeat(4, 1fr);
            align-items: center;
            justify-items: center;
            padding: 20px;
        }

        .bg-item {
            user-select: none;
            animation: float 6s ease-in-out infinite alternate;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* Неоновые контуры для фоновых предметов */
        .neon-icon {
            width: 48px;
            height: 48px;
            stroke-width: 2.2px;
            opacity: 0.5;
        }

        .neon-cyan {
            stroke: #00f3ff;
            color: #00f3ff;
            filter: drop-shadow(0 0 2px #ffffff) drop-shadow(0 0 6px #00f3ff) drop-shadow(0 0 14px #00f3ff);
        }

        .neon-purple {
            stroke: #bf00ff;
            color: #bf00ff;
            filter: drop-shadow(0 0 2px #ffffff) drop-shadow(0 0 6px #bf00ff) drop-shadow(0 0 14px #bf00ff);
        }

        .neon-pink {
            stroke: #ff007f;
            color: #ff007f;
            filter: drop-shadow(0 0 2px #ffffff) drop-shadow(0 0 6px #ff007f) drop-shadow(0 0 14px #ff007f);
        }

        .d-1 { animation-duration: 5s; animation-delay: 0s; }
        .d-2 { animation-duration: 7s; animation-delay: 1s; }
        .d-3 { animation-duration: 6s; animation-delay: 2s; }
        .d-4 { animation-duration: 8s; animation-delay: 0.5s; }

        @keyframes float {
            0% { transform: translateY(0px) rotate(0deg) scale(1); }
            100% { transform: translateY(-18px) rotate(15deg) scale(1.08); }
        }

        /* --- ЦЕНТРАЛЬНЫЙ БЛОК МЕНЮ --- */
        .main-container {
            position: relative;
            z-index: 2;
            text-align: center;
            width: 100%;
            max-width: 900px;
            padding: 20px;
        }

        .title {
            font-size: 3.2rem;
            font-weight: 900;
            margin-bottom: 50px;
            color: #ffffff;
            text-transform: uppercase;
            letter-spacing: 2px;
            text-shadow: 0 0 10px #bf00ff, 0 0 20px #bf00ff, 0 0 40px #00f3ff;
        }

        .buttons-wrapper {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 30px;
            flex-wrap: wrap;
        }

        .btn-subject {
            background: rgba(15, 8, 35, 0.85);
            border: 3px solid;
            border-radius: 20px;
            padding: 18px 35px;
            font-size: 1.8rem;
            font-weight: 800;
            color: #ffffff;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 15px;
            backdrop-filter: blur(10px);
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            outline: none;
            user-select: none;
        }

        .btn-geometry {
            border-color: #00f3ff;
            box-shadow: 0 0 15px rgba(0, 243, 255, 0.4), inset 0 0 15px rgba(0, 243, 255, 0.2);
        }

        .btn-algebra {
            border-color: #bf00ff;
            box-shadow: 0 0 15px rgba(191, 0, 255, 0.4), inset 0 0 15px rgba(191, 0, 255, 0.2);
        }

        .btn-geometry:hover {
            transform: scale(1.08);
            box-shadow: 0 0 30px rgba(0, 243, 255, 0.9), inset 0 0 20px rgba(0, 243, 255, 0.5);
            background: rgba(0, 243, 255, 0.2);
        }

        .btn-algebra:hover {
            transform: scale(1.08);
            box-shadow: 0 0 30px rgba(191, 0, 255, 0.9), inset 0 0 20px rgba(191, 0, 255, 0.5);
            background: rgba(191, 0, 255, 0.2);
        }

        .btn-subject:active {
            transform: scale(0.98);
        }

        /* ОБЫЧНЫЕ НЕ-НЕОНОВЫЕ СТИКЕРЫ/ИКОНКИ В КНОПКАХ */
        .btn-icon-normal {
            font-size: 2rem;
            line-height: 1;
            filter: none !important; /* Отключает любое неоновое свечение */
        }

        .math-symbol {
            font-family: serif;
            font-style: italic;
            font-weight: bold;
            font-size: 1.8rem;
            filter: none !important;
        }

        @media (max-width: 650px) {
            .title { font-size: 2.2rem; }
            .buttons-wrapper { flex-direction: column; }
            .btn-subject { width: 100%; font-size: 1.4rem; }
            .background-objects {
                grid-template-columns: repeat(4, 1fr);
                grid-template-rows: repeat(6, 1fr);
            }
        }
    </style>
</head>
<body>

    <!-- Фоновые неоновые стикеры (ТОЛЬКО: Ручки, Линейки, Карандаши, Учебники/Блокноты, Калькуляторы) -->
    <div class="background-objects">
        <div class="bg-item d-1"><i data-lucide="ruler" class="neon-icon neon-cyan"></i></div>
        <div class="bg-item d-2"><i data-lucide="pencil" class="neon-icon neon-purple"></i></div>
        <div class="bg-item d-3"><i data-lucide="pen" class="neon-icon neon-pink"></i></div>
        <div class="bg-item d-4"><i data-lucide="book-open" class="neon-icon neon-cyan"></i></div>
        <div class="bg-item d-1"><i data-lucide="calculator" class="neon-icon neon-purple"></i></div>
        <div class="bg-item d-2"><i data-lucide="ruler" class="neon-icon neon-pink"></i></div>

        <div class="bg-item d-3"><i data-lucide="pencil" class="neon-icon neon-pink"></i></div>
        <div class="bg-item d-4"><i data-lucide="pen" class="neon-icon neon-cyan"></i></div>
        <div class="bg-item d-1"><i data-lucide="book-open" class="neon-icon neon-purple"></i></div>
        <div class="bg-item d-2"><i data-lucide="calculator" class="neon-icon neon-pink"></i></div>
        <div class="bg-item d-3"><i data-lucide="ruler" class="neon-icon neon-cyan"></i></div>
        <div class="bg-item d-4"><i data-lucide="pencil" class="neon-icon neon-purple"></i></div>

        <div class="bg-item d-1"><i data-lucide="pen" class="neon-icon neon-purple"></i></div>
        <div class="bg-item d-2"><i data-lucide="book-open" class="neon-icon neon-pink"></i></div>
        <div class="bg-item d-3"><i data-lucide="calculator" class="neon-icon neon-cyan"></i></div>
        <div class="bg-item d-4"><i data-lucide="ruler" class="neon-icon neon-purple"></i></div>
        <div class="bg-item d-1"><i data-lucide="pencil" class="neon-icon neon-pink"></i></div>
        <div class="bg-item d-2"><i data-lucide="pen" class="neon-icon neon-cyan"></i></div>

        <div class="bg-item d-3"><i data-lucide="book-open" class="neon-icon neon-cyan"></i></div>
        <div class="bg-item d-4"><i data-lucide="calculator" class="neon-icon neon-purple"></i></div>
        <div class="bg-item d-1"><i data-lucide="ruler" class="neon-icon neon-pink"></i></div>
        <div class="bg-item d-2"><i data-lucide="pencil" class="neon-icon neon-cyan"></i></div>
        <div class="bg-item d-3"><i data-lucide="pen" class="neon-icon neon-purple"></i></div>
        <div class="bg-item d-4"><i data-lucide="book-open" class="neon-icon neon-pink"></i></div>
    </div>

    <!-- Главное меню -->
    <div class="main-container">
        <h1 class="title">Оберіть предмет</h1>
        
        <div class="buttons-wrapper">
            <!-- Кнопка Геометрия (с обычными эмодзи-стикерами) -->
            <button class="btn-subject btn-geometry">
                <span class="btn-icon-normal">📏</span>
                <span>Геометрія</span>
                <span class="btn-icon-normal">✏️</span>
            </button>

            <!-- Кнопка Алгебра (с обычными эмодзи-стикерами) -->
            <button class="btn-subject btn-algebra">
                <span class="btn-icon-normal">🖊️</span>
                <span>Алгебра</span>
                <span class="math-symbol">√x</span>
            </button>
        </div>
    </div>

    <script>
        // Инициализация фоновых иконок
        lucide.createIcons();
    </script>

</body>
</html>

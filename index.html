<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Шкільні Міні-Тести</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;800&display=swap');

        :root {
            --neon-cyan: #00f3ff;
            --neon-purple: #b500ff;
            --neon-green: #00ff66;
            --neon-red: #ff003c;
            --panel-bg: rgba(13, 8, 33, 0.85); /* Напівпрозорий темний фон для читабельності тексту в тестах */
        }

        * { box-sizing: border-box; font-family: 'Montserrat', sans-serif; }

        body {
            margin: 0; padding: 0; 
            /* Яскравий неоновий синьо-фіолетовий градієнт */
            background: linear-gradient(45deg, #2b00ff, #8a2be2, #0037b8, #4a00e0);
            background-size: 400% 400%;
            animation: gradientBG 12s ease infinite; /* Анімація переливання */
            color: white;
            overflow-x: hidden; height: 100vh; display: flex; flex-direction: column;
        }

        /* Анімація для фону */
        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* Контейнери екранів */
        .screen { display: none; width: 100%; height: 100%; padding: 20px; align-items: center; justify-content: center; flex-direction: column; }
        .screen.active { display: flex; }

        h1 { font-size: 3.5rem; text-shadow: 0 0 15px var(--neon-cyan), 0 0 30px var(--neon-purple); text-align: center; margin-bottom: 30px; }
        h2 { font-size: 2.5rem; text-shadow: 0 0 15px var(--neon-cyan), 0 0 30px var(--neon-purple); text-align: center; margin-bottom: 30px; }
        p { font-size: 1.5rem; }

        /* Кнопки */
        .btn {
            background: rgba(10, 5, 30, 0.6); /* Трохи темніший фон для кнопок, щоб виділялися на яскравому фоні */
            color: var(--neon-cyan); border: 3px solid var(--neon-purple);
            padding: 20px 40px; margin: 15px; font-size: 1.5rem; font-weight: 800; border-radius: 15px;
            cursor: pointer; transition: all 0.3s; box-shadow: 0 0 25px rgba(181, 0, 255, 0.5);
            display: inline-flex; align-items: center; justify-content: center; gap: 15px;
            text-shadow: 0 0 10px var(--neon-cyan);
            backdrop-filter: blur(5px);
        }
        .btn:hover {
            transform: scale(1.08); background: rgba(181, 0, 255, 0.4); border-color: var(--neon-cyan);
            box-shadow: 0 0 30px var(--neon-cyan), inset 0 0 20px var(--neon-purple); color: #fff;
        }
        .btn.disabled {
            filter: grayscale(1); opacity: 0.3; pointer-events: none; border-color: #555; color: #555;
            box-shadow: none; text-shadow: none;
        }

        /* Вибір кількості та часу */
        .grid-options { display: grid; grid-template-columns: repeat(3, 1fr); gap: 15px; margin-bottom: 20px; }
        .custom-input-area { display: flex; flex-direction: column; align-items: center; gap: 15px; margin-top: 30px; }
        input[type="range"] { width: 400px; height: 10px; accent-color: var(--neon-cyan); cursor: pointer; }
        .time-inputs { display: flex; gap: 10px; align-items: center; font-size: 2rem; text-shadow: 0 0 10px var(--neon-cyan); }
        .time-inputs input {
            width: 80px; height: 60px; background: rgba(10, 5, 30, 0.6); border: 3px solid var(--neon-cyan); color: var(--neon-cyan);
            font-size: 2rem; text-align: center; border-radius: 10px; box-shadow: 0 0 15px rgba(0, 243, 255, 0.4);
        }
        .time-inputs input:focus { outline: none; border-color: var(--neon-purple); box-shadow: 0 0 20px var(--neon-purple); }
        
        .bottom-nav { position: absolute; bottom: 30px; left: 30px; display: flex; flex-direction: column; gap: 15px; }
        .bottom-nav .btn { font-size: 1.2rem; padding: 15px 30px; }

        /* Вікно тесту */
        .quiz-container {
            background: var(--panel-bg); border: 3px solid var(--neon-cyan); border-radius: 25px;
            padding: 40px; width: 90%; max-width: 1000px; box-shadow: 0 0 50px rgba(0, 243, 255, 0.3), inset 0 0 25px rgba(181, 0, 255, 0.2);
            position: relative; backdrop-filter: blur(10px);
        }
        .quiz-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 25px; border-bottom: 2px solid var(--neon-cyan); padding-bottom: 15px; font-size: 1.5rem;}
        #quiz-progress { text-shadow: 0 0 8px var(--neon-cyan); font-weight: bold; }
        #timer-display { font-size: 2rem; font-weight: bold; text-shadow: 0 0 15px var(--neon-cyan); color: var(--neon-cyan); transition: color 0.3s; }
        .timer-danger { color: var(--neon-red) !important; text-shadow: 0 0 20px var(--neon-red) !important; }
        .question-text { font-size: 2rem; margin-bottom: 30px; font-weight: 600; text-shadow: 0 0 8px rgba(255,255,255,0.4); line-height: 1.4; }
        .options-grid { display: flex; flex-direction: column; gap: 20px; }
        .option-btn { width: 100%; text-align: left; justify-content: flex-start; font-size: 1.4rem; padding: 20px 30px; border-color: var(--neon-cyan); box-shadow: 0 0 15px rgba(0, 243, 255, 0.3);}
        .option-btn.correct { background: var(--neon-green); color: #000; border-color: var(--neon-green); box-shadow: 0 0 30px var(--neon-green); text-shadow: none; transform: scale(1.02); }
        .option-btn.wrong { background: var(--neon-red); color: #fff; border-color: var(--neon-red); box-shadow: 0 0 30px var(--neon-red); text-shadow: none; transform: scale(1.02); }
        .explanation { display: none; margin-top: 25px; padding: 20px; font-size: 1.3rem; border-left: 5px solid var(--neon-purple); background: rgba(181,0,255,0.15); line-height: 1.5; }
        
        .quiz-controls { display: flex; justify-content: space-between; margin-top: 40px; }

        /* Модальні вікна */
        .modal-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85);
            display: none; align-items: center; justify-content: center; z-index: 100;
        }
        .modal-content {
            background: #110825; border: 3px solid var(--neon-cyan); padding: 50px; border-radius: 20px;
            text-align: center; box-shadow: 0 0 60px rgba(181, 0, 255, 0.6);
        }
        .modal-btn-green { border-color: var(--neon-green); color: var(--neon-green); text-shadow: 0 0 8px var(--neon-green); }
        .modal-btn-green:hover { background: var(--neon-green); color: #000; box-shadow: 0 0 30px var(--neon-green); text-shadow: none; }
        .modal-btn-red { border-color: var(--neon-red); color: var(--neon-red); text-shadow: 0 0 8px var(--neon-red); }
        .modal-btn-red:hover { background: var(--neon-red); color: #fff; box-shadow: 0 0 30px var(--neon-red); text-shadow: none; }

        /* Результати */
        #results-list { max-height: 60vh; overflow-y: auto; text-align: left; padding-right: 15px; }
        .res-item { border-bottom: 2px solid rgba(0,243,255,0.3); padding: 20px 0; }
        .res-status-correct { color: var(--neon-green); font-weight: bold; text-shadow: 0 0 8px var(--neon-green); font-size: 1.3rem; margin: 10px 0;}
        .res-status-wrong { color: var(--neon-red); font-weight: bold; text-shadow: 0 0 8px var(--neon-red); font-size: 1.3rem; margin: 10px 0;}
        .res-status-skipped { color: #f39c12; font-weight: bold; text-shadow: 0 0 8px #f39c12; font-size: 1.3rem; margin: 10px 0;}
        .res-status-unanswered { color: #7f8c8d; font-weight: bold; font-size: 1.3rem; margin: 10px 0;}
        
        /* Скролбар */
        ::-webkit-scrollbar { width: 10px; }
        ::-webkit-scrollbar-track { background: rgba(0,0,0,0.3); border-radius: 10px;}
        ::-webkit-scrollbar-thumb { background: var(--neon-purple); border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: var(--neon-cyan); }
    </style>
</head>
<body>

    <!-- ЕКРАН 1: Меню предметів -->
    <div id="screen-menu" class="screen active">
        <h1>Виберіть предмет</h1>
        <div>
            <button class="btn" onclick="selectSubject('geometry')">📐 Геометрія</button>
            <button class="btn" onclick="selectSubject('algebra')">√ Алгебра</button>
            <button class="btn" onclick="selectSubject('physics')">⚡ Фізика</button>
        </div>
    </div>

    <!-- ЕКРАН 2: Кількість завдань -->
    <div id="screen-count" class="screen">
        <h2>Виберіть кількість завдань</h2>
        <div class="grid-options" id="preset-counts">
            <button class="btn count-btn" onclick="setPresetCount(5)">5</button>
            <button class="btn count-btn" onclick="setPresetCount(10)">10</button>
            <button class="btn count-btn" onclick="setPresetCount(15)">15</button>
            <button class="btn count-btn" onclick="setPresetCount(20)">20</button>
            <button class="btn count-btn" onclick="setPresetCount(25)">25</button>
            <button class="btn count-btn" onclick="setPresetCount(30)">30</button>
        </div>
        <div class="custom-input-area">
            <p style="text-shadow: 0 0 8px var(--neon-cyan);">Або виберіть свою кількість завдань: <span id="slider-val" style="color: var(--neon-cyan); font-weight: bold; text-shadow: 0 0 15px var(--neon-cyan); font-size: 2rem;">1</span></p>
            <input type="range" id="custom-count" min="1" max="50" value="1" oninput="setSliderCount(this.value)">
            <button class="btn" style="margin-top:30px;" onclick="goToTimeSelection()">Далі ➔</button>
        </div>
        <div class="bottom-nav">
            <button class="btn" onclick="switchScreen('screen-menu')">↩ Повернутися в меню</button>
        </div>
    </div>

    <!-- ЕКРАН 3: Вибір часу -->
    <div id="screen-time" class="screen">
        <h2>Виберіть час тесту</h2>
        <div class="grid-options" id="preset-times">
            <button class="btn time-btn" onclick="setPresetTime(30)">00:30</button>
            <button class="btn time-btn" onclick="setPresetTime(60)">01:00</button>
            <button class="btn time-btn" onclick="setPresetTime(300)">05:00</button>
            <button class="btn time-btn" onclick="setPresetTime(600)">10:00</button>
            <button class="btn time-btn" onclick="setPresetTime(900)">15:00</button>
            <button class="btn time-btn" onclick="setPresetTime(1200)">20:00</button>
        </div>
        <div class="custom-input-area">
            <p style="text-shadow: 0 0 8px var(--neon-cyan);">Або напишіть свій час</p>
            <div class="time-inputs">
                <input type="number" id="custom-min" min="0" max="99" placeholder="00" oninput="checkMinInput()"> : 
                <input type="number" id="custom-sec" min="0" max="59" placeholder="00" oninput="disableTimePresets()">
            </div>
            <button class="btn" onclick="startQuizWithCustomTime()" style="margin-top: 25px;">Запустити тест з цим часом</button>
            <button class="btn" onclick="startQuiz(0)" style="margin-top: 15px; border-color: #ddd; color: #ddd; text-shadow: none; box-shadow: none;">Грати без часу</button>
        </div>
        <div class="bottom-nav">
            <button class="btn" onclick="switchScreen('screen-count')">⮌ Повернутися назад</button>
            <button class="btn" onclick="switchScreen('screen-menu')">↩ Повернутися в меню</button>
        </div>
    </div>

    <!-- ЕКРАН 4: Сам Тест -->
    <div id="screen-quiz" class="screen">
        <div class="quiz-container">
            <div class="quiz-header">
                <div id="quiz-progress">Завдання 1 / 10</div>
                <div id="timer-display" style="display:none;">00:00</div>
            </div>
            <div id="question-text" class="question-text">Текст питання</div>
            <div class="options-grid" id="options-grid"></div>
            <div id="explanation" class="explanation"></div>
            
            <div class="quiz-controls">
                <button class="btn modal-btn-red" style="padding: 15px 25px; font-size: 1.2rem;" onclick="showEndModal()">Закінчити тест</button>
                <button class="btn" style="padding: 15px 25px; font-size: 1.2rem;" onclick="skipQuestion()" id="btn-skip">Пропустити завдання ➔</button>
                <button class="btn" style="padding: 15px 25px; font-size: 1.2rem; display:none;" onclick="nextQuestion()" id="btn-next">Наступне завдання ➔</button>
            </div>
        </div>
    </div>

    <!-- ЕКРАН 5: Результати -->
    <div id="screen-results" class="screen">
        <div class="quiz-container" style="max-width: 1000px; text-align: center;">
            <h2 style="font-size: 3rem;">Результати тесту</h2>
            <h1 id="score-display" style="font-size: 3.5rem; margin-bottom: 40px;">Виконано: ? / ?</h1>
            <div id="results-list"></div>
            <button class="btn" style="margin-top: 40px;" onclick="switchScreen('screen-menu')">↩ Повернутися в меню</button>
        </div>
    </div>

    <!-- Модалка підтвердження виходу -->
    <div class="modal-overlay" id="end-modal">
        <div class="modal-content">
            <h2 style="font-size: 2.5rem;">Ви дійсно хочете закінчити тест?</h2>
            <div style="margin-top: 30px;">
                <button class="btn modal-btn-green" onclick="forceEndQuiz()">Так</button>
                <button class="btn modal-btn-red" onclick="closeEndModal()">Ні</button>
            </div>
        </div>
    </div>

    <!-- Модалка кінця таймера -->
    <div class="modal-overlay" id="timer-modal">
        <div class="modal-content">
            <h1 style="color: var(--neon-cyan); text-shadow: 0 0 30px var(--neon-cyan); font-size: 4rem;">Таймер закінчився!</h1>
            <div style="font-size: 6rem; filter: drop-shadow(0 0 30px var(--neon-purple)); margin-top: 20px;">⏰</div>
        </div>
    </div>

    <script>
        const db = {
            geometry: [
                { q: "Сума кутів опуклого чотирикутника дорівнює:", opts: ["180°", "360°", "540°", "90°"], ans: 1, exp: "За теоремою про суму кутів опуклого чотирикутника вона завжди дорівнює 360°." },
                { q: "Паралелограм, у якого всі сторони рівні, називається:", opts: ["Прямокутник", "Трапеція", "Ромб", "Дельтоїд"], ans: 2, exp: "За означенням, ромб — це паралелограм, у якого всі сторони рівні." },
                { q: "Якщо катети прямокутного трикутника дорівнюють 6 см і 8 см, то гіпотенуза дорівнює:", opts: ["10 см", "14 см", "100 см", "12 см"], ans: 0, exp: "За теоремою Піфагора: c² = a² + b² = 6² + 8² = 36 + 64 = 100. Корінь зі 100 — це 10." },
                { q: "Площа прямокутного трикутника з катетами 'a' та 'b' обчислюється за формулою:", opts: ["S = a*b", "S = (a*b)/2", "S = a+b", "S = (a+b)/2"], ans: 1, exp: "Площа прямокутного трикутника дорівнює половині добутку його катетів." },
                { q: "Середня лінія трапеції дорівнює...", opts: ["Сумі основ", "Різниці основ", "Півсумі основ", "Добутку основ"], ans: 2, exp: "За властивістю середньої лінії трапеції, вона паралельна основам і дорівнює їх півсумі." },
                { q: "Вписаний кут, що спирається на діаметр кола, дорівнює:", opts: ["45°", "90°", "180°", "360°"], ans: 1, exp: "Вписаний кут, який спирається на півколо (діаметр), завжди прямий (90°)." },
                { q: "Скільки середніх ліній можна провести у трикутнику?", opts: ["Одну", "Дві", "Три", "Безліч"], ans: 2, exp: "У трикутнику три сторони, отже можна з'єднати їх середини трьома відрізками — трьома середніми лініями." },
                { q: "Який чотирикутник має рівні діагоналі, що точкою перетину діляться навпіл?", opts: ["Будь-який паралелограм", "Ромб", "Прямокутник", "Трапеція"], ans: 2, exp: "У прямокутника діагоналі рівні і точкою перетину діляться навпіл." }
            ],
            algebra: [
                { q: "Яка з нерівностей є правильною, якщо a > b?", opts: ["a - 3 < b - 3", "a + 2 < b + 2", "-a < -b", "-2a > -2b"], ans: 2, exp: "При множенні обох частин правильної нерівності на від'ємне число знак нерівності змінюється на протилежний." },
                { q: "Розв'яжіть нерівність: -3x > 12", opts: ["x > -4", "x < -4", "x > 4", "x < 4"], ans: 1, exp: "Ділимо обидві частини на -3. Знак нерівності змінюється на протилежний: x < -4." },
                { q: "Знайдіть переріз проміжків [-2; 7] та (3; 10)", opts: ["[-2; 10]", "(3; 7]", "[-2; 3)", "[7; 10)"], ans: 1, exp: "Переріз — це спільна частина. Від 3 (не включаючи) до 7 (включаючи): (3; 7]." },
                { q: "Що є об'єднанням проміжків (-∞; 2] і [2; +∞)?", opts: ["Тільки точка 2", "∅", "(-∞; +∞)", "(-∞; 2)"], ans: 2, exp: "Об'єднання покриває всю числову пряму від мінус нескінченності до плюс нескінченності." },
                { q: "Яке найменше ціле число є розв'язком нерівності x > -3.5?", opts: ["-4", "-3", "-2", "0"], ans: 1, exp: "Цілі числа, більші за -3.5: -3, -2, -1... Найменше з них: -3." },
                { q: "Оцініть значення виразу 2x, якщо 3 < x < 5", opts: ["5 < 2x < 7", "6 < 2x < 10", "1.5 < 2x < 2.5", "6 < x < 10"], ans: 1, exp: "Множимо всі частини подвійної нерівності на 2: 3*2 < x*2 < 5*2 => 6 < 2x < 10." },
                { q: "Якщо a < b і b < c, то...", opts: ["a > c", "a = c", "a < c", "Зв'язку немає"], ans: 2, exp: "Це властивість транзитивності числових нерівностей: якщо a < b і b < c, то a < c." },
                { q: "Розв'яжіть нерівність 5x - 2 ≥ 3x + 4", opts: ["x ≥ 3", "x ≤ 3", "x ≥ 1", "x ≥ 6"], ans: 0, exp: "Переносимо невідомі вліво: 5x - 3x ≥ 4 + 2 => 2x ≥ 6 => x ≥ 3." }
            ],
            physics: [
                { q: "Що є носіями електричного струму в металах?", opts: ["Позитивні йони", "Негативні йони", "Вільні електрони", "Протони"], ans: 2, exp: "Вільні електрони в металах можуть легко переміщуватися, утворюючи електронний газ, який і створює струм." },
                { q: "Як змінюється опір металевого провідника під час його нагрівання?", opts: ["Зменшується", "Збільшується", "Не змінюється", "Стає нульовим"], ans: 1, exp: "При нагріванні іони кристалічної решітки коливаються інтенсивніше, частіше стикаються з електронами, що збільшує опір." },
                { q: "Хто відкрив явище надпровідності?", opts: ["Георг Ом", "Алессандро Вольта", "Гейке Камерлінг-Оннес", "Джеймс Максвелл"], ans: 2, exp: "Явище надпровідності (різке падіння опору до нуля) відкрив Г. Камерлінг-Оннес у 1911 році, охолоджуючи ртуть." },
                { q: "Надпровідність — це властивість матеріалів втрачати електричний опір при...", opts: ["Дуже високих температурах", "Опроміненні світлом", "Охолодженні до температур, близьких до абсолютного нуля", "Протіканні дуже сильного струму"], ans: 2, exp: "Надпровідність виникає при охолодженні матеріалу нижче критичної температури (зазвичай дуже близької до 0 Кельвінів)." },
                { q: "Що утворюється в кристалічній решітці металу?", opts: ["Нейтральні атоми", "Позитивні йони та вільні електрони", "Електрони та протони", "Тільки негативні йони"], ans: 1, exp: "У вузлах решітки знаходяться позитивні йони, а між ними хаотично рухаються вільні електрони." },
                { q: "Який вчений довів, що струм у металах створюється рухом електронів (дослід з котушкою)?", opts: ["Ом", "Рікке", "Толмен і Стюарт", "Ампер"], ans: 2, exp: "Дослід Толмена і Стюарта з різким гальмуванням котушки довів електронну природу струму в металах." },
                { q: "За якою формулою визначається залежність опору від температури?", opts: ["R = R0(1 + αt)", "R = ρl/S", "I = U/R", "Q = I²Rt"], ans: 0, exp: "Формула R = R0(1 + αt) показує лінійну залежність опору металу від температури, де α — температурний коефіцієнт опору." }
            ]
        };

        let currentSubject = '';
        let targetQuestionsCount = 5;
        let selectedTime = 0;
        let timerInterval;
        let currentQuestions = [];
        let currentIndex = 0;
        let results = [];
        let answeredCurrent = false;

        function switchScreen(screenId) {
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            document.getElementById(screenId).classList.add('active');
        }

        function selectSubject(subj) {
            currentSubject = subj;
            resetCountSelection();
            switchScreen('screen-count');
        }

        const presetBtns = document.querySelectorAll('.count-btn');
        const customCountInput = document.getElementById('custom-count');
        const sliderVal = document.getElementById('slider-val');

        function resetCountSelection() {
            presetBtns.forEach(btn => btn.classList.remove('disabled'));
            customCountInput.classList.remove('disabled');
            customCountInput.value = 1;
            sliderVal.innerText = 1;
            targetQuestionsCount = 5;
        }

        function setPresetCount(num) {
            targetQuestionsCount = num;
            customCountInput.classList.add('disabled');
        }

        function setSliderCount(val) {
            sliderVal.innerText = val;
            targetQuestionsCount = parseInt(val);
            presetBtns.forEach(btn => btn.classList.add('disabled'));
        }

        function goToTimeSelection() {
            document.getElementById('custom-min').value = '';
            document.getElementById('custom-sec').value = '';
            document.querySelectorAll('.time-btn').forEach(b => b.classList.remove('disabled'));
            switchScreen('screen-time');
        }

        function setPresetTime(sec) {
            selectedTime = sec;
            document.getElementById('custom-min').value = '';
            document.getElementById('custom-sec').value = '';
            startQuiz(sec);
        }

        function checkMinInput() {
            let minInp = document.getElementById('custom-min');
            disableTimePresets();
            if(minInp.value.length >= 2) {
                document.getElementById('custom-sec').focus();
            }
        }

        function disableTimePresets() {
            document.querySelectorAll('.time-btn').forEach(b => b.classList.add('disabled'));
        }

        function startQuizWithCustomTime() {
            let m = parseInt(document.getElementById('custom-min').value) || 0;
            let s = parseInt(document.getElementById('custom-sec').value) || 0;
            let totalSec = (m * 60) + s;
            if(totalSec > 0) startQuiz(totalSec);
            else alert("Введіть коректний час!");
        }

        function startQuiz(timeSec) {
            selectedTime = timeSec;
            
            let baseArray = [...db[currentSubject]];
            baseArray.sort(() => Math.random() - 0.5);
            
            currentQuestions = [];
            while(currentQuestions.length < targetQuestionsCount) {
                let batch = [...db[currentSubject]].sort(() => Math.random() - 0.5);
                currentQuestions = currentQuestions.concat(batch);
            }
            currentQuestions = currentQuestions.slice(0, targetQuestionsCount);

            currentIndex = 0;
            results = [];
            
            switchScreen('screen-quiz');
            setupTimer();
            loadQuestion();
        }

        function setupTimer() {
            const timeDisp = document.getElementById('timer-display');
            clearInterval(timerInterval);
            timeDisp.classList.remove('timer-danger');

            if(selectedTime > 0) {
                timeDisp.style.display = 'block';
                updateTimerUI(selectedTime);
                let timeLeft = selectedTime;
                
                timerInterval = setInterval(() => {
                    timeLeft--;
                    updateTimerUI(timeLeft);
                    
                    if(timeLeft <= 10) timeDisp.classList.add('timer-danger');
                    
                    if(timeLeft <= 0) {
                        clearInterval(timerInterval);
                        showTimerEnd();
                    }
                }, 1000);
            } else {
                timeDisp.style.display = 'none';
            }
        }

        function updateTimerUI(sec) {
            let m = Math.floor(sec / 60);
            let s = sec % 60;
            document.getElementById('timer-display').innerText = 
                (m < 10 ? '0'+m : m) + ':' + (s < 10 ? '0'+s : s);
        }

        function loadQuestion() {
            answeredCurrent = false;
            let qData = currentQuestions[currentIndex];
            
            document.getElementById('quiz-progress').innerText = `Завдання ${currentIndex + 1} / ${targetQuestionsCount}`;
            document.getElementById('question-text').innerText = qData.q;
            document.getElementById('explanation').style.display = 'none';
            document.getElementById('btn-skip').style.display = 'inline-block';
            document.getElementById('btn-next').style.display = 'none';

            let optsGrid = document.getElementById('options-grid');
            optsGrid.innerHTML = '';

            qData.opts.forEach((optText, index) => {
                let btn = document.createElement('button');
                btn.className = 'btn option-btn';
                btn.innerText = optText;
                btn.onclick = () => checkAnswer(index, btn, qData);
                optsGrid.appendChild(btn);
            });
        }

        function checkAnswer(selectedIndex, btnElement, qData) {
            if(answeredCurrent) return;
            answeredCurrent = true;

            let allBtns = document.getElementById('options-grid').children;
            for(let b of allBtns) b.style.pointerEvents = 'none';

            let isCorrect = (selectedIndex === qData.ans);
            let resultObj = {
                q: qData.q,
                exp: qData.exp,
                status: isCorrect ? 'correct' : 'wrong'
            };
            results.push(resultObj);

            if(isCorrect) {
                btnElement.classList.add('correct');
            } else {
                btnElement.classList.add('wrong');
                allBtns[qData.ans].classList.add('correct');
                
                let expDiv = document.getElementById('explanation');
                expDiv.innerText = "Пояснення: " + qData.exp;
                expDiv.style.display = 'block';
            }

            document.getElementById('btn-skip').style.display = 'none';
            document.getElementById('btn-next').style.display = 'inline-block';
        }

        function skipQuestion() {
            if(answeredCurrent) return;
            results.push({
                q: currentQuestions[currentIndex].q,
                exp: currentQuestions[currentIndex].exp,
                status: 'skipped'
            });
            goToNextOrEnd();
        }

        function nextQuestion() {
            goToNextOrEnd();
        }

        function goToNextOrEnd() {
            currentIndex++;
            if(currentIndex >= targetQuestionsCount) {
                finishQuiz();
            } else {
                loadQuestion();
            }
        }

        function showEndModal() { document.getElementById('end-modal').style.display = 'flex'; }
        function closeEndModal() { document.getElementById('end-modal').style.display = 'none'; }
        
        function forceEndQuiz() {
            closeEndModal();
            finishQuiz(true);
        }

        function showTimerEnd() {
            document.getElementById('timer-modal').style.display = 'flex';
            setTimeout(() => {
                document.getElementById('timer-modal').style.display = 'none';
                finishQuiz(true);
            }, 3000);
        }

        function finishQuiz(endedEarly = false) {
            clearInterval(timerInterval);
            
            if(endedEarly && currentIndex < targetQuestionsCount) {
                for(let i = currentIndex; i < targetQuestionsCount; i++) {
                    results.push({
                        q: currentQuestions[i].q,
                        exp: currentQuestions[i].exp,
                        status: 'unanswered'
                    });
                }
            }

            buildResultsScreen();
            switchScreen('screen-results');
        }

        function buildResultsScreen() {
            let correctCount = results.filter(r => r.status === 'correct').length;
            document.getElementById('score-display').innerText = `Виконано: ${correctCount} / ${targetQuestionsCount}`;

            let listDiv = document.getElementById('results-list');
            listDiv.innerHTML = '';

            results.forEach((res, i) => {
                let div = document.createElement('div');
                div.className = 'res-item';
                
                let statusText = '';
                let statusClass = '';

                switch(res.status) {
                    case 'correct': statusText = 'Правильно'; statusClass = 'res-status-correct'; break;
                    case 'wrong': statusText = 'Неправильно'; statusClass = 'res-status-wrong'; break;
                    case 'skipped': statusText = 'Пропущено'; statusClass = 'res-status-skipped'; break;
                    case 'unanswered': statusText = 'Не зроблено'; statusClass = 'res-status-unanswered'; break;
                }

                div.innerHTML = `
                    <div style="font-size: 1.4rem; margin-bottom: 10px;"><b>${i+1}.</b> ${res.q}</div>
                    <div class="${statusClass}">Статус: ${statusText}</div>
                    <div style="margin-top: 10px; font-size: 1.1rem; color: #ccc;"><i>Пояснення: ${res.exp}</i></div>
                `;
                listDiv.appendChild(div);
            });
        }
    </script>
</body>
</html>

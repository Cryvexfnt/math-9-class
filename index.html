<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Математика 8-9 Клас — Геометрія</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700;800;900&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Montserrat', sans-serif;
        }

        body {
            min-height: 100vh;
            width: 100vw;
            background: radial-gradient(circle at center, #180830 0%, #070414 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            overflow-x: hidden;
            position: relative;
            color: #ffffff;
        }

        .background-objects {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            pointer-events: none;
            z-index: 1;
            overflow: hidden;
        }

        .bg-item {
            position: absolute;
            user-select: none;
            transform: translate(-50%, -50%);
            animation: float 6s infinite alternate ease-in-out;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .neon-icon {
            width: 44px;
            height: 44px;
            stroke-width: 2.2px;
            opacity: 0.55;
        }

        .neon-cyan {
            stroke: #00f3ff;
            color: #00f3ff;
            filter: drop-shadow(0 0 2px #ffffff) drop-shadow(0 0 6px #00f3ff) drop-shadow(0 0 14px #00f3ff);
        }

        .neon-purple {
            stroke: #bf00ff;
            color: #bf00ff;
            filter: drop-shadow(0 0 2px #ffffff) drop-shadow(0 0 6px #bf00ff) drop-shadow(0 0 14px #bf00ff);
        }

        .neon-pink {
            stroke: #ff007f;
            color: #ff007f;
            filter: drop-shadow(0 0 2px #ffffff) drop-shadow(0 0 6px #ff007f) drop-shadow(0 0 14px #ff007f);
        }

        .d-1 { animation-duration: 5.2s; animation-delay: 0s; }
        .d-2 { animation-duration: 6.8s; animation-delay: 1.2s; }
        .d-3 { animation-duration: 5.8s; animation-delay: 2.1s; }
        .d-4 { animation-duration: 7.4s; animation-delay: 0.6s; }

        @keyframes float {
            0% { transform: translate(-50%, -50%) translateY(0px) rotate(var(--rot, 0deg)) scale(1); }
            100% { transform: translate(-50%, -50%) translateY(-16px) rotate(calc(var(--rot, 0deg) + 10deg)) scale(1.06); }
        }

        .screen {
            display: none;
            position: relative;
            z-index: 2;
            width: 100%;
            max-width: 850px;
            padding: 20px;
            text-align: center;
        }

        .screen.active {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .title {
            font-size: 2.8rem;
            font-weight: 900;
            margin-bottom: 35px;
            color: #ffffff;
            text-transform: uppercase;
            letter-spacing: 2px;
            text-shadow: 0 0 10px #bf00ff, 0 0 20px #bf00ff, 0 0 40px #00f3ff;
        }

        .buttons-wrapper {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 25px;
            flex-wrap: wrap;
            width: 100%;
        }

        .btn-subject {
            background: rgba(15, 8, 35, 0.85);
            border: 3px solid;
            border-radius: 20px;
            padding: 18px 35px;
            font-size: 1.8rem;
            font-weight: 800;
            color: #ffffff;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 15px;
            backdrop-filter: blur(10px);
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            outline: none;
            user-select: none;
        }

        .btn-geometry { border-color: #00f3ff; box-shadow: 0 0 15px rgba(0, 243, 255, 0.4); }
        .btn-algebra { border-color: #bf00ff; box-shadow: 0 0 15px rgba(191, 0, 255, 0.4); opacity: 0.7; }

        .btn-geometry:hover { transform: scale(1.06); box-shadow: 0 0 30px rgba(0, 243, 255, 0.9); background: rgba(0, 243, 255, 0.2); }
        .btn-algebra:hover { transform: scale(1.06); box-shadow: 0 0 30px rgba(191, 0, 255, 0.9); background: rgba(191, 0, 255, 0.2); opacity: 1; }

        .count-grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 15px;
            width: 100%;
            max-width: 650px;
        }

        .btn-count {
            background: rgba(20, 10, 45, 0.85);
            border: 2.5px solid #00f3ff;
            border-radius: 16px;
            padding: 15px 0;
            font-size: 1.5rem;
            font-weight: 800;
            color: #ffffff;
            cursor: pointer;
            backdrop-filter: blur(8px);
            box-shadow: 0 0 12px rgba(0, 243, 255, 0.3);
            transition: all 0.25s ease;
        }

        .btn-count:hover {
            transform: translateY(-4px) scale(1.05);
            box-shadow: 0 0 25px #00f3ff;
            background: rgba(0, 243, 255, 0.25);
        }

        .quiz-card {
            background: rgba(18, 9, 38, 0.9);
            border: 2px solid #bf00ff;
            box-shadow: 0 0 30px rgba(191, 0, 255, 0.3);
            border-radius: 24px;
            padding: 30px;
            width: 100%;
            backdrop-filter: blur(15px);
            text-align: left;
            position: relative;
        }

        .quiz-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            font-weight: 800;
            color: #00f3ff;
            font-size: 1.1rem;
        }

        .question-text {
            font-size: 1.35rem;
            font-weight: 700;
            line-height: 1.5;
            margin-bottom: 20px;
            color: #ffffff;
        }

        .diagram-container {
            display: flex;
            justify-content: center;
            align-items: center;
            margin-bottom: 20px;
            background: rgba(0, 0, 0, 0.3);
            border-radius: 16px;
            padding: 15px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .options-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-bottom: 20px;
        }

        .btn-option {
            background: rgba(30, 15, 60, 0.7);
            border: 2px solid rgba(255, 255, 255, 0.2);
            border-radius: 14px;
            padding: 16px 20px;
            font-size: 1.1rem;
            font-weight: 700;
            color: #ffffff;
            cursor: pointer;
            text-align: left;
            transition: all 0.2s ease;
            outline: none;
        }

        .btn-option:hover:not(:disabled) {
            border-color: #00f3ff;
            background: rgba(0, 243, 255, 0.15);
            box-shadow: 0 0 12px rgba(0, 243, 255, 0.4);
        }

        .btn-option.correct {
            border-color: #00ff66 !important;
            background: rgba(0, 255, 102, 0.25) !important;
            box-shadow: 0 0 20px #00ff66 !important;
            color: #ffffff !important;
        }

        .btn-option.incorrect {
            border-color: #ff0055 !important;
            background: rgba(255, 0, 85, 0.25) !important;
            box-shadow: 0 0 20px #ff0055 !important;
            color: #ffffff !important;
        }

        .explanation-box {
            display: none;
            background: rgba(255, 0, 85, 0.1);
            border: 2px solid #ff0055;
            box-shadow: 0 0 15px rgba(255, 0, 85, 0.3);
            border-radius: 14px;
            padding: 18px;
            margin-top: 15px;
            font-size: 1rem;
            line-height: 1.5;
            color: #ffe6ee;
        }

        .explanation-box.active {
            display: block;
        }

        .explanation-title {
            font-weight: 800;
            color: #ff0055;
            margin-bottom: 6px;
            text-transform: uppercase;
            font-size: 0.9rem;
            letter-spacing: 1px;
        }

        .btn-next-fixed {
            position: fixed;
            bottom: 25px;
            right: 25px;
            z-index: 100;
            background: rgba(15, 8, 35, 0.95);
            border: 2.5px solid #00f3ff;
            box-shadow: 0 0 18px rgba(0, 243, 255, 0.5);
            color: #ffffff;
            padding: 14px 28px;
            border-radius: 16px;
            font-size: 1.2rem;
            font-weight: 800;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 10px;
            backdrop-filter: blur(10px);
            transition: all 0.25s ease;
        }

        .btn-next-fixed:hover {
            transform: scale(1.06);
            box-shadow: 0 0 30px #00f3ff;
            background: rgba(0, 243, 255, 0.25);
        }

        .results-list {
            width: 100%;
            max-height: 60vh;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 15px;
            padding-right: 10px;
            margin-bottom: 25px;
        }

        .result-item-card {
            background: rgba(20, 10, 45, 0.85);
            border: 2px solid rgba(255, 255, 255, 0.15);
            border-radius: 16px;
            padding: 20px;
            text-align: left;
        }

        .result-item-card.is-correct { border-color: #00ff66; box-shadow: 0 0 10px rgba(0, 255, 102, 0.2); }
        .result-item-card.is-incorrect { border-color: #ff0055; box-shadow: 0 0 10px rgba(255, 0, 85, 0.2); }
        .result-item-card.is-skipped { border-color: #ffd700; box-shadow: 0 0 10px rgba(255, 215, 0, 0.2); }

        .status-badge {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 8px;
            font-weight: 800;
            font-size: 0.85rem;
            margin-bottom: 10px;
            text-transform: uppercase;
        }

        .badge-correct { background: rgba(0, 255, 102, 0.2); color: #00ff66; border: 1px solid #00ff66; }
        .badge-incorrect { background: rgba(255, 0, 85, 0.2); color: #ff0055; border: 1px solid #ff0055; }
        .badge-skipped { background: rgba(255, 215, 0, 0.2); color: #ffd700; border: 1px solid #ffd700; }

        .btn-restart {
            background: rgba(191, 0, 255, 0.2);
            border: 2.5px solid #bf00ff;
            box-shadow: 0 0 20px rgba(191, 0, 255, 0.5);
            color: #ffffff;
            padding: 15px 40px;
            border-radius: 18px;
            font-size: 1.3rem;
            font-weight: 800;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .btn-restart:hover {
            transform: scale(1.06);
            box-shadow: 0 0 35px #bf00ff;
            background: rgba(191, 0, 255, 0.4);
        }

        .toast {
            position: fixed;
            top: 30px;
            left: 50%;
            transform: translateX(-50%) translateY(-100px);
            background: rgba(20, 10, 40, 0.95);
            border: 2px solid #ff007f;
            box-shadow: 0 0 20px #ff007f;
            color: #fff;
            padding: 14px 28px;
            border-radius: 16px;
            font-weight: 800;
            font-size: 1.1rem;
            z-index: 1000;
            opacity: 0;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .toast.show {
            transform: translateX(-50%) translateY(0);
            opacity: 1;
        }

        @media (max-width: 650px) {
            .title { font-size: 2.1rem; }
            .count-grid { grid-template-columns: repeat(2, 1fr); }
            .options-grid { grid-template-columns: 1fr; }
            .btn-next-fixed { bottom: 15px; right: 15px; padding: 12px 20px; font-size: 1rem; }
        }
    </style>
</head>
<body>

    <div class="toast" id="toast">Розділ "Алгебра" знаходиться в розробці!</div>

    <div class="background-objects" id="bg-container"></div>

    <!-- 1. ВЫБОР ПРЕДМЕТА -->
    <div class="screen active" id="screen-subject">
        <h1 class="title">Оберіть предмет</h1>
        <div class="buttons-wrapper">
            <button class="btn-subject btn-geometry" onclick="selectSubject('geometry')">
                <span>📐</span>
                <span>Геометрія</span>
                <span>✏️</span>
            </button>
            <button class="btn-subject btn-algebra" onclick="selectSubject('algebra')">
                <span>✏️</span>
                <span>Алгебра</span>
                <span style="font-family: serif; font-style: italic;">√x</span>
            </button>
        </div>
    </div>

    <!-- 2. ВЫБОР КОЛИЧЕСТВА ЗАДАНИЙ -->
    <div class="screen" id="screen-count">
        <h1 class="title">Оберіть кількість завдань</h1>
        <div class="count-grid">
            <button class="btn-count" onclick="startTest(5)">5</button>
            <button class="btn-count" onclick="startTest(10)">10</button>
            <button class="btn-count" onclick="startTest(15)">15</button>
            <button class="btn-count" onclick="startTest(20)">20</button>
            <button class="btn-count" onclick="startTest(25)">25</button>
            <button class="btn-count" onclick="startTest(30)">30</button>
            <button class="btn-count" onclick="startTest(35)">35</button>
            <button class="btn-count" onclick="startTest(40)">40</button>
            <button class="btn-count" onclick="startTest(45)">45</button>
            <button class="btn-count" onclick="startTest(50)">50</button>
        </div>
    </div>

    <!-- 3. ТЕСТИРОВАНИЕ -->
    <div class="screen" id="screen-quiz">
        <div class="quiz-card">
            <div class="quiz-header">
                <span id="quiz-progress">Завдання 1 з 10</span>
                <span id="quiz-topic" style="color: #bf00ff;">Геометрія 8 клас НУШ</span>
            </div>
            
            <div class="question-text" id="question-text">Текст питання...</div>
            
            <div class="diagram-container" id="diagram-container"></div>

            <div class="options-grid" id="options-grid"></div>

            <div class="explanation-box" id="explanation-box">
                <div class="explanation-title">Пояснення:</div>
                <div id="explanation-text">...</div>
            </div>
        </div>
    </div>

    <!-- КНОПКА "ДАЛІ" СПРАВА ВНИЗУ -->
    <button class="btn-next-fixed" id="btn-next" style="display: none;" onclick="nextQuestion()">
        <span>Далі</span>
        <span>➔</span>
    </button>

    <!-- 4. ФИНИШ -->
    <div class="screen" id="screen-results">
        <h1 class="title">Тест пройдено!</h1>
        <div class="results-list" id="results-list"></div>
        <button class="btn-restart" onclick="resetToHome()">На головну</button>
    </div>

    <script>
        const defaultIcons = ['ruler', 'pencil', 'eraser', 'book-open', 'calculator', 'backpack', 'scissors'];
        const geometryIcons = ['triangle', 'square', 'circle', 'ruler', 'pencil', 'scissors', 'grid'];

        function renderBackground(iconsList) {
            const bgContainer = document.getElementById('bg-container');
            bgContainer.innerHTML = '';
            
            const colorClasses = ['neon-cyan', 'neon-purple', 'neon-pink'];
            const coords = [
                {x: 7, y: 10, r: -25}, {x: 22, y: 14, r: 18}, {x: 38, y: 8, r: -12}, {x: 54, y: 12, r: 30}, {x: 72, y: 9, r: -15}, {x: 90, y: 13, r: 22},
                {x: 12, y: 32, r: 35}, {x: 28, y: 35, r: -20}, {x: 45, y: 28, r: 15}, {x: 62, y: 33, r: -30}, {x: 82, y: 30, r: 10},
                {x: 6, y: 58, r: -18}, {x: 20, y: 62, r: 25}, {x: 80, y: 55, r: -22}, {x: 94, y: 60, r: 16},
                {x: 10, y: 85, r: 20}, {x: 26, y: 88, r: -28}, {x: 42, y: 82, r: 14}, {x: 58, y: 89, r: -18}, {x: 74, y: 84, r: 32}, {x: 90, y: 87, r: -10}
            ];

            coords.forEach((pt, idx) => {
                const item = document.createElement('div');
                item.className = `bg-item d-${(idx % 4) + 1}`;
                item.style.left = `${pt.x}%`;
                item.style.top = `${pt.y}%`;
                item.style.setProperty('--rot', `${pt.r}deg`);

                const icon = iconsList[idx % iconsList.length];
                const color = colorClasses[idx % colorClasses.length];

                item.innerHTML = `<i data-lucide="${icon}" class="neon-icon ${color}"></i>`;
                bgContainer.appendChild(item);
            });

            lucide.createIcons();
        }

        renderBackground(defaultIcons);

        function showToast(msg) {
            const toast = document.getElementById('toast');
            toast.innerText = msg;
            toast.classList.add('show');
            setTimeout(() => toast.classList.remove('show'), 3000);
        }

        let currentSubject = '';
        let totalQuestionsCount = 10;
        let currentQuestionIndex = 0;
        let questionsData = [];
        let userAnswers = [];

        function selectSubject(subject) {
            if (subject === 'algebra') {
                showToast('Розділ "Алгебра" знаходиться в розробці!');
                return;
            }
            currentSubject = subject;
            renderBackground(geometryIcons);
            showScreen('screen-count');
        }

        function showScreen(screenId) {
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            document.getElementById(screenId).classList.add('active');

            const btnNext = document.getElementById('btn-next');
            if (screenId === 'screen-quiz') {
                btnNext.style.display = 'flex';
            } else {
                btnNext.style.display = 'none';
            }
        }

        const SVGS = {
            rightTriangle: `<svg width="150" height="110" viewBox="0 0 150 110"><path d="M 25 90 L 125 90 L 25 20 Z" fill="none" stroke="#00f3ff" stroke-width="3"/><path d="M 25 80 L 35 80 L 35 90" fill="none" stroke="#00f3ff" stroke-width="2"/><text x="10" y="60" fill="#bf00ff" font-weight="bold">a</text><text x="70" y="105" fill="#bf00ff" font-weight="bold">b</text><text x="85" y="50" fill="#ff007f" font-weight="bold">c</text></svg>`,
            trapezoid: `<svg width="160" height="100" viewBox="0 0 160 100"><polygon points="35,20 125,20 150,80 10,80" fill="none" stroke="#ff007f" stroke-width="3"/><line x1="22.5" y1="50" x2="137.5" y2="50" stroke="#00f3ff" stroke-width="2" stroke-dasharray="4,4"/><text x="75" y="15" fill="#00f3ff">a</text><text x="75" y="96" fill="#00f3ff">b</text><text x="80" y="45" fill="#bf00ff">m</text></svg>`,
            circleAngle: `<svg width="120" height="120" viewBox="0 0 120 120"><circle cx="60" cy="60" r="45" fill="none" stroke="#00f3ff" stroke-width="3"/><path d="M 60 60 L 28 92 M 60 60 L 92 92" stroke="#ff007f" stroke-width="2"/><path d="M 60 15 L 28 92 M 60 15 L 92 92" stroke="#bf00ff" stroke-width="2"/><circle cx="60" cy="60" r="3" fill="#00f3ff"/></svg>`,
            parallelogram: `<svg width="160" height="90" viewBox="0 0 160 90"><polygon points="35,15 145,15 125,75 15,75" fill="none" stroke="#bf00ff" stroke-width="3"/><line x1="35" y1="15" x2="35" y2="75" stroke="#00f3ff" stroke-width="2" stroke-dasharray="4,4"/><text x="70" y="87" fill="#00f3ff">a</text><text x="40" y="50" fill="#ff007f">h</text></svg>`
        };

        // --- ИСТОРИЯ В LOCALSTORAGE ---
        function getSeenQuestions() {
            try {
                return JSON.parse(localStorage.getItem('geometry_seen_questions')) || [];
            } catch (e) {
                return [];
            }
        }

        function saveSeenQuestions(list) {
            try {
                localStorage.setItem('geometry_seen_questions', JSON.stringify(list));
            } catch (e) {}
        }

        function getTriangleName() {
            const names = ['ABC', 'KLM', 'MNK', 'PQR', 'CDE', 'STU', 'XYZ', 'FGH', 'KMN'];
            return names[Math.floor(Math.random() * names.length)];
        }

        function getQuadName() {
            const names = ['ABCD', 'KLMN', 'PQRS', 'EFGH', 'AVCD'];
            return names[Math.floor(Math.random() * names.length)];
        }

        // --- 20 ДИНАМИЧЕСКИХ ГЕНЕРАТОРОВ ЗАДАЧ ---
        const questionGenerators = [
            // 1. Гипотенуза
            () => {
                const triples = [[3,4,5], [5,12,13], [8,15,17], [7,24,25], [9,40,41], [12,35,37], [20,21,29], [11,60,61]];
                const mult = Math.floor(Math.random() * 5) + 1;
                const t = triples[Math.floor(Math.random() * triples.length)];
                const a = t[0] * mult, b = t[1] * mult, c = t[2] * mult;
                const name = getTriangleName();
                return {
                    text: `У прямокутному трикутнику ${name} катети дорівнюють ${a} см і ${b} см. Знайдіть довжину гіпотенузи.`,
                    diagram: SVGS.rightTriangle,
                    correctVal: `${c} см`,
                    wrongs: [`${c + 2} см`, `${c - 1} см`, `${a + b} см`, `${c + 4} см`],
                    explanation: `За теоремою Піфагора: c² = a² + b² = ${a}² + ${b}² = ${a*a} + ${b*b} = ${c*c}. Отже, гіпотенуза дорівнює √${c*c} = ${c} см.`
                };
            },
            // 2. Катет
            () => {
                const triples = [[3,4,5], [5,12,13], [8,15,17], [7,24,25], [9,40,41], [12,35,37], [20,21,29]];
                const mult = Math.floor(Math.random() * 4) + 1;
                const t = triples[Math.floor(Math.random() * triples.length)];
                const a = t[0] * mult, b = t[1] * mult, c = t[2] * mult;
                const name = getTriangleName();
                return {
                    text: `Гіпотенуза прямокутного трикутника ${name} дорівнює ${c} см, а один із катетів — ${a} см. Знайдіть другий катет.`,
                    diagram: SVGS.rightTriangle,
                    correctVal: `${b} см`,
                    wrongs: [`${b + 2} см`, `${b - 1} см`, `${c - a} см`, `${b + 3} см`],
                    explanation: `За теоремою Піфагора: b² = c² - a² = ${c}² - ${a}² = ${c*c} - ${a*a} = ${b*b}. Отже, другий катет дорівнює √${b*b} = ${b} см.`
                };
            },
            // 3. Средняя линия трапеции
            () => {
                const baseA = 2 + Math.floor(Math.random() * 15) * 2;
                const diff = 2 + Math.floor(Math.random() * 10) * 2;
                const baseB = baseA + diff;
                const m = (baseA + baseB) / 2;
                return {
                    text: `Основи рівнобічної трапеції дорівнюють ${baseA} см і ${baseB} см. Знайдіть її середню лінію.`,
                    diagram: SVGS.trapezoid,
                    correctVal: `${m} см`,
                    wrongs: [`${m + 2} см`, `${baseA + baseB} см`, `${m - 1} см`, `${m + 3} см`],
                    explanation: `Середня лінія трапеції дорівнює півсумі її основ: m = (a + b) / 2 = (${baseA} + ${baseB}) / 2 = ${m} см.`
                };
            },
            // 4. Поиск основания трапеции
            () => {
                const baseA = 4 + Math.floor(Math.random() * 12) * 2;
                const m = baseA + 3 + Math.floor(Math.random() * 8);
                const baseB = 2 * m - baseA;
                return {
                    text: `Одна з основ трапеції дорівнює ${baseA} см, а її середня лінія — ${m} см. Знайдіть другу основу трапеції.`,
                    diagram: SVGS.trapezoid,
                    correctVal: `${baseB} см`,
                    wrongs: [`${baseB + 2} см`, `${m + baseA} см`, `${baseB - 2} см`, `${m * 2} см`],
                    explanation: `Так як m = (a + b) / 2, то b = 2m - a = 2 · ${m} - ${baseA} = ${baseB} см.`
                };
            },
            // 5. Углы параллелограмма
            () => {
                const acute = 15 + Math.floor(Math.random() * 15) * 5;
                const obtuse = 180 - acute;
                const name = getQuadName();
                return {
                    text: `Один із кутів паралелограма ${name} дорівнює ${acute}°. Знайдіть градусну міру тупого кута цього паралелограма.`,
                    diagram: SVGS.parallelogram,
                    correctVal: `${obtuse}°`,
                    wrongs: [`${acute}°`, `${180 - acute + 10}°`, `90°`, `${obtuse - 15}°`],
                    explanation: `Сума двох сусідніх кутів паралелограма дорівнює 180°. Отже, тупий кут = 180° - ${acute}° = ${obtuse}°.`
                };
            },
            // 6. Центральный угол по вписанному
            () => {
                const inscribed = 10 + Math.floor(Math.random() * 35) * 2;
                const central = inscribed * 2;
                return {
                    text: `Вписаний кут спирається на дугу кола і дорівнює ${inscribed}°. Знайдіть центральний кут, що спирається на ту саму дугу.`,
                    diagram: SVGS.circleAngle,
                    correctVal: `${central}°`,
                    wrongs: [`${inscribed}°`, `${Math.round(inscribed / 2)}°`, `${central + 10}°`, `${central - 12}°`],
                    explanation: `Центральний кут у два рази більший за вписаний кут, який спирається на ту саму дугу: 2 · ${inscribed}° = ${central}°.`
                };
            },
            // 7. Вписанный угол по центральному
            () => {
                const central = 20 + Math.floor(Math.random() * 35) * 4;
                const inscribed = central / 2;
                return {
                    text: `Центральний кут дорівнює ${central}°. Знайдіть вписаний кут, що спирається на ту саму дугу кола.`,
                    diagram: SVGS.circleAngle,
                    correctVal: `${inscribed}°`,
                    wrongs: [`${central}°`, `${central * 2}°`, `${inscribed + 5}°`, `${inscribed - 5}°`],
                    explanation: `Вписаний кут дорівнює половині центрального кута, що спирається на ту саму дугу: ${central}° / 2 = ${inscribed}°.`
                };
            },
            // 8. Площадь треугольника
            () => {
                const base = 4 + Math.floor(Math.random() * 12) * 2;
                const height = 3 + Math.floor(Math.random() * 12);
                const area = (base * height) / 2;
                const name = getTriangleName();
                return {
                    text: `Обчисліть площу трикутника ${name}, якщо його сторона дорівнює ${base} см, а висота, проведена до цієї сторони — ${height} см.`,
                    diagram: '',
                    correctVal: `${area} см²`,
                    wrongs: [`${base * height} см²`, `${area + 4} см²`, `${area - 2} см²`, `${area + 6} см²`],
                    explanation: `Площа трикутника обчислюється за формулою S = ½ · a · h = ½ · ${base} · ${height} = ${area} см².`
                };
            },
            // 9. Площадь ромба
            () => {
                const d1 = 4 + Math.floor(Math.random() * 10) * 2;
                const d2 = 6 + Math.floor(Math.random() * 10) * 2;
                const area = (d1 * d2) / 2;
                return {
                    text: `Діагоналі ромба дорівнюють ${d1} см і ${d2} см. Знайдіть його площу.`,
                    diagram: '',
                    correctVal: `${area} см²`,
                    wrongs: [`${d1 * d2} см²`, `${area + 5} см²`, `${d1 + d2} см²`, `${area - 3} см²`],
                    explanation: `Площа ромба дорівнює півдобутку його діагоналей: S = ½ · d₁ · d₂ = ½ · ${d1} · ${d2} = ${area} см².`
                };
            },
            // 10. Площадь параллелограмма
            () => {
                const side = 4 + Math.floor(Math.random() * 15);
                const height = 3 + Math.floor(Math.random() * 10);
                const area = side * height;
                const name = getQuadName();
                return {
                    text: `Сторона паралелограма ${name} дорівнює ${side} см, а висота, проведена до неї — ${height} см. Знайдіть площу паралелограма.`,
                    diagram: SVGS.parallelogram,
                    correctVal: `${area} см²`,
                    wrongs: [`${area / 2} см²`, `${area + 4} см²`, `${(side + height) * 2} см²`, `${area - 5} см²`],
                    explanation: `Площа паралелограма дорівнює добутку його сторони на висоту, проведену до цієї сторони: S = a · h = ${side} · ${height} = ${area} см².`
                };
            },
            // 11. Отношение площадей подобных треугольников
            () => {
                const k = 2 + Math.floor(Math.random() * 6);
                const kSquared = k * k;
                return {
                    text: `Коефіцієнт подібності двох трикутників дорівнює k = ${k}. Знайдіть відношення їхніх площ.`,
                    diagram: '',
                    correctVal: `1 : ${kSquared}`,
                    wrongs: [`1 : ${k}`, `1 : ${k * 2}`, `1 : ${kSquared + 3}`, `1 : ${k + 4}`],
                    explanation: `Відношення площ двох подібних трикутників дорівнює квадрату коефіцієнта подібності: S₁ / S₂ = k² = ${k}² = ${kSquared}.`
                };
            },
            // 12. Сумма углов n-угольника
            () => {
                const n = 5 + Math.floor(Math.random() * 8);
                const sum = (n - 2) * 180;
                return {
                    text: `Знайдіть суму внутрішніх кутів опуклого ${n}-кутника.`,
                    diagram: '',
                    correctVal: `${sum}°`,
                    wrongs: [`${sum + 180}°`, `${sum - 180}°`, `${n * 180}°`, `${sum + 90}°`],
                    explanation: `Сума кутів опуклого n-кутника обчислюється за формулою S = (n - 2) · 180°. Для n = ${n}: (${n} - 2) · 180° = ${n-2} · 180° = ${sum}°.`
                };
            },
            // 13. Периметр квадрата по площади
            () => {
                const a = 3 + Math.floor(Math.random() * 15);
                const area = a * a;
                const perimeter = 4 * a;
                return {
                    text: `Площа квадрата дорівнює ${area} см². Знайдіть його периметр.`,
                    diagram: '',
                    correctVal: `${perimeter} см`,
                    wrongs: [`${a} см`, `${area / 2} см`, `${perimeter + 4} см`, `${perimeter - 2} см`],
                    explanation: `Сторона квадрата: a = √S = √${area} = ${a} см. Його периметр: P = 4 · a = 4 · ${a} = ${perimeter} см.`
                };
            },
            // 14. Средняя линия треугольника
            () => {
                const side = 6 + Math.floor(Math.random() * 16) * 2;
                const mid = side / 2;
                const name = getTriangleName();
                return {
                    text: `Сторона трикутника ${name} дорівнює ${side} см. Знайдіть довжину середньої лінії трикутника, що паралельна цій стороні.`,
                    diagram: '',
                    correctVal: `${mid} см`,
                    wrongs: [`${side} см`, `${mid + 2} см`, `${mid - 1} см`, `${mid * 2} см`],
                    explanation: `Середня лінія трикутника паралельна одній з його сторін і дорівнює її половині: m = ${side} / 2 = ${mid} см.`
                };
            },
            // 15. Синус острого угла
            () => {
                const triples = [[3,4,5], [5,12,13], [8,15,17], [7,24,25]];
                const t = triples[Math.floor(Math.random() * triples.length)];
                const a = t[0], c = t[2];
                return {
                    text: `У прямокутному трикутнику протилежний катет дорівнює ${a} см, а гіпотенуза — ${c} см. Чому дорівнює синус цього гострого кута?`,
                    diagram: SVGS.rightTriangle,
                    correctVal: `${a}/${c}`,
                    wrongs: [`${t[1]}/${c}`, `${c}/${a}`, `${a}/${t[1]}`, `${t[1]}/${a}`],
                    explanation: `Синус гострого кута прямокутного трикутника дорівнює відношенню протилежного катета до гіпотенузи: sin α = ${a}/${c}.`
                };
            },
            // 16. Косинус острого угла
            () => {
                const triples = [[3,4,5], [5,12,13], [8,15,17], [7,24,25]];
                const t = triples[Math.floor(Math.random() * triples.length)];
                const b = t[1], c = t[2];
                return {
                    text: `У прямокутному трикутнику прилеглий катет дорівнює ${b} см, а гіпотенуза — ${c} см. Чому дорівнює косинус цього кута?`,
                    diagram: SVGS.rightTriangle,
                    correctVal: `${b}/${c}`,
                    wrongs: [`${t[0]}/${c}`, `${c}/${b}`, `${b}/${t[0]}`, `${t[0]}/${b}`],
                    explanation: `Косинус гострого кута прямокутного трикутника дорівнює відношенню прилеглого катета до гіпотенузи: cos α = ${b}/${c}.`
                };
            },
            // 17. Площадь прямоугольника
            () => {
                const a = 3 + Math.floor(Math.random() * 15);
                const b = 4 + Math.floor(Math.random() * 15);
                const area = a * b;
                const name = getQuadName();
                return {
                    text: `Сторони прямокутника ${name} дорівнюють ${a} см і ${b} см. Знайдіть його площу.`,
                    diagram: '',
                    correctVal: `${area} см²`,
                    wrongs: [`${(a + b) * 2} см²`, `${area + 5} см²`, `${a + b} см²`, `${area - 3} см²`],
                    explanation: `Площа прямокутника обчислюється за формулою S = a · b = ${a} · ${b} = ${area} см².`
                };
            },
            // 18. Периметр ромба
            () => {
                const a = 4 + Math.floor(Math.random() * 20);
                const p = 4 * a;
                return {
                    text: `Сторона ромба дорівнює ${a} см. Знайдіть його периметр.`,
                    diagram: '',
                    correctVal: `${p} см`,
                    wrongs: [`${a * a} см`, `${p + 4} см`, `${p - 2} см`, `${a * 2} см`],
                    explanation: `Усі 4 сторони ромба рівні. Його периметр P = 4 · a = 4 · ${a} = ${p} см.`
                };
            },
            // 19. Площадь прямоугольного треугольника по катетам
            () => {
                const a = 4 + Math.floor(Math.random() * 10) * 2;
                const b = 3 + Math.floor(Math.random() * 12);
                const area = (a * b) / 2;
                const name = getTriangleName();
                return {
                    text: `Катети прямокутного трикутника ${name} дорівнюють ${a} см і ${b} см. Знайдіть його площу.`,
                    diagram: SVGS.rightTriangle,
                    correctVal: `${area} см²`,
                    wrongs: [`${a * b} см²`, `${area + 4} см²`, `${area - 2} см²`, `${a + b} см²`],
                    explanation: `Площа прямокутного трикутника дорівнює півдобутку його катетів: S = ½ · a · b = ½ · ${a} · ${b} = ${area} см².`
                };
            },
            // 20. Периметр равностороннего треугольника
            () => {
                const a = 5 + Math.floor(Math.random() * 25);
                const p = 3 * a;
                const name = getTriangleName();
                return {
                    text: `Сторона рівностороннього трикутника ${name} дорівнює ${a} см. Знайдіть його периметр.`,
                    diagram: '',
                    correctVal: `${p} см`,
                    wrongs: [`${p + 3} см`, `${a * 4} см`, `${p - 3} см`, `${a * a} см`],
                    explanation: `У рівностороннього трикутника всі 3 сторони рівні: P = 3 · a = 3 · ${a} = ${p} см.`
                };
            }
        ];

        // --- ГАРАНТИРОВАННАЯ СИСТЕМА УНИКАЛЬНОСТИ ---
        function generateUniqueQuestions(count) {
            const currentTestTexts = new Set();
            const resultList = [];
            
            const historyList = getSeenQuestions();
            const historySet = new Set(historyList);

            let attempts = 0;
            const maxAttempts = 10000;

            // ФАЗА 1: Ищем абсолютно новые задачи (которых нет ни в текущем тесте, ни в истории)
            while (resultList.length < count && attempts < maxAttempts) {
                attempts++;
                const gen = questionGenerators[Math.floor(Math.random() * questionGenerators.length)];
                const qRaw = gen();

                if (!currentTestTexts.has(qRaw.text) && !historySet.has(qRaw.text)) {
                    currentTestTexts.add(qRaw.text);

                    let allOptions = [qRaw.correctVal, ...qRaw.wrongs.slice(0, 3)];
                    allOptions.sort(() => Math.random() - 0.5);
                    const correctIdx = allOptions.indexOf(qRaw.correctVal);

                    resultList.push({
                        text: qRaw.text,
                        diagram: qRaw.diagram,
                        options: allOptions,
                        correct: correctIdx,
                        explanation: qRaw.explanation
                    });
                }
            }

            // ФАЗА 2: Если история заполнена, добираем задачи, но СТРОГО УНИКАЛЬНЫЕ ДЛЯ ТЕКУЩЕГО ТЕСТА
            attempts = 0;
            while (resultList.length < count && attempts < maxAttempts) {
                attempts++;
                const gen = questionGenerators[Math.floor(Math.random() * questionGenerators.length)];
                const qRaw = gen();

                if (!currentTestTexts.has(qRaw.text)) {
                    currentTestTexts.add(qRaw.text);

                    let allOptions = [qRaw.correctVal, ...qRaw.wrongs.slice(0, 3)];
                    allOptions.sort(() => Math.random() - 0.5);
                    const correctIdx = allOptions.indexOf(qRaw.correctVal);

                    resultList.push({
                        text: qRaw.text,
                        diagram: qRaw.diagram,
                        options: allOptions,
                        correct: correctIdx,
                        explanation: qRaw.explanation
                    });
                }
            }

            // Обновляем историю в localStorage
            const updatedHistory = Array.from(new Set([...historyList, ...Array.from(currentTestTexts)]));
            // Если история превышает 500 вопросов, оставляем последние 200
            if (updatedHistory.length > 500) {
                saveSeenQuestions(updatedHistory.slice(-200));
            } else {
                saveSeenQuestions(updatedHistory);
            }

            return resultList;
        }

        function startTest(count) {
            totalQuestionsCount = count;
            currentQuestionIndex = 0;
            userAnswers = new Array(count).fill(null);
            questionsData = generateUniqueQuestions(count);

            showScreen('screen-quiz');
            loadQuestion(0);
        }

        function loadQuestion(index) {
            const q = questionsData[index];

            document.getElementById('quiz-progress').innerText = `Завдання ${index + 1} з ${totalQuestionsCount}`;
            document.getElementById('question-text').innerText = q.text;

            const diagContainer = document.getElementById('diagram-container');
            if (q.diagram) {
                diagContainer.style.display = 'flex';
                diagContainer.innerHTML = q.diagram;
            } else {
                diagContainer.style.display = 'none';
            }

            const optionsGrid = document.getElementById('options-grid');
            optionsGrid.innerHTML = '';

            const explanationBox = document.getElementById('explanation-box');
            explanationBox.classList.remove('active');

            const savedAnswer = userAnswers[index];

            q.options.forEach((optText, optIdx) => {
                const btn = document.createElement('button');
                btn.className = 'btn-option';
                btn.innerText = optText;

                if (savedAnswer !== null) {
                    btn.disabled = true;
                    if (optIdx === q.correct) {
                        btn.classList.add('correct');
                    }
                    if (savedAnswer === optIdx && savedAnswer !== q.correct) {
                        btn.classList.add('incorrect');
                    }
                } else {
                    btn.onclick = () => handleAnswer(optIdx);
                }

                optionsGrid.appendChild(btn);
            });

            if (savedAnswer !== null && savedAnswer !== q.correct) {
                document.getElementById('explanation-text').innerText = q.explanation;
                explanationBox.classList.add('active');
            }
        }

        function handleAnswer(selectedIndex) {
            userAnswers[currentQuestionIndex] = selectedIndex;
            const q = questionsData[currentQuestionIndex];
            const optionsGrid = document.getElementById('options-grid');
            const buttons = optionsGrid.querySelectorAll('.btn-option');

            buttons.forEach(b => b.disabled = true);

            if (selectedIndex === q.correct) {
                buttons[selectedIndex].classList.add('correct');
            } else {
                buttons[selectedIndex].classList.add('incorrect');
                buttons[q.correct].classList.add('correct');

                document.getElementById('explanation-text').innerText = q.explanation;
                document.getElementById('explanation-box').classList.add('active');
            }
        }

        function nextQuestion() {
            if (currentQuestionIndex < totalQuestionsCount - 1) {
                currentQuestionIndex++;
                loadQuestion(currentQuestionIndex);
            } else {
                finishTest();
            }
        }

        function finishTest() {
            showScreen('screen-results');
            const resultsList = document.getElementById('results-list');
            resultsList.innerHTML = '';

            questionsData.forEach((q, idx) => {
                const ans = userAnswers[idx];
                const card = document.createElement('div');
                
                let statusClass = 'is-skipped';
                let badgeHTML = '<span class="status-badge badge-skipped">Пропущено</span>';

                if (ans !== null) {
                    if (ans === q.correct) {
                        statusClass = 'is-correct';
                        badgeHTML = '<span class="status-badge badge-correct">Правильно</span>';
                    } else {
                        statusClass = 'is-incorrect';
                        badgeHTML = '<span class="status-badge badge-incorrect">Неправильно</span>';
                    }
                }

                card.className = `result-item-card ${statusClass}`;
                card.innerHTML = `
                    ${badgeHTML}
                    <div style="font-weight: 800; font-size: 1.1rem; margin-bottom: 8px;">№${idx + 1}. ${q.text}</div>
                    <div style="font-size: 0.95rem; margin-bottom: 6px;">
                        Ваша відповідь: <strong style="color: ${ans === q.correct ? '#00ff66' : '#ff0055'}">${ans !== null ? q.options[ans] : 'Не вибрано'}</strong>
                    </div>
                    <div style="font-size: 0.95rem; margin-bottom: 10px;">
                        Правильна відповідь: <strong style="color: #00ff66">${q.options[q.correct]}</strong>
                    </div>
                    <div style="background: rgba(0,0,0,0.3); padding: 12px; border-radius: 10px; font-size: 0.9rem; line-height: 1.4;">
                        <strong style="color: #00f3ff;">Пояснення:</strong> ${q.explanation}
                    </div>
                `;
                resultsList.appendChild(card);
            });
        }

        function resetToHome() {
            renderBackground(defaultIcons);
            showScreen('screen-subject');
        }
    </script>

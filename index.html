<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Математика 9 Клас — Алгебра: Нерівності (Істер НУШ)</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700;800;900&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Montserrat', sans-serif;
        }

        body {
            min-height: 100vh;
            width: 100vw;
            background: radial-gradient(circle at center, #1b0933 0%, #070314 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            overflow-x: hidden;
            position: relative;
            color: #ffffff;
        }

        .background-objects {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            pointer-events: none;
            z-index: 1;
            overflow: hidden;
        }

        .bg-item {
            position: absolute;
            user-select: none;
            transform: translate(-50%, -50%);
            animation: float 6s infinite alternate ease-in-out;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .neon-icon {
            width: 44px;
            height: 44px;
            stroke-width: 2.2px;
            opacity: 0.55;
        }

        .neon-cyan {
            stroke: #00f3ff;
            color: #00f3ff;
            filter: drop-shadow(0 0 2px #ffffff) drop-shadow(0 0 6px #00f3ff) drop-shadow(0 0 14px #00f3ff);
        }

        .neon-purple {
            stroke: #bf00ff;
            color: #bf00ff;
            filter: drop-shadow(0 0 2px #ffffff) drop-shadow(0 0 6px #bf00ff) drop-shadow(0 0 14px #bf00ff);
        }

        .neon-pink {
            stroke: #ff007f;
            color: #ff007f;
            filter: drop-shadow(0 0 2px #ffffff) drop-shadow(0 0 6px #ff007f) drop-shadow(0 0 14px #ff007f);
        }

        .d-1 { animation-duration: 5.2s; animation-delay: 0s; }
        .d-2 { animation-duration: 6.8s; animation-delay: 1.2s; }
        .d-3 { animation-duration: 5.8s; animation-delay: 2.1s; }
        .d-4 { animation-duration: 7.4s; animation-delay: 0.6s; }

        @keyframes float {
            0% { transform: translate(-50%, -50%) translateY(0px) rotate(var(--rot, 0deg)) scale(1); }
            100% { transform: translate(-50%, -50%) translateY(-16px) rotate(calc(var(--rot, 0deg) + 10deg)) scale(1.06); }
        }

        .screen {
            display: none;
            position: relative;
            z-index: 2;
            width: 100%;
            max-width: 850px;
            padding: 20px;
            text-align: center;
        }

        .screen.active {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .title {
            font-size: 2.6rem;
            font-weight: 900;
            margin-bottom: 35px;
            color: #ffffff;
            text-transform: uppercase;
            letter-spacing: 2px;
            text-shadow: 0 0 10px #bf00ff, 0 0 20px #bf00ff, 0 0 40px #00f3ff;
        }

        .buttons-wrapper {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 25px;
            flex-wrap: wrap;
            width: 100%;
        }

        .btn-subject {
            background: rgba(15, 8, 35, 0.85);
            border: 3px solid;
            border-radius: 20px;
            padding: 18px 35px;
            font-size: 1.8rem;
            font-weight: 800;
            color: #ffffff;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 15px;
            backdrop-filter: blur(10px);
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            outline: none;
            user-select: none;
        }

        .btn-algebra { border-color: #bf00ff; box-shadow: 0 0 15px rgba(191, 0, 255, 0.4); }
        .btn-geometry { border-color: #00f3ff; box-shadow: 0 0 15px rgba(0, 243, 255, 0.4); opacity: 0.7; }

        .btn-algebra:hover { transform: scale(1.06); box-shadow: 0 0 30px rgba(191, 0, 255, 0.9); background: rgba(191, 0, 255, 0.2); }
        .btn-geometry:hover { transform: scale(1.06); box-shadow: 0 0 30px rgba(0, 243, 255, 0.9); background: rgba(0, 243, 255, 0.2); opacity: 1; }

        .count-grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 15px;
            width: 100%;
            max-width: 650px;
        }

        .btn-count {
            background: rgba(20, 10, 45, 0.85);
            border: 2.5px solid #bf00ff;
            border-radius: 16px;
            padding: 15px 0;
            font-size: 1.5rem;
            font-weight: 800;
            color: #ffffff;
            cursor: pointer;
            backdrop-filter: blur(8px);
            box-shadow: 0 0 12px rgba(191, 0, 255, 0.3);
            transition: all 0.25s ease;
        }

        .btn-count:hover {
            transform: translateY(-4px) scale(1.05);
            box-shadow: 0 0 25px #bf00ff;
            background: rgba(191, 0, 255, 0.25);
        }

        .quiz-card {
            background: rgba(18, 9, 38, 0.9);
            border: 2px solid #00f3ff;
            box-shadow: 0 0 30px rgba(0, 243, 255, 0.3);
            border-radius: 24px;
            padding: 30px;
            width: 100%;
            backdrop-filter: blur(15px);
            text-align: left;
            position: relative;
        }

        .quiz-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            font-weight: 800;
            color: #00f3ff;
            font-size: 1.1rem;
        }

        .question-text {
            font-size: 1.35rem;
            font-weight: 700;
            line-height: 1.5;
            margin-bottom: 20px;
            color: #ffffff;
        }

        .diagram-container {
            display: flex;
            justify-content: center;
            align-items: center;
            margin-bottom: 20px;
            background: rgba(0, 0, 0, 0.35);
            border-radius: 16px;
            padding: 15px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .options-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-bottom: 20px;
        }

        .btn-option {
            background: rgba(30, 15, 60, 0.7);
            border: 2px solid rgba(255, 255, 255, 0.2);
            border-radius: 14px;
            padding: 16px 20px;
            font-size: 1.1rem;
            font-weight: 700;
            color: #ffffff;
            cursor: pointer;
            text-align: left;
            transition: all 0.2s ease;
            outline: none;
        }

        .btn-option:hover:not(:disabled) {
            border-color: #00f3ff;
            background: rgba(0, 243, 255, 0.15);
            box-shadow: 0 0 12px rgba(0, 243, 255, 0.4);
        }

        .btn-option.correct {
            border-color: #00ff66 !important;
            background: rgba(0, 255, 102, 0.25) !important;
            box-shadow: 0 0 20px #00ff66 !important;
            color: #ffffff !important;
        }

        .btn-option.incorrect {
            border-color: #ff0055 !important;
            background: rgba(255, 0, 85, 0.25) !important;
            box-shadow: 0 0 20px #ff0055 !important;
            color: #ffffff !important;
        }

        .explanation-box {
            display: none;
            background: rgba(255, 0, 85, 0.1);
            border: 2px solid #ff0055;
            box-shadow: 0 0 15px rgba(255, 0, 85, 0.3);
            border-radius: 14px;
            padding: 18px;
            margin-top: 15px;
            font-size: 1rem;
            line-height: 1.5;
            color: #ffe6ee;
        }

        .explanation-box.active {
            display: block;
        }

        .explanation-title {
            font-weight: 800;
            color: #ff0055;
            margin-bottom: 6px;
            text-transform: uppercase;
            font-size: 0.9rem;
            letter-spacing: 1px;
        }

        .btn-next-fixed {
            position: fixed;
            bottom: 25px;
            right: 25px;
            z-index: 100;
            background: rgba(15, 8, 35, 0.95);
            border: 2.5px solid #00f3ff;
            box-shadow: 0 0 18px rgba(0, 243, 255, 0.5);
            color: #ffffff;
            padding: 14px 28px;
            border-radius: 16px;
            font-size: 1.2rem;
            font-weight: 800;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 10px;
            backdrop-filter: blur(10px);
            transition: all 0.25s ease;
        }

        .btn-next-fixed:hover {
            transform: scale(1.06);
            box-shadow: 0 0 30px #00f3ff;
            background: rgba(0, 243, 255, 0.25);
        }

        .results-list {
            width: 100%;
            max-height: 60vh;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 15px;
            padding-right: 10px;
            margin-bottom: 25px;
        }

        .result-item-card {
            background: rgba(20, 10, 45, 0.85);
            border: 2px solid rgba(255, 255, 255, 0.15);
            border-radius: 16px;
            padding: 20px;
            text-align: left;
        }

        .result-item-card.is-correct { border-color: #00ff66; box-shadow: 0 0 10px rgba(0, 255, 102, 0.2); }
        .result-item-card.is-incorrect { border-color: #ff0055; box-shadow: 0 0 10px rgba(255, 0, 85, 0.2); }
        .result-item-card.is-skipped { border-color: #ffd700; box-shadow: 0 0 10px rgba(255, 215, 0, 0.2); }

        .status-badge {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 8px;
            font-weight: 800;
            font-size: 0.85rem;
            margin-bottom: 10px;
            text-transform: uppercase;
        }

        .badge-correct { background: rgba(0, 255, 102, 0.2); color: #00ff66; border: 1px solid #00ff66; }
        .badge-incorrect { background: rgba(255, 0, 85, 0.2); color: #ff0055; border: 1px solid #ff0055; }
        .badge-skipped { background: rgba(255, 215, 0, 0.2); color: #ffd700; border: 1px solid #ffd700; }

        .btn-restart {
            background: rgba(191, 0, 255, 0.2);
            border: 2.5px solid #bf00ff;
            box-shadow: 0 0 20px rgba(191, 0, 255, 0.5);
            color: #ffffff;
            padding: 15px 40px;
            border-radius: 18px;
            font-size: 1.3rem;
            font-weight: 800;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .btn-restart:hover {
            transform: scale(1.06);
            box-shadow: 0 0 35px #bf00ff;
            background: rgba(191, 0, 255, 0.4);
        }

        .toast {
            position: fixed;
            top: 30px;
            left: 50%;
            transform: translateX(-50%) translateY(-100px);
            background: rgba(20, 10, 40, 0.95);
            border: 2px solid #00f3ff;
            box-shadow: 0 0 20px #00f3ff;
            color: #fff;
            padding: 14px 28px;
            border-radius: 16px;
            font-weight: 800;
            font-size: 1.1rem;
            z-index: 1000;
            opacity: 0;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .toast.show {
            transform: translateX(-50%) translateY(0);
            opacity: 1;
        }

        @media (max-width: 650px) {
            .title { font-size: 2rem; }
            .count-grid { grid-template-columns: repeat(2, 1fr); }
            .options-grid { grid-template-columns: 1fr; }
            .btn-next-fixed { bottom: 15px; right: 15px; padding: 12px 20px; font-size: 1rem; }
        }
    </style>
</head>
<body>

    <div class="toast" id="toast">Повідомлення</div>

    <div class="background-objects" id="bg-container"></div>

    <!-- 1. ВИБІР ПРЕДМЕТА -->
    <div class="screen active" id="screen-subject">
        <h1 class="title">Оберіть предмет</h1>
        <div class="buttons-wrapper">
            <button class="btn-subject btn-algebra" onclick="selectSubject('algebra')">
                <span style="font-family: serif; font-style: italic; font-weight: bold; font-size: 2rem;">√x</span>
                <span>Алгебра</span>
                <span>📊</span>
            </button>
            <button class="btn-subject btn-geometry" onclick="selectSubject('geometry')">
                <span>📐</span>
                <span>Геометрія</span>
                <span>✏️</span>
            </button>
        </div>
    </div>

    <!-- 2. ВИБІР КІЛЬКОСТІ ЗАВДАНЬ -->
    <div class="screen" id="screen-count">
        <h1 class="title">Кількість завдань</h1>
        <div class="count-grid">
            <button class="btn-count" onclick="startTest(5)">5</button>
            <button class="btn-count" onclick="startTest(10)">10</button>
            <button class="btn-count" onclick="startTest(15)">15</button>
            <button class="btn-count" onclick="startTest(20)">20</button>
            <button class="btn-count" onclick="startTest(25)">25</button>
            <button class="btn-count" onclick="startTest(30)">30</button>
            <button class="btn-count" onclick="startTest(35)">35</button>
            <button class="btn-count" onclick="startTest(40)">40</button>
            <button class="btn-count" onclick="startTest(45)">45</button>
            <button class="btn-count" onclick="startTest(50)">50</button>
        </div>
    </div>

    <!-- 3. ТЕСТУВАННЯ -->
    <div class="screen" id="screen-quiz">
        <div class="quiz-card">
            <div class="quiz-header">
                <span id="quiz-progress">Завдання 1 з 10</span>
                <span id="quiz-topic" style="color: #00f3ff;">Тема: Нерівності (9 клас Істер)</span>
            </div>
            
            <div class="question-text" id="question-text">Текст питання...</div>
            
            <div class="diagram-container" id="diagram-container"></div>

            <div class="options-grid" id="options-grid"></div>

            <div class="explanation-box" id="explanation-box">
                <div class="explanation-title">Пояснення:</div>
                <div id="explanation-text">...</div>
            </div>
        </div>
    </div>

    <!-- КНОПКА "ДАЛІ" -->
    <button class="btn-next-fixed" id="btn-next" style="display: none;" onclick="nextQuestion()">
        <span>Далі</span>
        <span>➔</span>
    </button>

    <!-- 4. ФІНІШ -->
    <div class="screen" id="screen-results">
        <h1 class="title">Результати тесту</h1>
        <div class="results-list" id="results-list"></div>
        <button class="btn-restart" onclick="resetToHome()">На головну</button>
    </div>

    <script>
        const defaultIcons = ['calculator', 'percent', 'hash', 'binary', 'bar-chart-2', 'trending-up', 'sparkles'];
        const algebraIcons = ['calculator', 'percent', 'hash', 'binary', 'bar-chart-2', 'trending-up', 'sparkles'];

        function renderBackground(iconsList) {
            const bgContainer = document.getElementById('bg-container');
            bgContainer.innerHTML = '';
            
            const colorClasses = ['neon-cyan', 'neon-purple', 'neon-pink'];
            const coords = [
                {x: 7, y: 10, r: -25}, {x: 22, y: 14, r: 18}, {x: 38, y: 8, r: -12}, {x: 54, y: 12, r: 30}, {x: 72, y: 9, r: -15}, {x: 90, y: 13, r: 22},
                {x: 12, y: 32, r: 35}, {x: 28, y: 35, r: -20}, {x: 45, y: 28, r: 15}, {x: 62, y: 33, r: -30}, {x: 82, y: 30, r: 10},
                {x: 6, y: 58, r: -18}, {x: 20, y: 62, r: 25}, {x: 80, y: 55, r: -22}, {x: 94, y: 60, r: 16},
                {x: 10, y: 85, r: 20}, {x: 26, y: 88, r: -28}, {x: 42, y: 82, r: 14}, {x: 58, y: 89, r: -18}, {x: 74, y: 84, r: 32}, {x: 90, y: 87, r: -10}
            ];

            coords.forEach((pt, idx) => {
                const item = document.createElement('div');
                item.className = `bg-item d-${(idx % 4) + 1}`;
                item.style.left = `${pt.x}%`;
                item.style.top = `${pt.y}%`;
                item.style.setProperty('--rot', `${pt.r}deg`);

                const icon = iconsList[idx % iconsList.length];
                const color = colorClasses[idx % colorClasses.length];

                item.innerHTML = `<i data-lucide="${icon}" class="neon-icon ${color}"></i>`;
                bgContainer.appendChild(item);
            });

            lucide.createIcons();
        }

        renderBackground(algebraIcons);

        function showToast(msg) {
            const toast = document.getElementById('toast');
            toast.innerText = msg;
            toast.classList.add('show');
            setTimeout(() => toast.classList.remove('show'), 3000);
        }

        let currentSubject = 'algebra';
        let totalQuestionsCount = 10;
        let currentQuestionIndex = 0;
        let questionsData = [];
        let userAnswers = [];

        function selectSubject(subject) {
            if (subject === 'geometry') {
                showToast('Ви переключились на Геометрію');
            }
            currentSubject = subject;
            showScreen('screen-count');
        }

        function showScreen(screenId) {
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            document.getElementById(screenId).classList.add('active');

            const btnNext = document.getElementById('btn-next');
            if (screenId === 'screen-quiz') {
                btnNext.style.display = 'flex';
            } else {
                btnNext.style.display = 'none';
            }
        }

        // --- ДИНАМІЧНІ SVG ДЛЯ ЧИСЛОВОЇ ПРЯМОЇ ТА ІНТЕРВАЛІВ ---
        function drawRaySVG(val, isClosed, directionRight) {
            const circleFill = isClosed ? "#00f3ff" : "#070414";
            const lineStartX = directionRight ? 130 : 25;
            const lineEndX = directionRight ? 255 : 130;
            const bracket = directionRight ? (isClosed ? "[" : "(") : (isClosed ? "]" : ")");

            return `<svg width="290" height="90" viewBox="0 0 290 90">
                <!-- Одинарна числова пряма -->
                <line x1="15" y1="50" x2="265" y2="50" stroke="#bf00ff" stroke-width="3"/>
                <polygon points="265,45 278,50 265,55" fill="#bf00ff"/>
                <text x="270" y="70" fill="#bf00ff" font-weight="800" font-size="14">x</text>
                
                <!-- Заштрихована/підсвічена область -->
                <line x1="${lineStartX}" y1="50" x2="${lineEndX}" y2="50" stroke="#00f3ff" stroke-width="7" opacity="0.85"/>
                <path d="M ${lineStartX} 38 L ${lineEndX} 38" stroke="#ff007f" stroke-width="2" stroke-dasharray="4,4"/>

                <!-- Точка на прямій -->
                <circle cx="130" cy="50" r="7" fill="${circleFill}" stroke="#00f3ff" stroke-width="3"/>
                <text x="124" y="75" fill="#00f3ff" font-weight="800" font-size="15">${val}</text>
            </svg>`;
        }

        function drawIntervalSVG(valA, valB, isClosedA, isClosedB) {
            const fillA = isClosedA ? "#00f3ff" : "#070414";
            const fillB = isClosedB ? "#00f3ff" : "#070414";

            return `<svg width="290" height="90" viewBox="0 0 290 90">
                <line x1="15" y1="50" x2="265" y2="50" stroke="#bf00ff" stroke-width="3"/>
                <polygon points="265,45 278,50 265,55" fill="#bf00ff"/>
                <text x="270" y="70" fill="#bf00ff" font-weight="800" font-size="14">x</text>
                
                <!-- Виділений інтервал між valA та valB -->
                <line x1="85" y1="50" x2="195" y2="50" stroke="#00f3ff" stroke-width="7" opacity="0.85"/>
                <path d="M 85 38 L 195 38" stroke="#ff007f" stroke-width="2" stroke-dasharray="4,4"/>

                <circle cx="85" cy="50" r="7" fill="${fillA}" stroke="#00f3ff" stroke-width="3"/>
                <text x="78" y="75" fill="#00f3ff" font-weight="800" font-size="14">${valA}</text>

                <circle cx="195" cy="50" r="7" fill="${fillB}" stroke="#00f3ff" stroke-width="3"/>
                <text x="188" y="75" fill="#00f3ff" font-weight="800" font-size="14">${valB}</text>
            </svg>`;
        }

        // --- ІСТОРІЯ В LOCALSTORAGE ДЛЯ УНІКАЛЬНОСТІ ---
        function getSeenQuestions() {
            try {
                return JSON.parse(localStorage.getItem('algebra_inequalities_seen')) || [];
            } catch (e) {
                return [];
            }
        }

        function saveSeenQuestions(list) {
            try {
                localStorage.setItem('algebra_inequalities_seen', JSON.stringify(list));
            } catch (e) {}
        }

        // --- 20 ДИНАМІЧНИХ ГЕНЕРАТОРІВ З АЛГЕБРИ (НЕРИВНОСТІ 9 КЛАС ІСТЕР) ---
        const algebraGenerators = [
            // 1. Лінійна нерівність ax > b (a > 0)
            () => {
                const a = 2 + Math.floor(Math.random() * 7);
                const val = (Math.floor(Math.random() * 15) - 7) * a;
                const b = val;
                const res = b / a;
                return {
                    text: `Розв'яжіть нерівність: ${a}x > ${b}`,
                    diagram: drawRaySVG(res, false, true),
                    correctVal: `x > ${res}`,
                    wrongs: [`x < ${res}`, `x > ${res * 2}`, `x < ${res - 1}`],
                    explanation: `Поділимо обидві частини нерівності на додатне число ${a}. Знак нерівності не змінюється: x > ${b} / ${a} ⇒ x > ${res}.`
                };
            },
            // 2. Лінійна нерівність зі зміною знака (a < 0)
            () => {
                const a = -(2 + Math.floor(Math.random() * 6));
                const res = Math.floor(Math.random() * 10) - 4;
                const b = a * res;
                return {
                    text: `Розв'яжіть нерівність: ${a}x ≤ ${b}`,
                    diagram: drawRaySVG(res, true, true),
                    correctVal: `x ≥ ${res}`,
                    wrongs: [`x ≤ ${res}`, `x ≥ ${-res}`, `x ≤ ${-res}`],
                    explanation: `Ділимо обидві частини нерівності на від'ємне число ${a}. При цьому знак нерівності змінюється на протилежний (з ≤ на ≥): x ≥ ${b} / (${a}) ⇒ x ≥ ${res}.`
                };
            },
            // 3. Порівняння виразів за їх різницею
            () => {
                const diff = Math.floor(Math.random() * 12) + 1;
                const isPositive = Math.random() > 0.5;
                const val = isPositive ? diff : -diff;
                return {
                    text: `Відомо, що a - b = ${val}. Порівняйте числа a i b.`,
                    diagram: '',
                    correctVal: isPositive ? `a > b` : `a < b`,
                    wrongs: [isPositive ? `a < b` : `a > b`, `a = b`, `Неможливо визначити`],
                    explanation: isPositive 
                        ? `Оскільки різниця a - b = ${val} > 0 (додатна), то a > b.`
                        : `Оскільки різниця a - b = ${val} < 0 (від'ємна), то a < b.`
                };
            },
            // 4. Запис у вигляді числового проміжку (строга)
            () => {
                const num = Math.floor(Math.random() * 20) - 10;
                return {
                    text: `Запишіть розв'язок нерівності x > ${num} у вигляді числового проміжку.`,
                    diagram: drawRaySVG(num, false, true),
                    correctVal: `(${num}; +∞)`,
                    wrongs: [`[${num}; +∞)`, `(-∞; ${num})`, `(-∞; ${num}]`],
                    explanation: `Строга нерівність (>) відповідає відкритому проміжку з круглою дужкою: (${num}; +∞). Точка ${num} не входить.`
                };
            },
            // 5. Запис у вигляді числового проміжку (нестрога)
            () => {
                const num = Math.floor(Math.random() * 20) - 10;
                return {
                    text: `Множиною розв'язків якої нерівності є проміжок (-∞; ${num}]?`,
                    diagram: drawRaySVG(num, true, false),
                    correctVal: `x ≤ ${num}`,
                    wrongs: [`x < ${num}`, `x ≥ ${num}`, `x > ${num}`],
                    explanation: `Квадратна дужка біля числа ${num} та напрямок до -∞ відповідають нестрогій нерівності x ≤ ${num}.`
                };
            },
            // 6. Найменше ціле рішення
            () => {
                const val = Math.floor(Math.random() * 14) - 5;
                const correctInt = val + 1;
                return {
                    text: `Вкажіть найменше ціле число, що є розв'язком нерівності x > ${val}.`,
                    diagram: drawRaySVG(val, false, true),
                    correctVal: `${correctInt}`,
                    wrongs: [`${val}`, `${val - 1}`, `${correctInt + 1}`],
                    explanation: `Число ${val} не входить у розв'язок, оскільки нерівність строга (x > ${val}). Найменшим цілим числом, більшим за ${val}, є ${correctInt}.`
                };
            },
            // 7. Найбільше ціле рішення
            () => {
                const val = Math.floor(Math.random() * 14) - 2;
                const correctInt = val;
                return {
                    text: `Знайдіть найбільше ціле число, що задовольняє нерівність x ≤ ${val}.`,
                    diagram: drawRaySVG(val, true, false),
                    correctVal: `${correctInt}`,
                    wrongs: [`${val + 1}`, `${val - 1}`, `${val + 2}`],
                    explanation: `Нерівність нестрога (x ≤ ${val}), тому число ${val} входить до розв'язків і є найбільшим цілим розв'язком.`
                };
            },
            // 8. Переріз проміжків (Система нерівностей)
            () => {
                const a = Math.floor(Math.random() * 5) - 3;
                const b = a + Math.floor(Math.random() * 6) + 2;
                return {
                    text: `Знайдіть переріз проміжків (${a}; +∞) і (-∞; ${b}]`,
                    diagram: drawIntervalSVG(a, b, false, true),
                    correctVal: `(${a}; ${b}]`,
                    wrongs: [`[${a}; ${b})`, `(${a}; ${b})`, `[-∞; ${b}]`],
                    explanation: `Переріз - це спільна частина обох проміжків. Елементи мають бути одночасно більшими за ${a} і не більшими за ${b}, тобто x ∈ (${a}; ${b}].`
                };
            },
            // 9. Оцінювання виразу (Додавання нерівностей)
            () => {
                const a1 = 2 + Math.floor(Math.random() * 4);
                const b1 = a1 + 3;
                const a2 = 1 + Math.floor(Math.random() * 5);
                const b2 = a2 + 4;
                const minSum = a1 + a2;
                const maxSum = b1 + b2;
                return {
                    text: `Відомо, що ${a1} < x < ${b1} і ${a2} < y < ${b2}. Оцініть значення виразу x + y.`,
                    diagram: '',
                    correctVal: `${minSum} < x + y < ${maxSum}`,
                    wrongs: [`${minSum - 1} < x + y < ${maxSum}`, `${a1 + b2} < x + y < ${b1 + a2}`, `${minSum} ≤ x + y ≤ ${maxSum}`],
                    explanation: `Почленно додаємо нерівності однакові за знаком: (${a1} + ${a2}) < x + y < (${b1} + ${b2}) ⇒ ${minSum} < x + y < ${maxSum}.`
                };
            },
            // 10. Оцінювання виразу (Множення нерівностей)
            () => {
                const a1 = 2 + Math.floor(Math.random() * 3);
                const b1 = a1 + 2;
                const a2 = 3 + Math.floor(Math.random() * 3);
                const b2 = a2 + 3;
                const minProd = a1 * a2;
                const maxProd = b1 * b2;
                return {
                    text: `Відомо, що всі числа додатні: ${a1} < a < ${b1} та ${a2} < b < ${b2}. Оцініть значення добутку ab.`,
                    diagram: '',
                    correctVal: `${minProd} < ab < ${maxProd}`,
                    wrongs: [`${a1 * b2} < ab < ${b1 * a2}`, `${minProd} ≤ ab ≤ ${maxProd}`, `${a1 + a2} < ab < ${b1 + b2}`],
                    explanation: `Перемножуємо почленно нерівності з додатними членами: (${a1} · ${a2}) < ab < (${b1} · ${b2}) ⇒ ${minProd} < ab < ${maxProd}.`
                };
            },
            // 11. Область визначення функції з коренем
            () => {
                const k = 2 + Math.floor(Math.random() * 4);
                const bVal = (Math.floor(Math.random() * 6) + 1) * k;
                const res = -bVal / k;
                return {
                    text: `Знайдіть область визначення функції y = √(${k}x + ${bVal})`,
                    diagram: drawRaySVG(res, true, true),
                    correctVal: `[${res}; +∞)`,
                    wrongs: [`(${res}; +∞)`, `(-∞; ${res}]`, `[${-res}; +∞)`],
                    explanation: `Підкореневий вираз має бути невід'ємним: ${k}x + ${bVal} ≥ 0 ⇒ ${k}x ≥ -${bVal} ⇒ x ≥ ${res}. Тобто x ∈ [${res}; +∞).`
                };
            },
            // 12. Подвійна нерівність
            () => {
                const min = 1 + Math.floor(Math.random() * 4);
                const max = min + 6;
                const k = 2;
                const low = min * k;
                const high = max * k;
                return {
                    text: `Розв'яжіть подвійну нерівність: ${low} < ${k}x < ${high}`,
                    diagram: drawIntervalSVG(min, max, false, false),
                    correctVal: `${min} < x < ${max}`,
                    wrongs: [`${low} < x < ${high}`, `${min} ≤ x ≤ ${max}`, `${min / 2} < x < ${max / 2}`],
                    explanation: `Поділимо всі три частини подвійної нерівності на ${k}: (${low}/${k}) < x < (${high}/${k}) ⇒ ${min} < x < ${max}.`
                };
            },
            // 13. Нерівність з модулем (|x| <= a)
            () => {
                const a = 2 + Math.floor(Math.random() * 8);
                return {
                    text: `Знайдіть множину розв'язків нерівності |x| ≤ ${a}`,
                    diagram: drawIntervalSVG(-a, a, true, true),
                    correctVal: `[-${a}; ${a}]`,
                    wrongs: [`(-∞; ${a}]`, `[${a}; +∞)`, `(-${a}; ${a})`],
                    explanation: `Нерівність виду |x| ≤ a еквівалентна подвійній нерівності -a ≤ x ≤ a. Отже, розв'язком є відрізок [-${a}; ${a}].`
                };
            },
            // 14. Нерівність з модулем (|x| > a)
            () => {
                const a = 3 + Math.floor(Math.random() * 7);
                return {
                    text: `Розв'яжіть нерівність: |x| > ${a}`,
                    diagram: '',
                    correctVal: `(-∞; -${a}) ∪ (${a}; +∞)`,
                    wrongs: [`(-${a}; ${a})`, `[${a}; +∞)`, `(-∞; ${a})`],
                    explanation: `Нерівність |x| > a означає, що відстань від точки x до нуля більша за ${a}. Це відповідає об'єднанню проміжків: (-∞; -${a}) ∪ (${a}; +∞).`
                };
            },
            // 15. Проста квадратна нерівність (x^2 < a^2)
            () => {
                const root = 2 + Math.floor(Math.random() * 7);
                const sq = root * root;
                return {
                    text: `Розв'яжіть квадратну нерівність: x² < ${sq}`,
                    diagram: drawIntervalSVG(-root, root, false, false),
                    correctVal: `(-${root}; ${root})`,
                    wrongs: [`(-∞; ${root})`, `[-${root}; ${root}]`, `(${root}; +∞)`],
                    explanation: `Перенесемо ${sq} ліворуч: (x - ${root})(x + ${root}) < 0. За методом інтервалів отримуємо відкритий проміжок (-${root}; ${root}).`
                };
            },
            // 16. Кількість цілих розв'язків у проміжку
            () => {
                const a = Math.floor(Math.random() * 4) + 1;
                const b = a + 4 + Math.floor(Math.random() * 4);
                const count = b - a - 1;
                return {
                    text: `Скільки цілих чисел містить відкритий проміжок (${a}; ${b})?`,
                    diagram: drawIntervalSVG(a, b, false, false),
                    correctVal: `${count}`,
                    wrongs: [`${count + 1}`, `${count + 2}`, `${count - 1}`],
                    explanation: `Числа ${a} і ${b} не входять у відкритий проміжок. Цілі числа всередині: від ${a + 1} до ${b - 1}. Їх кількість дорівнює ${b} - ${a} - 1 = ${count}.`
                };
            },
            // 17. Нерівність зі змінною в обох частинах
            () => {
                const a = 5;
                const b = 2;
                const diff = a - b; // 3
                const constVal = 9;
                const res = 3;
                return {
                    text: `Розв'яжіть нерівність: ${a}x - 4 > ${b}x + ${constVal - 4}`,
                    diagram: drawRaySVG(res, false, true),
                    correctVal: `x > ${res}`,
                    wrongs: [`x < ${res}`, `x > ${res + 2}`, `x < 1`],
                    explanation: `Перенесемо доданки зі змінною вліво, а числа вправо: ${a}x - ${b}x > ${constVal} ⇒ ${diff}x > ${constVal} ⇒ x > ${res}.`
                };
            },
            // 18. Властивості нерівностей (множення на від'ємне число)
            () => {
                return {
                    text: `Якщо a > b і c < 0, то яка з наведених нерівностей є правильною?`,
                    diagram: '',
                    correctVal: `ac < bc`,
                    wrongs: [`ac > bc`, `ac = bc`, `a + c < b + c`],
                    explanation: `При множенні обох частин правильної нерівності на від'ємне число знак нерівності змінюється на протилежний: ac < bc.`
                };
            },
            // 19. Об'єднання проміжків
            () => {
                const a = Math.floor(Math.random() * 4) - 2;
                const b = a + 5;
                return {
                    text: `Який проміжок є об'єднанням проміжків (-∞; ${a}] і [${a}; ${b}]?`,
                    diagram: '',
                    correctVal: `(-∞; ${b}]`,
                    wrongs: [`(-∞; ${a}]`, `[${a}; ${b}]`, `(-∞; +∞)`],
                    explanation: `Оскільки точка ${a} належить обом проміжкам, то їхнє об'єднання повністю покриває весь проміжок від -∞ до ${b} включно.`
                };
            },
            // 20. Квадратна нерівність x^2 >= a^2
            () => {
                const root = 3 + Math.floor(Math.random() * 6);
                const sq = root * root;
                return {
                    text: `Знайдіть розв'язок нерівності: x² ≥ ${sq}`,
                    diagram: '',
                    correctVal: `(-∞; -${root}] ∪ [${root}; +∞)`,
                    wrongs: [`[-${root}; ${root}]`, `(-∞; ${root}]`, `[${root}; +∞)`],
                    explanation: `x² ≥ ${sq} ⇒ (x - ${root})(x + ${root}) ≥ 0. За методом інтервалів розв'язком є об'єднання проміжків (-∞; -${root}] ∪ [${root}; +∞).`
                };
            }
        ];

        // --- СИСТЕМА ГЕНЕРАЦІЇ ТА УНІКАЛЬНОСТІ ---
        function generateUniqueQuestions(count) {
            const currentTestTexts = new Set();
            const resultList = [];
            
            const historyList = getSeenQuestions();
            const historySet = new Set(historyList);

            let attempts = 0;
            const maxAttempts = 10000;

            while (resultList.length < count && attempts < maxAttempts) {
                attempts++;
                const gen = algebraGenerators[Math.floor(Math.random() * algebraGenerators.length)];
                const qRaw = gen();

                if (!currentTestTexts.has(qRaw.text) && !historySet.has(qRaw.text)) {
                    currentTestTexts.add(qRaw.text);

                    let allOptions = [qRaw.correctVal, ...qRaw.wrongs.slice(0, 3)];
                    allOptions.sort(() => Math.random() - 0.5);
                    const correctIdx = allOptions.indexOf(qRaw.correctVal);

                    resultList.push({
                        text: qRaw.text,
                        diagram: qRaw.diagram,
                        options: allOptions,
                        correct: correctIdx,
                        explanation: qRaw.explanation
                    });
                }
            }

            attempts = 0;
            while (resultList.length < count && attempts < maxAttempts) {
                attempts++;
                const gen = algebraGenerators[Math.floor(Math.random() * algebraGenerators.length)];
                const qRaw = gen();

                if (!currentTestTexts.has(qRaw.text)) {
                    currentTestTexts.add(qRaw.text);

                    let allOptions = [qRaw.correctVal, ...qRaw.wrongs.slice(0, 3)];
                    allOptions.sort(() => Math.random() - 0.5);
                    const correctIdx = allOptions.indexOf(qRaw.correctVal);

                    resultList.push({
                        text: qRaw.text,
                        diagram: qRaw.diagram,
                        options: allOptions,
                        correct: correctIdx,
                        explanation: qRaw.explanation
                    });
                }
            }

            const updatedHistory = Array.from(new Set([...historyList, ...Array.from(currentTestTexts)]));
            if (updatedHistory.length > 500) {
                saveSeenQuestions(updatedHistory.slice(-200));
            } else {
                saveSeenQuestions(updatedHistory);
            }

            return resultList;
        }

        function startTest(count) {
            totalQuestionsCount = count;
            currentQuestionIndex = 0;
            userAnswers = new Array(count).fill(null);
            questionsData = generateUniqueQuestions(count);

            showScreen('screen-quiz');
            loadQuestion(0);
        }

        function loadQuestion(index) {
            const q = questionsData[index];

            document.getElementById('quiz-progress').innerText = `Завдання ${index + 1} з ${totalQuestionsCount}`;
            document.getElementById('question-text').innerText = q.text;

            const diagContainer = document.getElementById('diagram-container');
            if (q.diagram) {
                diagContainer.style.display = 'flex';
                diagContainer.innerHTML = q.diagram;
            } else {
                diagContainer.style.display = 'none';
            }

            const optionsGrid = document.getElementById('options-grid');
            optionsGrid.innerHTML = '';

            const explanationBox = document.getElementById('explanation-box');
            explanationBox.classList.remove('active');

            const savedAnswer = userAnswers[index];

            q.options.forEach((optText, optIdx) => {
                const btn = document.createElement('button');
                btn.className = 'btn-option';
                btn.innerText = optText;

                if (savedAnswer !== null) {
                    btn.disabled = true;
                    if (optIdx === q.correct) {
                        btn.classList.add('correct');
                    }
                    if (savedAnswer === optIdx && savedAnswer !== q.correct) {
                        btn.classList.add('incorrect');
                    }
                } else {
                    btn.onclick = () => handleAnswer(optIdx);
                }

                optionsGrid.appendChild(btn);
            });

            if (savedAnswer !== null && savedAnswer !== q.correct) {
                document.getElementById('explanation-text').innerText = q.explanation;
                explanationBox.classList.add('active');
            }
        }

        function handleAnswer(selectedIndex) {
            userAnswers[currentQuestionIndex] = selectedIndex;
            const q = questionsData[currentQuestionIndex];
            const optionsGrid = document.getElementById('options-grid');
            const buttons = optionsGrid.querySelectorAll('.btn-option');

            buttons.forEach(b => b.disabled = true);

            if (selectedIndex === q.correct) {
                buttons[selectedIndex].classList.add('correct');
            } else {
                buttons[selectedIndex].classList.add('incorrect');
                buttons[q.correct].classList.add('correct');

                document.getElementById('explanation-text').innerText = q.explanation;
                document.getElementById('explanation-box').classList.add('active');
            }
        }

        function nextQuestion() {
            if (currentQuestionIndex < totalQuestionsCount - 1) {
                currentQuestionIndex++;
                loadQuestion(currentQuestionIndex);
            } else {
                finishTest();
            }
        }

        function finishTest() {
            showScreen('screen-results');
            const resultsList = document.getElementById('results-list');
            resultsList.innerHTML = '';

            questionsData.forEach((q, idx) => {
                const ans = userAnswers[idx];
                const card = document.createElement('div');
                
                let statusClass = 'is-skipped';
                let badgeHTML = '<span class="status-badge badge-skipped">Пропущено</span>';

                if (ans !== null) {
                    if (ans === q.correct) {
                        statusClass = 'is-correct';
                        badgeHTML = '<span class="status-badge badge-correct">Правильно</span>';
                    } else {
                        statusClass = 'is-incorrect';
                        badgeHTML = '<span class="status-badge badge-incorrect">Неправильно</span>';
                    }
                }

                card.className = `result-item-card ${statusClass}`;
                card.innerHTML = `
                    ${badgeHTML}
                    <div style="font-weight: 800; font-size: 1.1rem; margin-bottom: 8px;">№${idx + 1}. ${q.text}</div>
                    <div style="font-size: 0.95rem; margin-bottom: 6px;">
                        Ваша відповідь: <strong style="color: ${ans === q.correct ? '#00ff66' : '#ff0055'}">${ans !== null ? q.options[ans] : 'Не вибрано'}</strong>
                    </div>
                    <div style="font-size: 0.95rem; margin-bottom: 10px;">
                        Правильна відповідь: <strong style="color: #00ff66">${q.options[q.correct]}</strong>
                    </div>
                    <div style="background: rgba(0,0,0,0.3); padding: 12px; border-radius: 10px; font-size: 0.9rem; line-height: 1.4;">
                        <strong style="color: #00f3ff;">Пояснення:</strong> ${q.explanation}
                    </div>
                `;
                resultsList.appendChild(card);
            });
        }

        function resetToHome() {
            renderBackground(algebraIcons);
            showScreen('screen-subject');
        }
    </script>

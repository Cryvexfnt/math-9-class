<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Математика 9 Клас</title>
    <!-- Шрифт Montserrat -->
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;800;900&display=swap" rel="stylesheet">
    <!-- Иконки Lucide -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Montserrat', sans-serif;
        }

        body {
            min-height: 100vh;
            width: 100vw;
            background: radial-gradient(circle at center, #180830 0%, #070414 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            position: relative;
            color: #ffffff;
        }

        /* --- ФОН С ФИКСИРОВАННЫМИ ПОЗИЦИЯМИ (БЕЗ ДЁРГАНИЙ) --- */
        .background-objects {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            pointer-events: none;
            z-index: 1;
            overflow: hidden;
        }

        .bg-item {
            position: absolute;
            user-select: none;
            transform: translate(-50%, -50%);
            animation: float 6s infinite alternate ease-in-out;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* Неоновые иконки */
        .neon-icon {
            width: 44px;
            height: 44px;
            stroke-width: 2.2px;
            opacity: 0.55;
        }

        .neon-cyan {
            stroke: #00f3ff;
            color: #00f3ff;
            filter: drop-shadow(0 0 2px #ffffff) drop-shadow(0 0 6px #00f3ff) drop-shadow(0 0 14px #00f3ff);
        }

        .neon-purple {
            stroke: #bf00ff;
            color: #bf00ff;
            filter: drop-shadow(0 0 2px #ffffff) drop-shadow(0 0 6px #bf00ff) drop-shadow(0 0 14px #bf00ff);
        }

        .neon-pink {
            stroke: #ff007f;
            color: #ff007f;
            filter: drop-shadow(0 0 2px #ffffff) drop-shadow(0 0 6px #ff007f) drop-shadow(0 0 14px #ff007f);
        }

        /* Разная скорость парения */
        .d-1 { animation-duration: 5.2s; animation-delay: 0s; }
        .d-2 { animation-duration: 6.8s; animation-delay: 1.2s; }
        .d-3 { animation-duration: 5.8s; animation-delay: 2.1s; }
        .d-4 { animation-duration: 7.4s; animation-delay: 0.6s; }

        @keyframes float {
            0% {
                transform: translate(-50%, -50%) translateY(0px) rotate(var(--rot, 0deg)) scale(1);
            }
            100% {
                transform: translate(-50%, -50%) translateY(-16px) rotate(calc(var(--rot, 0deg) + 10deg)) scale(1.06);
            }
        }

        /* --- ЦЕНТРАЛЬНЫЙ БЛОК МЕНЮ --- */
        .main-container {
            position: relative;
            z-index: 2;
            text-align: center;
            width: 100%;
            max-width: 900px;
            padding: 20px;
        }

        .title {
            font-size: 3.2rem;
            font-weight: 900;
            margin-bottom: 50px;
            color: #ffffff;
            text-transform: uppercase;
            letter-spacing: 2px;
            text-shadow: 0 0 10px #bf00ff, 0 0 20px #bf00ff, 0 0 40px #00f3ff;
        }

        .buttons-wrapper {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 30px;
            flex-wrap: wrap;
        }

        .btn-subject {
            background: rgba(15, 8, 35, 0.85);
            border: 3px solid;
            border-radius: 20px;
            padding: 18px 35px;
            font-size: 1.8rem;
            font-weight: 800;
            color: #ffffff;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 15px;
            backdrop-filter: blur(10px);
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            outline: none;
            user-select: none;
        }

        .btn-geometry {
            border-color: #00f3ff;
            box-shadow: 0 0 15px rgba(0, 243, 255, 0.4), inset 0 0 15px rgba(0, 243, 255, 0.2);
        }

        .btn-algebra {
            border-color: #bf00ff;
            box-shadow: 0 0 15px rgba(191, 0, 255, 0.4), inset 0 0 15px rgba(191, 0, 255, 0.2);
        }

        .btn-geometry:hover {
            transform: scale(1.08);
            box-shadow: 0 0 30px rgba(0, 243, 255, 0.9), inset 0 0 20px rgba(0, 243, 255, 0.5);
            background: rgba(0, 243, 255, 0.2);
        }

        .btn-algebra:hover {
            transform: scale(1.08);
            box-shadow: 0 0 30px rgba(191, 0, 255, 0.9), inset 0 0 20px rgba(191, 0, 255, 0.5);
            background: rgba(191, 0, 255, 0.2);
        }

        .btn-subject:active {
            transform: scale(0.98);
        }

        .btn-icon-normal {
            font-size: 2rem;
            line-height: 1;
            filter: none !important;
        }

        .math-symbol {
            font-family: serif;
            font-style: italic;
            font-weight: bold;
            font-size: 1.8rem;
            filter: none !important;
        }

        @media (max-width: 650px) {
            .title { font-size: 2.2rem; }
            .buttons-wrapper { flex-direction: column; }
            .btn-subject { width: 100%; font-size: 1.4rem; }
        }
    </style>
</head>
<body>

    <!-- Зафиксированные позиции стикеров по всему экрану без наложений и прыжков -->
    <div class="background-objects">
        <!-- Строка 1 -->
        <div class="bg-item d-1" style="left: 7%; top: 10%; --rot: -25deg;"><i data-lucide="ruler" class="neon-icon neon-cyan"></i></div>
        <div class="bg-item d-2" style="left: 22%; top: 14%; --rot: 18deg;"><i data-lucide="pencil" class="neon-icon neon-purple"></i></div>
        <div class="bg-item d-3" style="left: 38%; top: 8%; --rot: -12deg;"><i data-lucide="eraser" class="neon-icon neon-pink"></i></div>
        <div class="bg-item d-4" style="left: 54%; top: 12%; --rot: 30deg;"><i data-lucide="book-open" class="neon-icon neon-cyan"></i></div>
        <div class="bg-item d-1" style="left: 72%; top: 9%; --rot: -15deg;"><i data-lucide="calculator" class="neon-icon neon-purple"></i></div>
        <div class="bg-item d-2" style="left: 90%; top: 13%; --rot: 22deg;"><i data-lucide="backpack" class="neon-icon neon-pink"></i></div>

        <!-- Строка 2 -->
        <div class="bg-item d-3" style="left: 12%; top: 32%; --rot: 35deg;"><i data-lucide="scissors" class="neon-icon neon-pink"></i></div>
        <div class="bg-item d-4" style="left: 28%; top: 35%; --rot: -20deg;"><i data-lucide="ruler" class="neon-icon neon-cyan"></i></div>
        <div class="bg-item d-1" style="left: 45%; top: 28%; --rot: 15deg;"><i data-lucide="pencil" class="neon-icon neon-purple"></i></div>
        <div class="bg-item d-2" style="left: 62%; top: 33%; --rot: -30deg;"><i data-lucide="eraser" class="neon-icon neon-pink"></i></div>
        <div class="bg-item d-3" style="left: 82%; top: 30%; --rot: 10deg;"><i data-lucide="book-open" class="neon-icon neon-cyan"></i></div>

        <!-- Строка 3 -->
        <div class="bg-item d-4" style="left: 6%; top: 58%; --rot: -18deg;"><i data-lucide="calculator" class="neon-icon neon-purple"></i></div>
        <div class="bg-item d-1" style="left: 20%; top: 62%; --rot: 25deg;"><i data-lucide="backpack" class="neon-icon neon-pink"></i></div>
        <div class="bg-item d-2" style="left: 80%; top: 55%; --rot: -22deg;"><i data-lucide="scissors" class="neon-icon neon-purple"></i></div>
        <div class="bg-item d-3" style="left: 94%; top: 60%; --rot: 16deg;"><i data-lucide="ruler" class="neon-icon neon-cyan"></i></div>

        <!-- Строка 4 -->
        <div class="bg-item d-2" style="left: 10%; top: 85%; --rot: 20deg;"><i data-lucide="pencil" class="neon-icon neon-purple"></i></div>
        <div class="bg-item d-3" style="left: 26%; top: 88%; --rot: -28deg;"><i data-lucide="eraser" class="neon-icon neon-pink"></i></div>
        <div class="bg-item d-4" style="left: 42%; top: 82%; --rot: 14deg;"><i data-lucide="book-open" class="neon-icon neon-cyan"></i></div>
        <div class="bg-item d-1" style="left: 58%; top: 89%; --rot: -18deg;"><i data-lucide="calculator" class="neon-icon neon-purple"></i></div>
        <div class="bg-item d-2" style="left: 74%; top: 84%; --rot: 32deg;"><i data-lucide="backpack" class="neon-icon neon-pink"></i></div>
        <div class="bg-item d-3" style="left: 90%; top: 87%; --rot: -10deg;"><i data-lucide="scissors" class="neon-icon neon-cyan"></i></div>
    </div>

    <!-- Главное меню -->
    <div class="main-container">
        <h1 class="title">Оберіть предмет</h1>
        
        <div class="buttons-wrapper">
            <button class="btn-subject btn-geometry">
                <span class="btn-icon-normal">📐</span>
                <span>Геометрія</span>
                <span class="btn-icon-normal">✏️</span>
            </button>

            <button class="btn-subject btn-algebra">
                <span class="btn-icon-normal">✏️</span>
                <span>Алгебра</span>
                <span class="math-symbol">√x</span>
            </button>
        </div>
    </div>

    <script>
        lucide.createIcons();
    </script>

</body>
</html>

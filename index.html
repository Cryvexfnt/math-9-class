<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Інтерактивний Тренажер — Математика & Фізика</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700;800;900&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Montserrat', sans-serif;
        }

        body {
            min-height: 100vh;
            width: 100vw;
            background: radial-gradient(circle at center, #1b0933 0%, #070314 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            overflow-x: hidden;
            position: relative;
            color: #ffffff;
        }

        .background-objects {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            pointer-events: none;
            z-index: 1;
            overflow: hidden;
        }

        .bg-item {
            position: absolute;
            user-select: none;
            transform: translate(-50%, -50%);
            animation: float 6s infinite alternate ease-in-out;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .neon-icon {
            width: 44px;
            height: 44px;
            stroke-width: 2.2px;
            opacity: 0.55;
        }

        .neon-cyan {
            stroke: #00f3ff;
            color: #00f3ff;
            filter: drop-shadow(0 0 2px #ffffff) drop-shadow(0 0 6px #00f3ff) drop-shadow(0 0 14px #00f3ff);
        }

        .neon-purple {
            stroke: #bf00ff;
            color: #bf00ff;
            filter: drop-shadow(0 0 2px #ffffff) drop-shadow(0 0 6px #bf00ff) drop-shadow(0 0 14px #bf00ff);
        }

        .neon-pink {
            stroke: #ff007f;
            color: #ff007f;
            filter: drop-shadow(0 0 2px #ffffff) drop-shadow(0 0 6px #ff007f) drop-shadow(0 0 14px #ff007f);
        }

        .d-1 { animation-duration: 5.2s; animation-delay: 0s; }
        .d-2 { animation-duration: 6.8s; animation-delay: 1.2s; }
        .d-3 { animation-duration: 5.8s; animation-delay: 2.1s; }
        .d-4 { animation-duration: 7.4s; animation-delay: 0.6s; }

        @keyframes float {
            0% { transform: translate(-50%, -50%) translateY(0px) rotate(var(--rot, 0deg)) scale(1); }
            100% { transform: translate(-50%, -50%) translateY(-16px) rotate(calc(var(--rot, 0deg) + 10deg)) scale(1.06); }
        }

        .screen {
            display: none;
            position: relative;
            z-index: 2;
            width: 100%;
            max-width: 850px;
            padding: 20px;
            text-align: center;
        }

        .screen.active {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .title {
            font-size: 2.5rem;
            font-weight: 900;
            margin-bottom: 30px;
            color: #ffffff;
            text-transform: uppercase;
            letter-spacing: 2px;
            text-shadow: 0 0 10px #bf00ff, 0 0 20px #bf00ff, 0 0 40px #00f3ff;
        }

        .buttons-wrapper {
            display: flex;
            justify-content: center;
            width: 100%;
            max-width: 750px;
        }

        .subjects-row {
            display: flex;
            gap: 15px;
            width: 100%;
        }

        .btn-subject {
            flex: 1;
            background: rgba(15, 8, 35, 0.85);
            border: 3px solid;
            border-radius: 20px;
            padding: 18px 15px;
            font-size: 1.25rem;
            font-weight: 800;
            color: #ffffff;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            backdrop-filter: blur(10px);
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            outline: none;
            user-select: none;
        }

        .subject-icon {
            font-family: 'Times New Roman', Times, serif;
            font-style: italic;
            font-weight: bold;
            font-size: 1.6rem;
            line-height: 1;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            min-width: 45px;
        }

        .btn-algebra { border-color: #bf00ff; box-shadow: 0 0 15px rgba(191, 0, 255, 0.4); }
        .btn-geometry { border-color: #00f3ff; box-shadow: 0 0 15px rgba(0, 243, 255, 0.4); }
        .btn-physics { border-color: #ff007f; box-shadow: 0 0 15px rgba(255, 0, 127, 0.4); }

        .btn-algebra:hover { transform: scale(1.05); box-shadow: 0 0 30px rgba(191, 0, 255, 0.9); background: rgba(191, 0, 255, 0.2); }
        .btn-geometry:hover { transform: scale(1.05); box-shadow: 0 0 30px rgba(0, 243, 255, 0.9); background: rgba(0, 243, 255, 0.2); }
        .btn-physics:hover { transform: scale(1.05); box-shadow: 0 0 30px rgba(255, 0, 127, 0.9); background: rgba(255, 0, 127, 0.2); }

        .count-grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 15px;
            width: 100%;
            max-width: 650px;
        }

        .btn-count {
            background: rgba(20, 10, 45, 0.85);
            border: 2.5px solid #bf00ff;
            border-radius: 16px;
            padding: 15px 0;
            font-size: 1.5rem;
            font-weight: 800;
            color: #ffffff;
            cursor: pointer;
            backdrop-filter: blur(8px);
            box-shadow: 0 0 12px rgba(191, 0, 255, 0.3);
            transition: all 0.25s ease;
        }

        .btn-count:hover {
            transform: translateY(-4px) scale(1.05);
            box-shadow: 0 0 25px #bf00ff;
            background: rgba(191, 0, 255, 0.25);
        }

        .quiz-card {
            background: rgba(18, 9, 38, 0.9);
            border: 2px solid #00f3ff;
            box-shadow: 0 0 30px rgba(0, 243, 255, 0.3);
            border-radius: 24px;
            padding: 30px;
            width: 100%;
            backdrop-filter: blur(15px);
            text-align: left;
            position: relative;
        }

        .quiz-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            font-weight: 800;
            color: #00f3ff;
            font-size: 1.1rem;
            gap: 10px;
            flex-wrap: wrap;
        }

        .btn-finish-top {
            background: rgba(255, 0, 85, 0.15);
            border: 2px solid #ff0055;
            color: #ffffff;
            padding: 8px 16px;
            border-radius: 12px;
            font-size: 0.9rem;
            font-weight: 800;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 0 10px rgba(255, 0, 85, 0.2);
            outline: none;
        }

        .btn-finish-top:hover {
            background: rgba(255, 0, 85, 0.4);
            box-shadow: 0 0 20px #ff0055;
            transform: scale(1.05);
        }

        .question-text {
            font-size: 1.35rem;
            font-weight: 700;
            line-height: 1.5;
            margin-bottom: 20px;
            color: #ffffff;
        }

        .diagram-container {
            display: flex;
            justify-content: center;
            align-items: center;
            margin-bottom: 20px;
            background: rgba(0, 0, 0, 0.35);
            border-radius: 16px;
            padding: 15px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .options-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-bottom: 20px;
        }

        .btn-option {
            background: rgba(30, 15, 60, 0.7);
            border: 2px solid rgba(255, 255, 255, 0.2);
            border-radius: 14px;
            padding: 16px 20px;
            font-size: 1.1rem;
            font-weight: 700;
            color: #ffffff;
            cursor: pointer;
            text-align: left;
            transition: all 0.2s ease;
            outline: none;
        }

        .btn-option:hover:not(:disabled) {
            border-color: #00f3ff;
            background: rgba(0, 243, 255, 0.15);
            box-shadow: 0 0 12px rgba(0, 243, 255, 0.4);
        }

        .btn-option.correct {
            border-color: #00ff66 !important;
            background: rgba(0, 255, 102, 0.25) !important;
            box-shadow: 0 0 20px #00ff66 !important;
            color: #ffffff !important;
        }

        .btn-option.incorrect {
            border-color: #ff0055 !important;
            background: rgba(255, 0, 85, 0.25) !important;
            box-shadow: 0 0 20px #ff0055 !important;
            color: #ffffff !important;
        }

        .explanation-box {
            display: none;
            background: rgba(255, 0, 85, 0.1);
            border: 2px solid #ff0055;
            box-shadow: 0 0 15px rgba(255, 0, 85, 0.3);
            border-radius: 14px;
            padding: 18px;
            margin-top: 15px;
            margin-bottom: 20px;
            font-size: 1rem;
            line-height: 1.5;
            color: #ffe6ee;
        }

        .explanation-box.active {
            display: block;
        }

        .explanation-title {
            font-weight: 800;
            color: #ff0055;
            margin-bottom: 6px;
            text-transform: uppercase;
            font-size: 0.9rem;
            letter-spacing: 1px;
        }

        .quiz-footer {
            display: flex;
            justify-content: flex-end;
            margin-top: 15px;
            padding-top: 15px;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
        }

        .btn-next {
            background: rgba(15, 8, 35, 0.95);
            border: 2.5px solid #ffd700;
            box-shadow: 0 0 18px rgba(255, 215, 0, 0.5);
            color: #ffffff;
            padding: 12px 24px;
            border-radius: 16px;
            font-size: 1rem;
            font-weight: 800;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 10px;
            backdrop-filter: blur(10px);
            transition: all 0.25s ease;
        }

        .btn-next:hover {
            transform: scale(1.05);
            box-shadow: 0 0 25px #ffd700;
            background: rgba(255, 215, 0, 0.25);
        }

        .results-list {
            width: 100%;
            max-height: 60vh;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 15px;
            padding-right: 10px;
            margin-bottom: 25px;
        }

        .result-item-card {
            background: rgba(20, 10, 45, 0.85);
            border: 2px solid rgba(255, 255, 255, 0.15);
            border-radius: 16px;
            padding: 20px;
            text-align: left;
        }

        .result-item-card.is-correct { border-color: #00ff66; box-shadow: 0 0 10px rgba(0, 255, 102, 0.2); }
        .result-item-card.is-incorrect { border-color: #ff0055; box-shadow: 0 0 10px rgba(255, 0, 85, 0.2); }
        .result-item-card.is-skipped { border-color: #ffd700; box-shadow: 0 0 10px rgba(255, 215, 0, 0.2); }

        .status-badge {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 8px;
            font-weight: 800;
            font-size: 0.85rem;
            margin-bottom: 10px;
            text-transform: uppercase;
        }

        .badge-correct { background: rgba(0, 255, 102, 0.2); color: #00ff66; border: 1px solid #00ff66; }
        .badge-incorrect { background: rgba(255, 0, 85, 0.2); color: #ff0055; border: 1px solid #ff0055; }
        .badge-skipped { background: rgba(255, 215, 0, 0.2); color: #ffd700; border: 1px solid #ffd700; }

        .btn-restart {
            background: rgba(191, 0, 255, 0.2);
            border: 2.5px solid #bf00ff;
            box-shadow: 0 0 20px rgba(191, 0, 255, 0.5);
            color: #ffffff;
            padding: 15px 40px;
            border-radius: 18px;
            font-size: 1.3rem;
            font-weight: 800;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .btn-restart:hover {
            transform: scale(1.06);
            box-shadow: 0 0 35px #bf00ff;
            background: rgba(191, 0, 255, 0.4);
        }

        .toast {
            position: fixed;
            top: 30px;
            left: 50%;
            transform: translateX(-50%) translateY(-100px);
            background: rgba(20, 10, 40, 0.95);
            border: 2px solid #ff007f;
            box-shadow: 0 0 20px #ff007f;
            color: #fff;
            padding: 14px 28px;
            border-radius: 16px;
            font-weight: 800;
            font-size: 1.1rem;
            z-index: 1000;
            opacity: 0;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .toast.show {
            transform: translateX(-50%) translateY(0);
            opacity: 1;
        }

        .modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(5, 2, 15, 0.85);
            backdrop-filter: blur(8px);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }

        .modal-overlay.active {
            display: flex;
        }

        .modal-card {
            background: rgba(18, 9, 38, 0.95);
            border: 2.5px solid #ff007f;
            box-shadow: 0 0 30px rgba(255, 0, 127, 0.5);
            border-radius: 22px;
            padding: 30px;
            max-width: 420px;
            width: 90%;
            text-align: center;
        }

        .modal-title {
            font-size: 1.3rem;
            font-weight: 800;
            margin-bottom: 25px;
            color: #ffffff;
            line-height: 1.4;
        }

        .modal-buttons {
            display: flex;
            gap: 15px;
            justify-content: center;
        }

        .btn-modal {
            flex: 1;
            padding: 14px 20px;
            border-radius: 14px;
            font-size: 1.1rem;
            font-weight: 800;
            cursor: pointer;
            border: 2.5px solid;
            transition: all 0.25s ease;
            outline: none;
        }

        .btn-modal-yes {
            background: rgba(0, 255, 102, 0.2);
            border-color: #00ff66;
            color: #ffffff;
            box-shadow: 0 0 12px rgba(0, 255, 102, 0.3);
        }

        .btn-modal-yes:hover {
            background: rgba(0, 255, 102, 0.45);
            box-shadow: 0 0 25px #00ff66;
            transform: scale(1.05);
        }

        .btn-modal-no {
            background: rgba(255, 0, 85, 0.2);
            border-color: #ff0055;
            color: #ffffff;
            box-shadow: 0 0 12px rgba(255, 0, 85, 0.3);
        }

        .btn-modal-no:hover {
            background: rgba(255, 0, 85, 0.45);
            box-shadow: 0 0 25px #ff0055;
            transform: scale(1.05);
        }

        @media (max-width: 650px) {
            .title { font-size: 1.8rem; }
            .subjects-row { flex-direction: column; }
            .count-grid { grid-template-columns: repeat(2, 1fr); }
            .options-grid { grid-template-columns: 1fr; }
            .quiz-footer { justify-content: center; }
            .btn-next { width: 100%; justify-content: center; }
        }
    </style>
</head>
<body>

    <div class="toast" id="toast">Повідомлення</div>

    <div class="background-objects" id="bg-container"></div>

    <!-- 1. ВИБІР ПРЕДМЕТА -->
    <div class="screen active" id="screen-subject">
        <h1 class="title">Оберіть предмет</h1>
        <div class="buttons-wrapper">
            <div class="subjects-row">
                <button class="btn-subject btn-algebra" onclick="selectSubject('algebra')">
                    <span class="subject-icon">√x</span>
                    <span>Алгебра</span>
                </button>
                <button class="btn-subject btn-geometry" onclick="selectSubject('geometry')">
                    <span class="subject-icon">∠α</span>
                    <span>Геометрія</span>
                </button>
                <button class="btn-subject btn-physics" onclick="selectSubject('physics')">
                    <span class="subject-icon">E=mc²</span>
                    <span>Фізика</span>
                </button>
            </div>
        </div>
    </div>

    <!-- 2. ВИБІР КІЛЬКОСТІ ЗАВДАНЬ -->
    <div class="screen" id="screen-count">
        <h1 class="title">Кількість завдань</h1>
        <div class="count-grid">
            <button class="btn-count" onclick="startTest(5)">5</button>
            <button class="btn-count" onclick="startTest(10)">10</button>
            <button class="btn-count" onclick="startTest(15)">15</button>
            <button class="btn-count" onclick="startTest(20)">20</button>
            <button class="btn-count" onclick="startTest(25)">25</button>
            <button class="btn-count" onclick="startTest(30)">30</button>
            <button class="btn-count" onclick="startTest(35)">35</button>
            <button class="btn-count" onclick="startTest(40)">40</button>
            <button class="btn-count" onclick="startTest(45)">45</button>
            <button class="btn-count" onclick="startTest(50)">50</button>
        </div>
    </div>

    <!-- 3. ТЕСТУВАННЯ -->
    <div class="screen" id="screen-quiz">
        <div class="quiz-card">
            <div class="quiz-header">
                <span id="quiz-progress">Завдання 1 з 10</span>
                <span id="quiz-topic" style="color: #00f3ff;">Тема: ...</span>
                <button class="btn-finish-top" onclick="showConfirmModal()">Завершити тест</button>
            </div>
            
            <div class="question-text" id="question-text">Текст питання...</div>
            
            <div class="diagram-container" id="diagram-container"></div>

            <div class="options-grid" id="options-grid"></div>

            <div class="explanation-box" id="explanation-box">
                <div class="explanation-title">Пояснення:</div>
                <div id="explanation-text">...</div>
            </div>

            <div class="quiz-footer">
                <button class="btn-next" id="btn-next" onclick="skipQuestion()">
                    <span>Пропустити завдання</span>
                    <span>➔</span>
                </button>
            </div>
        </div>
    </div>

    <!-- 4. ФІНІШ -->
    <div class="screen" id="screen-results">
        <h1 class="title">Результати тесту</h1>
        <div class="results-list" id="results-list"></div>
        <button class="btn-restart" onclick="resetToHome()">На головну</button>
    </div>

    <!-- МОДАЛЬНЕ ВІКНО ПІДТВЕРДЖЕННЯ -->
    <div class="modal-overlay" id="confirm-modal">
        <div class="modal-card">
            <div class="modal-title">Ви впевнені, що хочете завершити тест?</div>
            <div class="modal-buttons">
                <button class="btn-modal btn-modal-yes" onclick="confirmFinishTest()">Так</button>
                <button class="btn-modal btn-modal-no" onclick="closeConfirmModal()">Ні</button>
            </div>
        </div>
    </div>

    <script>
        const algebraIcons = ['calculator', 'percent', 'hash', 'binary', 'bar-chart-2', 'trending-up', 'sparkles'];
        const geometryIcons = ['triangle', 'square', 'circle', 'box', 'compass', 'ruler', 'layers'];
        const physicsIcons = ['zap', 'atom', 'battery-charging', 'gauge', 'magnet', 'flame', 'lightbulb'];

        function renderBackground(iconsList) {
            const bgContainer = document.getElementById('bg-container');
            bgContainer.innerHTML = '';
            
            const colorClasses = ['neon-cyan', 'neon-purple', 'neon-pink'];
            const coords = [
                {x: 7, y: 10, r: -25}, {x: 22, y: 14, r: 18}, {x: 38, y: 8, r: -12}, {x: 54, y: 12, r: 30}, {x: 72, y: 9, r: -15}, {x: 90, y: 13, r: 22},
                {x: 12, y: 32, r: 35}, {x: 28, y: 35, r: -20}, {x: 45, y: 28, r: 15}, {x: 62, y: 33, r: -30}, {x: 82, y: 30, r: 10},
                {x: 6, y: 58, r: -18}, {x: 20, y: 62, r: 25}, {x: 80, y: 55, r: -22}, {x: 94, y: 60, r: 16},
                {x: 10, y: 85, r: 20}, {x: 26, y: 88, r: -28}, {x: 42, y: 82, r: 14}, {x: 58, y: 89, r: -18}, {x: 74, y: 84, r: 32}, {x: 90, y: 87, r: -10}
            ];

            coords.forEach((pt, idx) => {
                const item = document.createElement('div');
                item.className = `bg-item d-${(idx % 4) + 1}`;
                item.style.left = `${pt.x}%`;
                item.style.top = `${pt.y}%`;
                item.style.setProperty('--rot', `${pt.r}deg`);

                const icon = iconsList[idx % iconsList.length];
                const color = colorClasses[idx % colorClasses.length];

                item.innerHTML = `<i data-lucide="${icon}" class="neon-icon ${color}"></i>`;
                bgContainer.appendChild(item);
            });

            lucide.createIcons();
        }

        renderBackground(algebraIcons);

        function showToast(msg) {
            const toast = document.getElementById('toast');
            toast.innerText = msg;
            toast.classList.add('show');
            setTimeout(() => toast.classList.remove('show'), 3000);
        }

        let currentSubject = 'algebra';
        let totalQuestionsCount = 10;
        let currentQuestionIndex = 0;
        let questionsData = [];
        let userAnswers = [];
        let autoNextTimer = null;

        function selectSubject(subject) {
            currentSubject = subject;
            if (subject === 'algebra') {
                renderBackground(algebraIcons);
            } else if (subject === 'geometry') {
                renderBackground(geometryIcons);
            } else if (subject === 'physics') {
                renderBackground(physicsIcons);
            }

            showScreen('screen-count');
        }

        function showScreen(screenId) {
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            document.getElementById(screenId).classList.add('active');
        }

        function showConfirmModal() {
            document.getElementById('confirm-modal').classList.add('active');
        }

        function closeConfirmModal() {
            document.getElementById('confirm-modal').classList.remove('active');
        }

        function confirmFinishTest() {
            clearTimeout(autoNextTimer);
            closeConfirmModal();
            finishTest();
        }

        function drawRaySVG(val, isClosed, directionRight) {
            const circleFill = isClosed ? "#00f3ff" : "#070414";
            const lineStartX = directionRight ? 130 : 25;
            const lineEndX = directionRight ? 255 : 130;

            return `<svg width="290" height="90" viewBox="0 0 290 90">
                <line x1="15" y1="50" x2="265" y2="50" stroke="#bf00ff" stroke-width="3"/>
                <polygon points="265,45 278,50 265,55" fill="#bf00ff"/>
                <text x="270" y="70" fill="#bf00ff" font-weight="800" font-size="14">x</text>
                <line x1="${lineStartX}" y1="50" x2="${lineEndX}" y2="50" stroke="#00f3ff" stroke-width="7" opacity="0.85"/>
                <circle cx="130" cy="50" r="7" fill="${circleFill}" stroke="#00f3ff" stroke-width="3"/>
                <text x="124" y="75" fill="#00f3ff" font-weight="800" font-size="15">${val}</text>
            </svg>`;
        }

        function drawIntervalSVG(valA, valB, isClosedA, isClosedB) {
            const fillA = isClosedA ? "#00f3ff" : "#070414";
            const fillB = isClosedB ? "#00f3ff" : "#070414";

            },
            () => {
                return {
                    text: "Одиницею вимірювання електрохімічного еквівалента в СІ є:",
                    diagram: '',
                    correctVal: "кг/Кл",
                    wrongs: ["Кл/кг", "Дж/Кл", "В·с"],
                    explanation: `З формули k = m / q слідує, що одиницею k є маса поділена на заряд: кг/Кл (або мг/Кл).`
                };
            }
        ];

        // --- ГЕНЕРАЦІЯ УНІКАЛЬНИХ ПИТАНЬ ---
        function generateUniqueQuestions(subject, count) {
            const currentTestTexts = new Set();
            const resultList = [];
            
            const storageKey = subject === 'algebra' ? 'algebra_seen' : (subject === 'geometry' ? 'geometry_seen' : 'physics_seen');
            const historyList = getSeenQuestions(storageKey);
            const historySet = new Set(historyList);

            const pool = subject === 'algebra' ? algebraGenerators : (subject === 'geometry' ? geometryGenerators : physicsGenerators);

            let attempts = 0;
            const maxAttempts = 5000;

            while (resultList.length < count && attempts < maxAttempts) {
                attempts++;
                const gen = pool[Math.floor(Math.random() * pool.length)];
                const qRaw = gen();

                if (!currentTestTexts.has(qRaw.text) && !historySet.has(qRaw.text)) {
                    currentTestTexts.add(qRaw.text);

                    let allOptions = [qRaw.correctVal, ...qRaw.wrongs.slice(0, 3)];
                    allOptions.sort(() => Math.random() - 0.5);
                    const correctIdx = allOptions.indexOf(qRaw.correctVal);

                    resultList.push({
                        text: qRaw.text,
                        diagram: qRaw.diagram,
                        options: allOptions,
                        correct: correctIdx,
                        explanation: qRaw.explanation
                    });
                }
            }

            attempts = 0;
            while (resultList.length < count && attempts < maxAttempts) {
                attempts++;
                const gen = pool[Math.floor(Math.random() * pool.length)];
                const qRaw = gen();

                if (!currentTestTexts.has(qRaw.text)) {
                    currentTestTexts.add(qRaw.text);

                    let allOptions = [qRaw.correctVal, ...qRaw.wrongs.slice(0, 3)];
                    allOptions.sort(() => Math.random() - 0.5);
                    const correctIdx = allOptions.indexOf(qRaw.correctVal);

                    resultList.push({
                        text: qRaw.text,
                        diagram: qRaw.diagram,
                        options: allOptions,
                        correct: correctIdx,
                        explanation: qRaw.explanation
                    });
                }
            }

            const updatedHistory = Array.from(new Set([...historyList, ...Array.from(currentTestTexts)]));
            saveSeenQuestions(storageKey, updatedHistory.length > 300 ? updatedHistory.slice(-150) : updatedHistory);

            return resultList;
        }

        function startTest(count) {
            totalQuestionsCount = count;
            currentQuestionIndex = 0;
            userAnswers = new Array(count).fill(null);
            questionsData = generateUniqueQuestions(currentSubject, count);

            showScreen('screen-quiz');
            loadQuestion(0);
        }

        function loadQuestion(index) {
            clearTimeout(autoNextTimer);

            const q = questionsData[index];

            document.getElementById('quiz-progress').innerText = `Завдання ${index + 1} з ${totalQuestionsCount}`;
            
            const topicElem = document.getElementById('quiz-topic');
            if (currentSubject === 'algebra') {
                topicElem.innerText = 'Тема: Нерівності';
                topicElem.style.color = '#bf00ff';
            } else if (currentSubject === 'geometry') {
                topicElem.innerText = 'Тема: Повторення';
                topicElem.style.color = '#00f3ff';
            } else if (currentSubject === 'physics') {
                topicElem.innerText = 'Тема: Електроліз';
                topicElem.style.color = '#ff007f';
            }

            document.getElementById('question-text').innerText = q.text;

            const diagContainer = document.getElementById('diagram-container');
            if (q.diagram) {
                diagContainer.style.display = 'flex';
                diagContainer.innerHTML = q.diagram;
            } else {
                diagContainer.style.display = 'none';
            }

            const optionsGrid = document.getElementById('options-grid');
            optionsGrid.innerHTML = '';

            const explanationBox = document.getElementById('explanation-box');
            explanationBox.classList.remove('active');

            const savedAnswer = userAnswers[index];

            q.options.forEach((optText, optIdx) => {
                const btn = document.createElement('button');
                btn.className = 'btn-option';
                btn.innerText = optText;

                if (savedAnswer !== null) {
                    btn.disabled = true;
                    if (optIdx === q.correct) {
                        btn.classList.add('correct');
                    }
                    if (savedAnswer === optIdx && savedAnswer !== q.correct) {
                        btn.classList.add('incorrect');
                    }
                } else {
                    btn.onclick = () => handleAnswer(optIdx);
                }

                optionsGrid.appendChild(btn);
            });

            if (savedAnswer !== null && savedAnswer !== q.correct) {
                document.getElementById('explanation-text').innerText = q.explanation;
                explanationBox.classList.add('active');
            }
        }

        function handleAnswer(selectedIndex) {
            if (userAnswers[currentQuestionIndex] !== null) return;

            userAnswers[currentQuestionIndex] = selectedIndex;
            const q = questionsData[currentQuestionIndex];
            const optionsGrid = document.getElementById('options-grid');
            const buttons = optionsGrid.querySelectorAll('.btn-option');

            buttons.forEach(b => b.disabled = true);

            if (selectedIndex === q.correct) {
                buttons[selectedIndex].classList.add('correct');
            } else {
                buttons[selectedIndex].classList.add('incorrect');
                buttons[q.correct].classList.add('correct');

                document.getElementById('explanation-text').innerText = q.explanation;
                document.getElementById('explanation-box').classList.add('active');
            }

            // Автоматичний перехід через 3 секунди
            clearTimeout(autoNextTimer);
            autoNextTimer = setTimeout(() => {
                nextQuestion();
            }, 3000);
        }

        function skipQuestion() {
            clearTimeout(autoNextTimer);
            nextQuestion();
        }

        function nextQuestion() {
            clearTimeout(autoNextTimer);
            if (currentQuestionIndex < totalQuestionsCount - 1) {
                currentQuestionIndex++;
                loadQuestion(currentQuestionIndex);
            } else {
                finishTest();
            }
        }

        function finishTest() {
            clearTimeout(autoNextTimer);
            showScreen('screen-results');
            const resultsList = document.getElementById('results-list');
            resultsList.innerHTML = '';

            questionsData.forEach((q, idx) => {
                const ans = userAnswers[idx];
                const card = document.createElement('div');
                
                let statusClass = 'is-skipped';
                let badgeHTML = '<span class="status-badge badge-skipped">Пропущено</span>';

                if (ans !== null) {
                    if (ans === q.correct) {
                        statusClass = 'is-correct';
                        badgeHTML = '<span class="status-badge badge-correct">Правильно</span>';
                    } else {
                        statusClass = 'is-incorrect';
                        badgeHTML = '<span class="status-badge badge-incorrect">Неправильно</span>';
                    }
                }

                card.className = `result-item-card ${statusClass}`;
                card.innerHTML = `
                    ${badgeHTML}
                    <div style="font-weight: 800; font-size: 1.1rem; margin-bottom: 8px;">№${idx + 1}. ${q.text}</div>
                    <div style="font-size: 0.95rem; margin-bottom: 6px;">
                        Ваша відповідь: <strong style="color: ${ans === null ? '#ffd700' : (ans === q.correct ? '#00ff66' : '#ff0055')}">${ans !== null ? q.options[ans] : 'Пропущено'}</strong>
                    </div>
                    <div style="font-size: 0.95rem; margin-bottom: 10px;">
                        Правильна відповідь: <strong style="color: #00ff66">${q.options[q.correct]}</strong>
                    </div>
                    <div style="background: rgba(0,0,0,0.3); padding: 12px; border-radius: 10px; font-size: 0.9rem; line-height: 1.4;">
                        <strong style="color: #00f3ff;">Пояснення:</strong> ${q.explanation}
                    </div>
                `;
                resultsList.appendChild(card);
            });
        }

        function resetToHome() {
            clearTimeout(autoNextTimer);
            renderBackground(algebraIcons);
            showScreen('screen-subject');
        }
    </script>

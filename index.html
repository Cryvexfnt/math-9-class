<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Інтерактивний Тренажер — Математика & Фізика НУШ</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700;800;900&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Montserrat', sans-serif;
        }

        body {
            min-height: 100vh;
            width: 100vw;
            background: radial-gradient(circle at center, #1b0933 0%, #070314 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            overflow-x: hidden;
            position: relative;
            color: #ffffff;
        }

        .background-objects {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            pointer-events: none;
            z-index: 1;
            overflow: hidden;
        }

        .bg-item {
            position: absolute;
            user-select: none;
            transform: translate(-50%, -50%) rotate(var(--rot, 0deg));
            animation: float 6s infinite alternate ease-in-out;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .neon-icon {
            width: 44px;
            height: 44px;
            stroke-width: 2.2px;
            opacity: 0.45;
        }

        .neon-cyan {
            stroke: #00f3ff;
            color: #00f3ff;
            filter: drop-shadow(0 0 2px #ffffff) drop-shadow(0 0 6px #00f3ff);
        }

        .neon-purple {
            stroke: #bf00ff;
            color: #bf00ff;
            filter: drop-shadow(0 0 2px #ffffff) drop-shadow(0 0 6px #bf00ff);
        }

        .neon-pink {
            stroke: #ff007f;
            color: #ff007f;
            filter: drop-shadow(0 0 2px #ffffff) drop-shadow(0 0 6px #ff007f);
        }

        .d-1 { animation-duration: 5.2s; animation-delay: 0s; }
        .d-2 { animation-duration: 6.8s; animation-delay: 1.2s; }
        .d-3 { animation-duration: 5.8s; animation-delay: 2.1s; }
        .d-4 { animation-duration: 7.4s; animation-delay: 0.6s; }

        @keyframes float {
            0% { transform: translate(-50%, -50%) translateY(0px) rotate(var(--rot, 0deg)) scale(1); }
            100% { transform: translate(-50%, -50%) translateY(-16px) rotate(calc(var(--rot, 0deg) + 10deg)) scale(1.05); }
        }

        @keyframes screenIn {
            0% { opacity: 0; transform: translateY(20px) scale(0.97); }
            100% { opacity: 1; transform: translateY(0) scale(1); }
        }

        .screen {
            display: none;
            position: relative;
            z-index: 2;
            width: 100%;
            max-width: 1000px;
            padding: 20px;
            text-align: center;
        }

        .screen.active {
            display: flex;
            flex-direction: column;
            align-items: center;
            animation: screenIn 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        .title {
            font-size: 2.3rem;
            font-weight: 900;
            margin-bottom: 25px;
            color: #ffffff;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            text-shadow: 0 0 10px #bf00ff, 0 0 25px #00f3ff;
        }

        .buttons-wrapper {
            display: flex;
            justify-content: center;
            width: 100%;
            max-width: 800px;
        }

        .subjects-row {
            display: flex;
            gap: 15px;
            width: 100%;
        }

        .btn-subject {
            flex: 1;
            background: rgba(15, 8, 35, 0.85);
            border: 3px solid;
            border-radius: 20px;
            padding: 20px 15px;
            font-size: 1.15rem;
            font-weight: 800;
            color: #ffffff;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 12px;
            backdrop-filter: blur(10px);
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            outline: none;
        }

        .subject-icon {
            font-family: 'Times New Roman', Times, serif;
            font-style: italic;
            font-weight: bold;
            font-size: 1.8rem;
            line-height: 1;
        }

        .btn-algebra { border-color: #bf00ff; box-shadow: 0 0 15px rgba(191, 0, 255, 0.3); }
        .btn-geometry { border-color: #00f3ff; box-shadow: 0 0 15px rgba(0, 243, 255, 0.3); }
        .btn-physics { border-color: #ff007f; box-shadow: 0 0 15px rgba(255, 0, 127, 0.3); }

        .btn-algebra:hover { transform: translateY(-5px) scale(1.03); box-shadow: 0 0 30px rgba(191, 0, 255, 0.8); background: rgba(191, 0, 255, 0.2); }
        .btn-geometry:hover { transform: translateY(-5px) scale(1.03); box-shadow: 0 0 30px rgba(0, 243, 255, 0.8); background: rgba(0, 243, 255, 0.2); }
        .btn-physics:hover { transform: translateY(-5px) scale(1.03); box-shadow: 0 0 30px rgba(255, 0, 127, 0.8); background: rgba(255, 0, 127, 0.2); }

        .subject-desc {
            font-size: 0.8rem;
            font-weight: 600;
            opacity: 0.75;
        }

        .count-grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 15px;
            width: 100%;
            max-width: 650px;
        }

        .btn-count {
            background: rgba(20, 10, 45, 0.85);
            border: 2.5px solid #bf00ff;
            border-radius: 16px;
            padding: 15px 0;
            font-size: 1.4rem;
            font-weight: 800;
            color: #ffffff;
            cursor: pointer;
            backdrop-filter: blur(8px);
            box-shadow: 0 0 12px rgba(191, 0, 255, 0.3);
            transition: all 0.25s ease;
        }

        .btn-count:hover {
            transform: translateY(-4px) scale(1.05);
            box-shadow: 0 0 25px #bf00ff;
            background: rgba(191, 0, 255, 0.25);
        }

        .btn-back {
            margin-top: 25px;
            background: rgba(255, 255, 255, 0.05);
            border: 2px solid rgba(255, 255, 255, 0.25);
            color: #ffffff;
            padding: 12px 28px;
            border-radius: 16px;
            font-size: 0.95rem;
            font-weight: 700;
            cursor: pointer;
            backdrop-filter: blur(8px);
            transition: all 0.25s ease;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        .btn-back:hover {
            border-color: #00f3ff;
            box-shadow: 0 0 18px rgba(0, 243, 255, 0.4);
            background: rgba(0, 243, 255, 0.15);
        }

        .quiz-card {
            background: rgba(18, 9, 38, 0.9);
            border: 2.5px solid #00f3ff;
            box-shadow: 0 0 35px rgba(0, 243, 255, 0.3);
            border-radius: 26px;
            padding: 30px 35px;
            width: 100%;
            backdrop-filter: blur(15px);
            text-align: left;
        }

        .quiz-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            font-weight: 800;
            color: #00f3ff;
            font-size: 1.1rem;
            gap: 15px;
            flex-wrap: wrap;
        }

        .btn-finish-top {
            background: rgba(255, 0, 85, 0.15);
            border: 2px solid #ff0055;
            color: #ffffff;
            padding: 10px 20px;
            border-radius: 14px;
            font-size: 0.9rem;
            font-weight: 800;
            cursor: pointer;
            transition: all 0.25s ease;
        }

        .btn-finish-top:hover {
            background: rgba(255, 0, 85, 0.4);
            box-shadow: 0 0 20px #ff0055;
        }

        .question-text {
            font-size: 1.3rem;
            font-weight: 700;
            line-height: 1.5;
            margin-bottom: 20px;
            color: #ffffff;
        }

        .diagram-container {
            display: flex;
            justify-content: center;
            align-items: center;
            margin-bottom: 20px;
            background: rgba(0, 0, 0, 0.35);
            border-radius: 16px;
            padding: 15px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .options-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-bottom: 20px;
        }

        .btn-option {
            background: rgba(30, 15, 60, 0.7);
            border: 2px solid rgba(255, 255, 255, 0.2);
            border-radius: 16px;
            padding: 16px 20px;
            font-size: 1.1rem;
            font-weight: 700;
            color: #ffffff;
            cursor: pointer;
            text-align: left;
            transition: all 0.2s ease;
            outline: none;
        }

        .btn-option:hover:not(:disabled) {
            border-color: #00f3ff;
            background: rgba(0, 243, 255, 0.15);
            box-shadow: 0 0 15px rgba(0, 243, 255, 0.4);
        }

        .btn-option.correct {
            border-color: #00ff66 !important;
            background: rgba(0, 255, 102, 0.25) !important;
            box-shadow: 0 0 20px #00ff66 !important;
        }

        .btn-option.incorrect {
            border-color: #ff0055 !important;
            background: rgba(255, 0, 85, 0.25) !important;
            box-shadow: 0 0 20px #ff0055 !important;
        }

        .explanation-box {
            display: none;
            background: rgba(255, 0, 85, 0.1);
            border: 2px solid #ff0055;
            box-shadow: 0 0 15px rgba(255, 0, 85, 0.3);
            border-radius: 16px;
            padding: 18px;
            margin-top: 15px;
            margin-bottom: 20px;
            font-size: 1rem;
            line-height: 1.5;
            color: #ffe6ee;
            animation: screenIn 0.3s ease-out;
        }

        .explanation-box.active { display: block; }

        .explanation-title {
            font-weight: 800;
            color: #ff0055;
            margin-bottom: 5px;
            text-transform: uppercase;
            font-size: 0.9rem;
        }

        .quiz-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-top: 15px;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
        }

        .btn-next {
            background: rgba(15, 8, 35, 0.95);
            border: 2.5px solid #ffd700;
            box-shadow: 0 0 18px rgba(255, 215, 0, 0.5);
            color: #ffffff;
            padding: 12px 24px;
            border-radius: 16px;
            font-size: 1rem;
            font-weight: 800;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 10px;
            transition: all 0.25s ease;
            margin-left: auto;
        }

        .btn-next:hover {
            transform: scale(1.04);
            box-shadow: 0 0 25px #ffd700;
            background: rgba(255, 215, 0, 0.25);
        }

        .results-list {
            width: 100%;
            max-height: 60vh;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 15px;
            padding-right: 10px;
            margin-bottom: 25px;
        }

        .result-item-card {
            background: rgba(20, 10, 45, 0.85);
            border: 2px solid rgba(255, 255, 255, 0.15);
            border-radius: 16px;
            padding: 18px;
            text-align: left;
        }

        .result-item-card.is-correct { border-color: #00ff66; box-shadow: 0 0 10px rgba(0, 255, 102, 0.2); }
        .result-item-card.is-incorrect { border-color: #ff0055; box-shadow: 0 0 10px rgba(255, 0, 85, 0.2); }
        .result-item-card.is-skipped { border-color: #ffd700; box-shadow: 0 0 10px rgba(255, 215, 0, 0.2); }

        .status-badge {
            display: inline-block;
            padding: 4px 10px;
            border-radius: 8px;
            font-weight: 800;
            font-size: 0.8rem;
            margin-bottom: 8px;
            text-transform: uppercase;
        }

        .badge-correct { background: rgba(0, 255, 102, 0.2); color: #00ff66; border: 1px solid #00ff66; }
        .badge-incorrect { background: rgba(255, 0, 85, 0.2); color: #ff0055; border: 1px solid #ff0055; }
        .badge-skipped { background: rgba(255, 215, 0, 0.2); color: #ffd700; border: 1px solid #ffd700; }

        .btn-restart {
            background: rgba(191, 0, 255, 0.2);
            border: 2.5px solid #bf00ff;
            box-shadow: 0 0 20px rgba(191, 0, 255, 0.5);
            color: #ffffff;
            padding: 14px 36px;
            border-radius: 18px;
            font-size: 1.2rem;
            font-weight: 800;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .btn-restart:hover {
            transform: scale(1.05);
            box-shadow: 0 0 35px #bf00ff;
            background: rgba(191, 0, 255, 0.4);
        }

        .toast {
            position: fixed;
            top: 25px;
            left: 50%;
            transform: translateX(-50%) translateY(-100px);
            background: rgba(20, 10, 40, 0.95);
            border: 2px solid #ff007f;
            box-shadow: 0 0 20px #ff007f;
            color: #fff;
            padding: 12px 24px;
            border-radius: 16px;
            font-weight: 800;
            font-size: 1rem;
            z-index: 1000;
            opacity: 0;
            transition: all 0.4s ease;
        }

        .toast.show {
            transform: translateX(-50%) translateY(0);
            opacity: 1;
        }

        .modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(5, 2, 15, 0.85);
            backdrop-filter: blur(8px);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }

        .modal-overlay.active {
            display: flex;
            animation: screenIn 0.25s ease-out;
        }

        .modal-card {
            background: rgba(18, 9, 38, 0.95);
            border: 2.5px solid #ff007f;
            box-shadow: 0 0 30px rgba(255, 0, 127, 0.5);
            border-radius: 22px;
            padding: 28px;
            max-width: 400px;
            width: 90%;
            text-align: center;
        }

        .modal-title {
            font-size: 1.2rem;
            font-weight: 800;
            margin-bottom: 20px;
            color: #ffffff;
            line-height: 1.4;
        }

        .modal-buttons {
            display: flex;
            gap: 12px;
            justify-content: center;
        }

        .btn-modal {
            flex: 1;
            padding: 12px 18px;
            border-radius: 14px;
            font-size: 1rem;
            font-weight: 800;
            cursor: pointer;
            border: 2.5px solid;
            transition: all 0.25s ease;
        }

        .btn-modal-yes {
            background: rgba(0, 255, 102, 0.2);
            border-color: #00ff66;
            color: #ffffff;
        }

        .btn-modal-yes:hover { background: rgba(0, 255, 102, 0.45); box-shadow: 0 0 20px #00ff66; }

        .btn-modal-no {
            background: rgba(255, 0, 85, 0.2);
            border-color: #ff0055;
            color: #ffffff;
        }

        .btn-modal-no:hover { background: rgba(255, 0, 85, 0.45); box-shadow: 0 0 20px #ff0055; }

        @media (max-width: 650px) {
            .title { font-size: 1.6rem; }
            .subjects-row { flex-direction: column; }
            .count-grid { grid-template-columns: repeat(2, 1fr); }
            .options-grid { grid-template-columns: 1fr; }
            .quiz-card { padding: 20px 18px; }
        }
    </style>
</head>
<body>

    <div class="toast" id="toast">Повідомлення</div>
    <div class="background-objects" id="bg-container"></div>

    <!-- 1. ВИБІР ПРЕДМЕТА -->
    <div class="screen active" id="screen-subject">
        <h1 class="title">Оберіть предмет</h1>
        <div class="buttons-wrapper">
            <div class="subjects-row">
                <button class="btn-subject btn-algebra" onclick="selectSubject('algebra')">
                    <span class="subject-icon">√x</span>
                    <span>Алгебра</span>
                    <span class="subject-desc">Істер 9 клас НУШ — Нерівності</span>
                </button>
                <button class="btn-subject btn-geometry" onclick="selectSubject('geometry')">
                    <span class="subject-icon">∠α</span>
                    <span>Геометрія</span>
                    <span class="subject-desc">Істер 8 клас НУШ — Повторення</span>
                </button>
                <button class="btn-subject btn-physics" onclick="selectSubject('physics')">
                    <span class="subject-icon">E=mc²</span>
                    <span>Фізика</span>
                    <span class="subject-desc">Бар'яхтар 9 клас — Струм у металах</span>
                </button>
            </div>
        </div>
    </div>

    <!-- 2. ВИБІР КІЛЬКОСТІ ЗАВДАНЬ -->
    <div class="screen" id="screen-count">
        <h1 class="title">Кількість завдань</h1>
        <div class="count-grid">
            <button class="btn-count" onclick="startTest(5)">5</button>
            <button class="btn-count" onclick="startTest(10)">10</button>
            <button class="btn-count" onclick="startTest(15)">15</button>
            <button class="btn-count" onclick="startTest(20)">20</button>
            <button class="btn-count" onclick="startTest(25)">25</button>
            <button class="btn-count" onclick="startTest(30)">30</button>
            <button class="btn-count" onclick="startTest(35)">35</button>
            <button class="btn-count" onclick="startTest(40)">40</button>
            <button class="btn-count" onclick="startTest(45)">45</button>
            <button class="btn-count" onclick="startTest(50)">50</button>
        </div>
        <button class="btn-back" onclick="resetToHome()">
            <span>← На головне меню</span>
        </button>
    </div>

    <!-- 3. ТЕСТУВАННЯ -->
    <div class="screen" id="screen-quiz">
        <div class="quiz-card">
            <div class="quiz-header">
                <span id="quiz-progress">Завдання 1 з 10</span>
                <span id="quiz-topic" style="color: #00f3ff;">Тема: ...</span>
            </div>
            
            <div class="question-text" id="question-text">Текст питання...</div>
            <div class="diagram-container" id="diagram-container"></div>
            <div class="options-grid" id="options-grid"></div>

            <div class="explanation-box" id="explanation-box">
                <div class="explanation-title">Пояснення:</div>
                <div id="explanation-text">...</div>
            </div>

            <div class="quiz-footer">
                <button class="btn-finish-top" onclick="showConfirmModal()">Завершити тест</button>
                <button class="btn-next" id="btn-next" onclick="skipQuestion()">
                    <span>Пропустити</span>
                    <span>➔</span>
                </button>
            </div>
        </div>
    </div>

    <!-- 4. РЕЗУЛЬТАТИ -->
    <div class="screen" id="screen-results">
        <h1 class="title">Результати тесту</h1>
        <div class="results-list" id="results-list"></div>
        <button class="btn-restart" onclick="resetToHome()">На головну</button>
    </div>

    <!-- МОДАЛЬНЕ ВІКНО -->
    <div class="modal-overlay" id="confirm-modal">
        <div class="modal-card">
            <div class="modal-title">Ви дійсно бажаєте достроково завершити тест?</div>
            <div class="modal-buttons">
                <button class="btn-modal btn-modal-yes" onclick="confirmFinishTest()">Так</button>
                <button class="btn-modal btn-modal-no" onclick="closeConfirmModal()">Ні</button>
            </div>
        </div>
    </div>

    <script>
        const schoolSuppliesIcons = ['pencil', 'book-open', 'ruler', 'scissors', 'backpack', 'calculator', 'paperclip', 'bookmark', 'file-text', 'graduation-cap'];

        function renderBackground(iconsList) {
            const bgContainer = document.getElementById('bg-container');
            bgContainer.innerHTML = '';
            const fragment = document.createDocumentFragment();
            const colorClasses = ['neon-cyan', 'neon-purple', 'neon-pink'];
            const coords = [
                {x: 7, y: 10, r: -25}, {x: 22, y: 14, r: 18}, {x: 38, y: 8, r: -12}, {x: 54, y: 12, r: 30}, {x: 72, y: 9, r: -15}, {x: 90, y: 13, r: 22},
                {x: 12, y: 32, r: 35}, {x: 28, y: 35, r: -20}, {x: 45, y: 28, r: 15}, {x: 62, y: 33, r: -30}, {x: 82, y: 30, r: 10},
                {x: 6, y: 58, r: -18}, {x: 20, y: 62, r: 25}, {x: 80, y: 55, r: -22}, {x: 94, y: 60, r: 16},
                {x: 10, y: 85, r: 20}, {x: 26, y: 88, r: -28}, {x: 42, y: 82, r: 14}, {x: 58, y: 89, r: -18}, {x: 74, y: 84, r: 32}, {x: 90, y: 87, r: -10}
            ];

            coords.forEach((pt, idx) => {
                const item = document.createElement('div');
                item.className = `bg-item d-${(idx % 4) + 1}`;
                item.style.left = `${pt.x}%`;
                item.style.top = `${pt.y}%`;
                item.style.setProperty('--rot', `${pt.r}deg`);
                const icon = iconsList[idx % iconsList.length];
                const color = colorClasses[idx % colorClasses.length];
                item.innerHTML = `<i data-lucide="${icon}" class="neon-icon ${color}"></i>`;
                fragment.appendChild(item);
            });

            bgContainer.appendChild(fragment);
            lucide.createIcons();
        }

        renderBackground(schoolSuppliesIcons);

        function showToast(msg) {
            const toast = document.getElementById('toast');
            toast.innerText = msg;
            toast.classList.add('show');
            setTimeout(() => toast.classList.remove('show'), 3000);
        }

        let currentSubject = 'algebra';
        let totalQuestionsCount = 10;
        let currentQuestionIndex = 0;
        let questionsData = [];
        let userAnswers = [];
        let autoNextTimer = null;
        let isAnswered = false;

        function selectSubject(subject) {
            currentSubject = subject;
            showScreen('screen-count');
        }

        function showScreen(screenId) {
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            document.getElementById(screenId).classList.add('active');
        }

        function showConfirmModal() { document.getElementById('confirm-modal').classList.add('active'); }
        function closeConfirmModal() { document.getElementById('confirm-modal').classList.remove('active'); }

        function confirmFinishTest() {
            clearTimeout(autoNextTimer);
            closeConfirmModal();
            finishTest();
        }

        // SVG Генератори для завдань
        function drawRaySVG(val, isClosed, directionRight) {
            const circleFill = isClosed ? "#00f3ff" : "#070414";
            const lineStartX = directionRight ? 130 : 25;
            const lineEndX = directionRight ? 255 : 130;

            return `<svg width="280" height="85" viewBox="0 0 280 85">
                <line x1="15" y1="45" x2="255" y2="45" stroke="#bf00ff" stroke-width="3"/>
                <polygon points="255,40 268,45 255,50" fill="#bf00ff"/>
                <text x="260" y="65" fill="#bf00ff" font-weight="800" font-size="14">x</text>
                <line x1="${lineStartX}" y1="45" x2="${lineEndX}" y2="45" stroke="#00f3ff" stroke-width="7" opacity="0.85"/>
                <circle cx="130" cy="45" r="7" fill="${circleFill}" stroke="#00f3ff" stroke-width="3"/>
                <text x="124" y="70" fill="#00f3ff" font-weight="800" font-size="15">${val}</text>
            </svg>`;
        }

        function drawDoubleIntervalSVG(valA, valB, isClosedA, isClosedB) {
            const fillA = isClosedA ? "#00f3ff" : "#070414";
            const fillB = isClosedB ? "#00f3ff" : "#070414";

            return `<svg width="280" height="85" viewBox="0 0 280 85">
                <line x1="15" y1="45" x2="255" y2="45" stroke="#bf00ff" stroke-width="3"/>
                <polygon points="255,40 268,45 255,50" fill="#bf00ff"/>
                <text x="260" y="65" fill="#bf00ff" font-weight="800" font-size="14">x</text>
                <line x1="85" y1="45" x2="195" y2="45" stroke="#00f3ff" stroke-width="7" opacity="0.85"/>
                <circle cx="85" cy="45" r="7" fill="${fillA}" stroke="#00f3ff" stroke-width="3"/>
                <text x="78" y="70" fill="#00f3ff" font-weight="800" font-size="14">${valA}</text>
                <circle cx="195" cy="45" r="7" fill="${fillB}" stroke="#00f3ff" stroke-width="3"/>
                <text x="188" y="70" fill="#00f3ff" font-weight="800" font-size="14">${valB}</text>
            </svg>`;
        }

        function drawRightTriangleSVG(hyp) {
            return `<svg width="200" height="110" viewBox="0 0 200 110">
                <polygon points="30,90 170,90 30,20" fill="rgba(0, 243, 255, 0.1)" stroke="#00f3ff" stroke-width="3"/>
                <rect x="30" y="75" width="15" height="15" fill="none" stroke="#ff007f" stroke-width="2"/>
                <text x="160" y="80" fill="#ffd700" font-weight="800" font-size="13">30°</text>
                <text x="100" y="45" fill="#00f3ff" font-weight="800" font-size="14">c = ${hyp} см</text>
            </svg>`;
        }

        function drawAdjacentAnglesSVG(deg) {
            return `<svg width="220" height="100" viewBox="0 0 220 100">
                <line x1="20" y1="80" x2="200" y2="80" stroke="#bf00ff" stroke-width="3"/>
                <line x1="110" y1="80" x2="160" y2="20" stroke="#00f3ff" stroke-width="3"/>
                <text x="130" y="70" fill="#00f3ff" font-weight="800" font-size="13">${deg}°</text>
                <text x="75" y="70" fill="#ff007f" font-weight="800" font-size="14">?</text>
            </svg>`;
        }

        // БАНКИ ЗАВДАНЬ ПО ПРЕДМЕТАХ
        const algebraGenerators = [
            () => {
                const a = 2 + Math.floor(Math.random() * 4);
                const res = Math.floor(Math.random() * 8) - 3;
                const b = a * res;
                return {
                    topic: "Алгебра 9 клас — Нерівності (Істер)",
                    text: `Розв'яжіть лінійну нерівність: ${a}x - ${b} ≥ 0`,
                    diagram: drawRaySVG(res, true, true),
                    correctVal: `x ≥ ${res}  (або  x ∈ [${res}; +∞))`,
                    wrongs: [`x ≤ ${res}  (або  x ∈ (-∞; ${res}])`, `x > ${res}  (або  x ∈ (${res}; +∞))`, `x ≥ -${res}`],
                    explanation: `Перенесемо число: ${a}x ≥ ${b}. Поділимо на ${a}: x ≥ ${res}. У вигляді числового проміжку це заштрихований промінь [${res}; +∞).`
                };
            },
            () => {
                const min = Math.floor(Math.random() * 4) + 1;
                const max = min + Math.floor(Math.random() * 4) + 2;
                return {
                    topic: "Алгебра 9 клас — Числові проміжки",
                    text: `Укажіть числовий проміжок, що відповідає зображеній на малюнку подвійній нерівності для x:`,
                    diagram: drawDoubleIntervalSVG(min, max, true, false),
                    correctVal: `[${min}; ${max})   тобто  ${min} ≤ x < ${max}`,
                    wrongs: [`(${min}; ${max}]   тобто  ${min} < x ≤ ${max}`, `[${min}; ${max}]   тобто  ${min} ≤ x ≤ ${max}`, `(${min}; ${max})   тобто  ${min} < x < ${max}`],
                    explanation: `Зафарбована точка утворює квадратну дужку [${min}, а виколота точка біля ${max} — круглу дужку ${max}).Отже, [${min}; ${max}).`
                };
            },
            () => {
                const minA = 2, maxA = 5;
                const minB = 1, maxB = 4;
                return {
                    topic: "Алгебра 9 клас — Властивості числових нерівностей",
                    text: `Відомо, що ${minA} < a < ${maxA} та ${minB} < b < ${maxB}. Оцініть значення виразу a + b.`,
                    diagram: "",
                    correctVal: `${minA + minB} < a + b < ${maxA + maxB}`,
                    wrongs: [`${minA * minB} < a + b < ${maxA * maxB}`, `${minA} < a + b < ${maxB}`, `${minA + maxA} < a + b < ${minB + maxB}`],
                    explanation: `Нерівності однакового знака можна почленно додавати: (${minA}+${minB}) < a+b < (${maxA}+${maxB}) ⇒ ${minA + minB} < a + b < ${maxA + maxB}.`
                };
            },
            () => {
                const a = Math.floor(Math.random() * 5) + 1;
                return {
                    topic: "Алгебра 9 клас — Системи лінійних нерівностей",
                    text: `Знайдіть розв'язок системи нерівностей: { x + ${a} > 0, x - 3 ≤ 1 }`,
                    diagram: "",
                    correctVal: `-${a} < x ≤ 4   (тобто  x ∈ (-${a}; 4])`,
                    wrongs: [`x > -${a}`, `x ≤ 4`, `-${a} ≤ x < 4`],
                    explanation: `З першої нерівності: x > -${a}. З другої: x ≤ 4. Спільний розв'язок: -${a} < x ≤ 4 або проміжок (-${a}; 4].`
                };
            }
        ];

        const geometryGenerators = [
            () => {
                const deg = (Math.floor(Math.random() * 8) + 4) * 10;
                const ans = 180 - deg;
                return {
                    topic: "Геометрія 8 клас — Повторення: Суміжні кути",
                    text: `Один із суміжних кутів дорівнює ${deg}°. Знайдіть градусну міру іншого кута.`,
                    diagram: drawAdjacentAnglesSVG(deg),
                    correctVal: `${ans}°`,
                    wrongs: [`${deg}°`, `${90 - Math.floor(deg/2)}°`, `${180 + deg}°`],
                    explanation: `Сума суміжних кутів завжди дорівнює 180°. Отже, другий кут: 180° - ${deg}° = ${ans}°.`
                };
            },
            () => {
                const hyp = (Math.floor(Math.random() * 6) + 2) * 2;
                const leg = hyp / 2;
                return {
                    topic: "Геометрія 8 клас — Повторення: Прямокутний трикутник",
                    text: `У прямокутному трикутнику гіпотенуза c = ${hyp} см, а один із гострих кутів дорівнює 30°. Знайдіть катет, що лежить проти цього кута.`,
                    diagram: drawRightTriangleSVG(hyp),
                    correctVal: `${leg} см`,
                    wrongs: [`${hyp} см`, `${leg * 3} см`, `${leg + 2} см`],
                    explanation: `За властивістю прямокутного трикутника, катет, що лежить проти кута 30°, дорівнює половині гіпотенузи: ${hyp} / 2 = ${leg} см.`
                };
            },
            () => {
                const ratioSum = 2 + 3 + 4;
                const part = 180 / ratioSum;
                const maxAngle = 4 * part;
                return {
                    topic: "Геометрія 8 клас — Повторення: Сума кутів трикутника",
                    text: `Кути трикутника відносяться як 2 : 3 : 4. Знайдіть градусну міру найбільшого кута.`,
                    diagram: "",
                    correctVal: `${maxAngle}°`,
                    wrongs: [`40°`, `60°`, `100°`],
                    explanation: `Сума кутів трикутника 180°. Сума частин: 2+3+4 = 9. Одна частина: 180°/9 = 20°. Найбільший кут: 4 · 20° = ${maxAngle}°.`
                };
            }
        ];

        const physicsGenerators = [
            () => {
                return {
                    topic: "Фізика 9 клас (Бар'яхтар) — Струм у металах",
                    text: `Які частинки є носіями електричного заряду в металевих провідниках?`,
                    diagram: "",
                    correctVal: `Вільні електрони ("електронний газ")`,
                    wrongs: [`Позитивні та негативні іони`, `Лише позитивні іони`, `Електрони та дірки`],
                    explanation: `У металах кристалічна ґратка складається з позитивних іонів, а між ними вільно рухаються електрони, що відірвалися від атомів.`
                };
            },
            () => {
                return {
                    topic: "Фізика 9 клас (Бар'яхтар) — Струм у металах",
                    text: `Як змінюється електричний опір металевого провідника під час його нагрівання?`,
                    diagram: "",
                    correctVal: `Збільшується`,
                    wrongs: [`Зменшується`, `Не змінюється`, `Спочатку зменшується, потім зростає`],
                    explanation: `При нагріванні іони у вузлах кристалічної ґратки коливаються інтенсивніше, що створює більший опір руху вільних електронів.`
                };
            },
            () => {
                return {
                    topic: "Фізика 9 клас (Бар'яхтар) — Надпровідність",
                    text: `У чому полягає сутність явища надпровідності?`,
                    diagram: "",
                    correctVal: `Повна втрата електричного опору при охолодженні до критичної температури`,
                    wrongs: [
                        `Різке зростання опору при охолодженні`,
                        `Виділення максимальної кількості тепла при проходженні струму`,
                        `Здатність металу випромінювати світло під дією струму`
                    ],
                    explanation: `Надпровідність — це стан речовини, за якого її електричний опір падає строго до нуля при зниженні температури нижче T_кр.`
                };
            },
            () => {
                return {
                    topic: "Фізика 9 клас (Бар'яхтар) — Надпровідність",
                    text: `Хто і коли вперше відкрив явище надпровідності (на прикладі ртуті, охолодженої рідким гелієм)?`,
                    diagram: "",
                    correctVal: `Гейке Камерлінг-Оннес (1911 р.)`,
                    wrongs: [`Георг Ом (1826 р.)`, `Алессандро Вольта (1800 р.)`, `Майкл Фарадей (1831 р.)`],
                    explanation: `Голландський фізик Гейке Камерлінг-Оннес у 1911 році виявив, що при охолодженні ртуті до 4.2 К її опір раптово падає до нуля.`
                };
            }
        ];

        function shuffleArray(arr) {
            const copy = [...arr];
            for (let i = copy.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [copy[i], copy[j]] = [copy[j], copy[i]];
            }
            return copy;
        }

        function startTest(count) {
            totalQuestionsCount = count;
            currentQuestionIndex = 0;
            userAnswers = [];

            let pool = algebraGenerators;
            if (currentSubject === 'geometry') pool = geometryGenerators;
            if (currentSubject === 'physics') pool = physicsGenerators;

            questionsData = [];
            for (let i = 0; i < count; i++) {
                const gen = pool[i % pool.length];
                questionsData.push(gen());
            }

            showScreen('screen-quiz');
            renderQuestion();
        }

        function renderQuestion() {
            isAnswered = false;
            clearTimeout(autoNextTimer);

            const q = questionsData[currentQuestionIndex];

            document.getElementById('quiz-progress').innerText = `Завдання ${currentQuestionIndex + 1} з ${totalQuestionsCount}`;
            document.getElementById('quiz-topic').innerText = q.topic;
            document.getElementById('question-text').innerText = q.text;

            const diagBox = document.getElementById('diagram-container');
            if (q.diagram) {
                diagBox.style.display = 'flex';
                diagBox.innerHTML = q.diagram;
            } else {
                diagBox.style.display = 'none';
                diagBox.innerHTML = '';
            }

            const optionsBox = document.getElementById('options-grid');
            optionsBox.innerHTML = '';

            const allOptions = shuffleArray([q.correctVal, ...q.wrongs]);
            allOptions.forEach(opt => {
                const btn = document.createElement('button');
                btn.className = 'btn-option';
                btn.innerText = opt;
                btn.onclick = () => handleAnswer(btn, opt, q.correctVal, q.explanation);
                optionsBox.appendChild(btn);
            });

            const expBox = document.getElementById('explanation-box');
            expBox.classList.remove('active');
            expBox.style.display = 'none';

            const btnNext = document.getElementById('btn-next');
            btnNext.innerHTML = '<span>Пропустити</span> <span>➔</span>';
        }

        function handleAnswer(selectedBtn, selectedVal, correctVal, explanation) {
            if (isAnswered) return;
            isAnswered = true;

            const allBtns = document.querySelectorAll('.btn-option');
            allBtns.forEach(b => b.disabled = true);

            const isCorrect = selectedVal === correctVal;

            if (isCorrect) {
                selectedBtn.classList.add('correct');
                userAnswers.push({
                    status: 'correct',
                    question: questionsData[currentQuestionIndex],
                    userAns: selectedVal,
                    correctAns: correctVal
                });
            } else {
                selectedBtn.classList.add('incorrect');
                allBtns.forEach(b => {
                    if (b.innerText === correctVal) b.classList.add('correct');
                });

                const expBox = document.getElementById('explanation-box');
                document.getElementById('explanation-text').innerText = explanation;
                expBox.style.display = 'block';
                expBox.classList.add('active');

                userAnswers.push({
                    status: 'incorrect',
                    question: questionsData[currentQuestionIndex],
                    userAns: selectedVal,
                    correctAns: correctVal
                });
            }

            const btnNext = document.getElementById('btn-next');
            btnNext.innerHTML = '<span>Далі</span> <span>➔</span>';

            autoNextTimer = setTimeout(() => {
                skipQuestion(true);
            }, 3500);
        }

        function skipQuestion(fromAuto = false) {
            clearTimeout(autoNextTimer);

            if (!isAnswered && !fromAuto) {
                userAnswers.push({
                    status: 'skipped',
                    question: questionsData[currentQuestionIndex],
                    userAns: 'Пропущено',
                    correctAns: questionsData[currentQuestionIndex].correctVal
                });
            }

            currentQuestionIndex++;
            if (currentQuestionIndex < totalQuestionsCount) {
                renderQuestion();
            } else {
                finishTest();
            }
        }

        function finishTest() {
            clearTimeout(autoNextTimer);
            showScreen('screen-results');

            const resultsList = document.getElementById('results-list');
            resultsList.innerHTML = '';

            let correctCount = 0;

            userAnswers.forEach((ans, idx) => {
                const card = document.createElement('div');
                card.className = `result-item-card is-${ans.status}`;

                let badgeText = '';
                let badgeClass = '';

                if (ans.status === 'correct') {
                    badgeText = 'Правильно';
                    badgeClass = 'badge-correct';
                    correctCount++;
                } else if (ans.status === 'incorrect') {
                    badgeText = 'Неправильно';
                    badgeClass = 'badge-incorrect';
                } else {
                    badgeText = 'Пропущено';
                    badgeClass = 'badge-skipped';
                }

                card.innerHTML = `
                    <span class="status-badge ${badgeClass}">${badgeText}</span>
                    <div style="font-weight: 700; margin-bottom: 8px;">№${idx + 1}. ${ans.question.text}</div>
                    <div style="font-size: 0.95rem; opacity: 0.9;">Ваша відповідь: <b>${ans.userAns}</b></div>
                    <div style="font-size: 0.95rem; opacity: 0.9;">Правильна відповідь: <b style="color: #00ff66;">${ans.correctAns}</b></div>
                    ${ans.status !== 'correct' ? `<div style="font-size: 0.9rem; margin-top: 8px; color: #ffe6ee;"><b>Пояснення:</b> ${ans.question.explanation}</div>` : ''}
                `;
                resultsList.appendChild(card);
            });

            showToast(`Тест завершено! Результат: ${correctCount} з ${userAnswers.length}`);
        }

        function resetToHome() {
            clearTimeout(autoNextTimer);
            showScreen('screen-subject');
        }
    </script>
</body>
</html>

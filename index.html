<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Математика 9 Клас</title>
    <!-- Шрифт Montserrat -->
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;800;900&display=swap" rel="stylesheet">
    <!-- Иконки Lucide -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Montserrat', sans-serif;
        }

        body {
            min-height: 100vh;
            width: 100vw;
            background: radial-gradient(circle at center, #180830 0%, #070414 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            position: relative;
            color: #ffffff;
        }

        /* --- ФОН С РАВНОМЕРНЫМ ЗАПОЛНЕНИЕМ --- */
        .background-objects {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            pointer-events: none;
            z-index: 1;
            overflow: hidden;
        }

        .bg-item {
            position: absolute;
            user-select: none;
            transform: translate(-50%, -50%); /* Точная центровка для сохранения дистанции */
            animation: float infinite alternate ease-in-out;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* Неоновое свечение стикеров */
        .neon-icon {
            width: 44px;
            height: 44px;
            stroke-width: 2.2px;
            opacity: 0.55;
        }

        .neon-cyan {
            stroke: #00f3ff;
            color: #00f3ff;
            filter: drop-shadow(0 0 2px #ffffff) drop-shadow(0 0 6px #00f3ff) drop-shadow(0 0 14px #00f3ff);
        }

        .neon-purple {
            stroke: #bf00ff;
            color: #bf00ff;
            filter: drop-shadow(0 0 2px #ffffff) drop-shadow(0 0 6px #bf00ff) drop-shadow(0 0 14px #bf00ff);
        }

        .neon-pink {
            stroke: #ff007f;
            color: #ff007f;
            filter: drop-shadow(0 0 2px #ffffff) drop-shadow(0 0 6px #ff007f) drop-shadow(0 0 14px #ff007f);
        }

        /* Анимация движения */
        @keyframes float {
            0% {
                transform: translate(-50%, -50%) translateY(0px) rotate(var(--base-rotate)) scale(1);
            }
            100% {
                transform: translate(-50%, -50%) translateY(-18px) rotate(calc(var(--base-rotate) + 12deg)) scale(1.06);
            }
        }

        /* --- ЦЕНТРАЛЬНЫЙ БЛОК МЕНЮ --- */
        .main-container {
            position: relative;
            z-index: 2;
            text-align: center;
            width: 100%;
            max-width: 900px;
            padding: 20px;
        }

        .title {
            font-size: 3.2rem;
            font-weight: 900;
            margin-bottom: 50px;
            color: #ffffff;
            text-transform: uppercase;
            letter-spacing: 2px;
            text-shadow: 0 0 10px #bf00ff, 0 0 20px #bf00ff, 0 0 40px #00f3ff;
        }

        .buttons-wrapper {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 30px;
            flex-wrap: wrap;
        }

        .btn-subject {
            background: rgba(15, 8, 35, 0.85);
            border: 3px solid;
            border-radius: 20px;
            padding: 18px 35px;
            font-size: 1.8rem;
            font-weight: 800;
            color: #ffffff;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 15px;
            backdrop-filter: blur(10px);
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            outline: none;
            user-select: none;
        }

        .btn-geometry {
            border-color: #00f3ff;
            box-shadow: 0 0 15px rgba(0, 243, 255, 0.4), inset 0 0 15px rgba(0, 243, 255, 0.2);
        }

        .btn-algebra {
            border-color: #bf00ff;
            box-shadow: 0 0 15px rgba(191, 0, 255, 0.4), inset 0 0 15px rgba(191, 0, 255, 0.2);
        }

        .btn-geometry:hover {
            transform: scale(1.08);
            box-shadow: 0 0 30px rgba(0, 243, 255, 0.9), inset 0 0 20px rgba(0, 243, 255, 0.5);
            background: rgba(0, 243, 255, 0.2);
        }

        .btn-algebra:hover {
            transform: scale(1.08);
            box-shadow: 0 0 30px rgba(191, 0, 255, 0.9), inset 0 0 20px rgba(191, 0, 255, 0.5);
            background: rgba(191, 0, 255, 0.2);
        }

        .btn-subject:active {
            transform: scale(0.98);
        }

        .btn-icon-normal {
            font-size: 2rem;
            line-height: 1;
            filter: none !important;
        }

        .math-symbol {
            font-family: serif;
            font-style: italic;
            font-weight: bold;
            font-size: 1.8rem;
            filter: none !important;
        }

        @media (max-width: 650px) {
            .title { font-size: 2.2rem; }
            .buttons-wrapper { flex-direction: column; }
            .btn-subject { width: 100%; font-size: 1.4rem; }
        }
    </style>
</head>
<body>

    <!-- Контейнер для фоновых предметов -->
    <div class="background-objects" id="bg-container"></div>

    <!-- Главное меню -->
    <div class="main-container">
        <h1 class="title">Оберіть предмет</h1>
        
        <div class="buttons-wrapper">
            <button class="btn-subject btn-geometry">
                <span class="btn-icon-normal">📐</span>
                <span>Геометрія</span>
                <span class="btn-icon-normal">✏️</span>
            </button>

            <button class="btn-subject btn-algebra">
                <span class="btn-icon-normal">✏️</span>
                <span>Алгебра</span>
                <span class="math-symbol">√x</span>
            </button>
        </div>
    </div>

    <script>
        const itemsList = ['ruler', 'pencil', 'eraser', 'book-open', 'calculator', 'backpack', 'scissors'];
        const colorClasses = ['neon-cyan', 'neon-purple', 'neon-pink'];
        const bgContainer = document.getElementById('bg-container');

        // Сетка 5 строк на 8 колонок — обеспечивает 100% покрытие экрана без пустот
        const rows = 5;
        const cols = 8;

        const cellWidth = 100 / cols;
        const cellHeight = 100 / rows;

        for (let r = 0; r < rows; r++) {
            for (let c = 0; c < cols; c++) {
                const item = document.createElement('div');
                item.className = 'bg-item';

                // Центр ячейки + контролируемый сдвиг (до ±35% размера ячейки), чтобы иконки не накладывались
                const offsetX = (Math.random() - 0.5) * (cellWidth * 0.7);
                const offsetY = (Math.random() - 0.5) * (cellHeight * 0.7);

                const posX = (c + 0.5) * cellWidth + offsetX;
                const posY = (r + 0.5) * cellHeight + offsetY;

                const randomRotate = Math.floor(Math.random() * 90) - 45; // Поворот от -45° до 45°
                const randomDuration = (4.5 + Math.random() * 3.5).toFixed(1);
                const randomDelay = (Math.random() * 3).toFixed(1);

                const randomIcon = itemsList[Math.floor(Math.random() * itemsList.length)];
                const randomColor = colorClasses[Math.floor(Math.random() * colorClasses.length)];

                item.style.left = `${posX}%`;
                item.style.top = `${posY}%`;
                item.style.setProperty('--base-rotate', `${randomRotate}deg`);
                item.style.animationDuration = `${randomDuration}s`;
                item.style.animationDelay = `${randomDelay}s`;

                item.innerHTML = `<i data-lucide="${randomIcon}" class="neon-icon ${randomColor}"></i>`;
                bgContainer.appendChild(item);
            }
        }

        lucide.createIcons();
    </script>

</body>
</html>
